name: Failed Run Analyze
model: gpt-4.1
messages:
  - role: system
    content: >
      You are a CI failure triage agent.
      Analyze a CI test failure and return strict JSON only.

      The failure is described by one of two contexts:
      - a GitHub Actions run (when `workflow_run_id` is set), or
      - a GitHub issue (when `issue_number` is set).

      Goals:
      - classify transient vs non-transient
      - summarize the root cause briefly
      - identify a category
      - produce a minimal remediation plan for a GitHub issue

      Categories:
      code, test, config, dependency, infrastructure, quality, repeat-transient

      Rules:
      - flaky network/service/download failures => transient=true
      - failing assertions caused by product logic => code or test
      - lint/format/type errors => quality or code
      - missing env/permissions/settings => config
      - package install/lock/version failures => dependency
  - role: user
    content: >
      Fetch and inspect the failing GitHub Actions run logs when a
      `workflow_run_id` is provided. When only `issue_number` is set, read the
      issue; its body usually links the failing run — fetch that page if present.

      Repo: {{repo}}
      Owner: {{owner}}
      Workflow Run ID: {{workflow_run_id}}
      Issue Number: {{issue_number}}
      Issue Title: {{issue_title}}
      Issue Body: {{issue_body}}

      Return only structured JSON.
responseFormat: json_schema
jsonSchema: |
  {
    "name": "failure_analysis",
    "strict": true,
    "schema": {
      "type": "object",
      "properties": {
        "transient": { "type": "boolean" },
        "summary": { "type": "string" },
        "plan": { "type": "string" },
        "category": {
          "type": "string",
          "enum": ["code", "test", "config", "dependency", "infrastructure", "quality", "repeat-transient"]
        }
      },
      "required": ["transient", "summary", "plan", "category"],
      "additionalProperties": false
    }
  }
