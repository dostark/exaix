name: Auto Remediate Failed CI

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  models: read

jobs:
  remediate:
    runs-on: ubuntu-latest

    steps:
      # Narrow the broad `issues: opened` trigger: an issue only enters the fix
      # pipeline when it is labeled for CI remediation (auto-remediation/ci/bug)
      # AND its title signals a CI/test failure. Non-matching issues stop here
      # after a single cheap API check — no checkout, no model calls.
      - name: Gate on CI remediation label and title
        id: ci-label
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        with:
          script: |
            const title = (process.env.ISSUE_TITLE ?? "").toLowerCase();
            const labels = (github.context.payload.issue.labels ?? [])
              .map((l) => String(l.name ?? "").toLowerCase());

            const hasCiLabel = labels.some((l) =>
              l === "auto-remediation" || l === "ci" || l === "bug"
            );
            const titleSignalsCi = /ci|test|fail/.test(title);

            core.setOutput("is_ci", String(hasCiLabel && titleSignalsCi));

      - name: Checkout repository
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_REMEDIATION_PAT }}
          fetch-depth: 0

      - name: Set up Node
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        run: npm install -g @github/copilot

      - name: Analyze issue
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        id: analyze
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AUTO_REMEDIATION_PAT }}
        with:
          prompt-file: '.github/models/failed-run-analyze.prompt.yml'
          model: gpt-4.1
          token: ${{ secrets.AUTO_REMEDIATION_PAT }}
          input: |
            repo: ${{ github.event.repository.name }}
            owner: ${{ github.event.repository.owner.login }}
            issue_number: ${{ github.event.issue.number }}
            issue_title: ${{ github.event.issue.title }}
            issue_body: ${{ github.event.issue.body }}

      - name: Parse analysis
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        id: parse
        uses: actions/github-script@v7
        env:
          RESPONSE_JSON: ${{ steps.analyze.outputs.response }}
        with:
          script: |
            // actions/ai-inference parses the .prompt.yml jsonSchema field but does
            // not forward it to the Copilot CLI, so the model response is not
            // guaranteed to be strict JSON. Normalize it before parsing: drop any
            // markdown code fences and extract the first balanced JSON object.
            const raw = (process.env.RESPONSE_JSON || '').trim();
            if (!raw) core.setFailed('No response received from analysis step');

            const withoutFences = raw.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
            const start = withoutFences.indexOf('{');
            const end = withoutFences.lastIndexOf('}');
            const jsonText = start === -1 || end <= start
              ? withoutFences
              : withoutFences.slice(start, end + 1);

            let data;
            try {
              data = JSON.parse(jsonText);
            } catch (e) {
              core.setFailed(`Failed to parse analysis response as JSON: ${e.message}\n${raw.slice(0, 2000)}`);
              return;
            }
            core.setOutput('transient', String(data.transient));
            core.setOutput('summary', data.summary || '');
            core.setOutput('plan', data.plan || '');
            core.setOutput('category', data.category || '');

      - name: Stop on transient failure
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'true' }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Transient failure detected; no remediation PR opened."
        env:
          GH_TOKEN: ${{ secrets.AUTO_REMEDIATION_PAT }}

      - name: Create fix branch
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/ci-${{ github.event.issue.number }}

      - name: Fix and open PR
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'false' }}
        id: fix
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AUTO_REMEDIATION_PAT }}
        with:
          model: gpt-4.1
          token: ${{ secrets.AUTO_REMEDIATION_PAT }}
          copilot-allow-tools: 'shell(git:*),write'
          input: |
            repo: ${{ github.event.repository.name }}
            owner: ${{ github.event.repository.owner.login }}
            issue_number: ${{ github.event.issue.number }}
            issue_title: ${{ github.event.issue.title }}
            issue_body: ${{ github.event.issue.body }}
            summary: ${{ steps.parse.outputs.summary }}
            plan: ${{ steps.parse.outputs.plan }}
          prompt: |
            You are an autonomous CI-failure fixer for {{owner}}/{{repo}}.

            The repository is checked out on branch fix/ci-{{issue_number}}. Issue
            #{{issue_number}} reports a CI failure.

            Title: {{issue_title}}
            Body:
            {{issue_body}}

            Analysis summary: {{summary}}
            Suggested plan: {{plan}}

            Requirements:
            - Reproduce the failing test locally. Run the narrowest relevant test
              command (this is a Deno repo: `deno test --allow-all <file>` for a
              specific file, or the package-scoped suite) to confirm the failure.
            - Implement the smallest, safest fix for the root cause.
            - Re-run the narrow test until it passes.
            - Commit the fix with a clear message.
            - Push the branch to origin and open a pull request against the default
              branch that closes issue #{{issue_number}}.
            - Do not weaken or delete tests merely to make CI green.
            - If you cannot reproduce or safely fix the failure, do not push; instead
              report what you found and stop.
