name: Auto Remediate Failed CI

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  copilot-requests: write

jobs:
  remediate:
    runs-on: ubuntu-latest

    steps:
      # Narrow the broad `issues: opened` + `issue_comment: created` triggers: an
      # issue only enters the fix pipeline when it is labeled for CI remediation
      # (auto-remediation/ci/bug) AND its title signals a CI/test failure.
      # `issue_comment` also fires for every PR conversation comment and every
      # human reply on a tracked issue — file-ci-failure-issues.yml posts a
      # "Comment on existing issue" step (never `issues: opened`) each time an
      # already-tracked failure recurs, so without this trigger a repeat failure
      # silently never re-enters remediation once the first issue is filed. Both
      # the automation's comments and a human's replies are posted under the same
      # PAT identity (no bot account to key off), so the only reliable signal is
      # the exact comment body file-ci-failure-issues.yml writes. Non-matching
      # events stop here after a single cheap API check — no checkout, no model calls.
      - name: Gate on CI remediation label and title
        id: ci-label
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = (process.env.ISSUE_TITLE ?? "").toLowerCase();
            let labels = [];
            try {
              labels = JSON.parse(process.env.ISSUE_LABELS ?? "[]")
                .map((l) => String(l.name ?? "").toLowerCase());
            } catch {
              labels = [];
            }

            const hasCiLabel = labels.some((l) =>
              l === "auto-remediation" || l === "ci" || l === "bug"
            );
            const titleSignalsCi = /ci|test|fail/.test(title);

            // For issue_comment: only the automation's own repeat-failure comment
            // ("Another failing run of <workflow>: <url>", written by
            // file-ci-failure-issues.yml) re-enters the pipeline — never a PR
            // conversation comment, and never an arbitrary human reply.
            let commentSignalsRetrigger = true;
            if (process.env.EVENT_NAME === "issue_comment") {
              const isPrComment = process.env.IS_PR_COMMENT === "true";
              const commentBody = process.env.COMMENT_BODY ?? "";
              commentSignalsRetrigger = !isPrComment && commentBody.startsWith("Another failing run of ");
            }

            core.setOutput("is_ci", String(hasCiLabel && titleSignalsCi && commentSignalsRetrigger));

      - name: Checkout repository
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_REMEDIATION_PAT }}
          fetch-depth: 0

      - name: Set up Node
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Copilot CLI
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        run: npm install -g @github/copilot

      - name: Analyze issue
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        id: analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
        run: |
          # Copilot CLI with the built-in GITHUB_TOKEN (no PAT needed) and the
          # copilot-requests: write workflow permission. --yolo runs non-interactively.
          PROMPT="You are a CI failure triage agent. Analyze a CI test failure and return strict JSON only. The failure is described by a GitHub issue; its body usually links the failing GitHub Actions run. Goals: classify transient vs non-transient, summarize the root cause briefly, identify a category, produce a minimal remediation plan. Categories: code, test, config, dependency, infrastructure, quality, repeat-transient. Rules: flaky network/service/download failures => transient=true; failing assertions caused by product logic => code or test; lint/format/type errors => quality or code; missing env/permissions/settings => config; package install/lock/version failures => dependency.

          Repo: ${REPO_OWNER}/${REPO_NAME}, Issue Number: ${ISSUE_NUMBER}, Issue Title: ${ISSUE_TITLE}, Issue Body: ${ISSUE_BODY}.

          Return only structured JSON with fields: transient (boolean), summary (string), plan (string), category (one of code, test, config, dependency, infrastructure, quality, repeat-transient)."
          RESPONSE=$(copilot --yolo -p "$PROMPT")
          echo "response<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Parse analysis
        if: ${{ steps.ci-label.outputs.is_ci == 'true' }}
        id: parse
        uses: actions/github-script@v7
        env:
          RESPONSE_JSON: ${{ steps.analyze.outputs.response }}
        with:
          script: |
            // The Copilot CLI may wrap JSON in markdown fences or lead with prose.
            // Try candidates in order: (1) a ```json ... ``` fenced block anywhere,
            // (2) a balanced JSON object from the first '{' to its matching '}'.
            const raw = (process.env.RESPONSE_JSON || '').trim();
            if (!raw) core.setFailed('No response received from analysis step');

            function parseBalanced(text) {
              const start = text.indexOf('{');
              if (start === -1) return null;
              let depth = 0, inStr = false, esc = false;
              for (let i = start; i < text.length; i++) {
                const ch = text[i];
                if (inStr) {
                  if (esc) esc = false;
                  else if (ch === '\\') esc = true;
                  else if (ch === '"') inStr = false;
                } else if (ch === '"') {
                  inStr = true;
                } else if (ch === '{') {
                  depth++;
                } else if (ch === '}') {
                  depth--;
                  if (depth === 0) return text.slice(start, i + 1);
                }
              }
              return null;
            }

            let jsonText = null;
            const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
            if (fence && fence[1]) {
              try { jsonText = parseBalanced(fence[1]); } catch { jsonText = null; }
            }
            if (!jsonText) jsonText = parseBalanced(raw);
            if (!jsonText) {
              core.setFailed(`Could not locate JSON in analysis response\n${raw.slice(0, 2000)}`);
              return;
            }

            let data;
            try {
              data = JSON.parse(jsonText);
            } catch (e) {
              core.setFailed(`Failed to parse analysis response as JSON: ${e.message}\n${raw.slice(0, 2000)}`);
              return;
            }
            core.setOutput('transient', String(data.transient));
            core.setOutput('summary', data.summary || '');
            core.setOutput('plan', data.plan || '');
            core.setOutput('category', data.category || '');

      - name: Stop on transient failure
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'true' }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Transient failure detected; no remediation PR opened."
        env:
          GH_TOKEN: ${{ secrets.AUTO_REMEDIATION_PAT }}

      # A repeat trigger (issue_comment re-entering the pipeline above) must not
      # duplicate an in-flight remediation attempt: if a PR from an earlier run is
      # still open for this issue, comment with its link and stop instead of
      # racing a second Copilot fix attempt against the first.
      - name: Check for existing remediation PR
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'false' }}
        id: existing-pr
        run: |
          url=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "fix/ci-${{ github.event.issue.number }}" \
            --state open \
            --json url \
            --jq '.[0].url')
          if [ -n "$url" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --body "A remediation PR is already open for this issue: ${url}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.AUTO_REMEDIATION_PAT }}

      - name: Create fix branch
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'false' && steps.existing-pr.outputs.exists == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B (not -b): a prior attempt's branch may still exist locally/remotely
          # with no open PR (closed or merged without deleting it) — reset it to a
          # fresh HEAD-based start rather than failing on "branch already exists".
          git checkout -B fix/ci-${{ github.event.issue.number }}

      - name: Fix and open PR
        if: ${{ steps.ci-label.outputs.is_ci == 'true' && steps.parse.outputs.transient == 'false' && steps.existing-pr.outputs.exists == 'false' }}
        id: fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
          PLAN: ${{ steps.parse.outputs.plan }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
        run: |
          # Direct Copilot CLI invocation with write + shell(git:*) tools so the
          # agent can edit files, run git, and open a PR. Uses the built-in
          # GITHUB_TOKEN with the copilot-requests: write permission (no PAT).
          PROMPT="You are an autonomous CI-failure fixer for ${REPO_OWNER}/${REPO_NAME}. The repository is checked out on branch fix/ci-${ISSUE_NUMBER}. Issue #${ISSUE_NUMBER} reports a CI failure. Title: ${ISSUE_TITLE}. Body: ${ISSUE_BODY}. Analysis summary: ${SUMMARY}. Suggested plan: ${PLAN}. Requirements: Reproduce the failing test locally. Run the narrowest relevant test command (this is a Deno repo: 'deno test --allow-all <file>' for a specific file, or the package-scoped suite) to confirm the failure. Implement the smallest, safest fix for the root cause. Re-run the narrow test until it passes. Commit the fix with a clear message. Push the branch to origin and open a pull request against the default branch that closes issue #${ISSUE_NUMBER}. Do not weaken or delete tests merely to make CI green. If you cannot reproduce or safely fix the failure, do not push; instead report what you found and stop."
          RESPONSE=$(copilot --yolo -p "$PROMPT" --allow-tool='shell(git:*)' --allow-tool=write)
          echo "response<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
