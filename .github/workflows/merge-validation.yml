name: Merge Validation

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${GH_PAT}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: "Configure git identity (CI)"
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: "CI debug: show commit and config"
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "EXA_CONFIG_PATH=$EXA_CONFIG_PATH"
          echo "Workspace listing:" && ls -la
          if [ -f exa.config.toml ]; then
            echo "--- exa.config.toml ---"
            sed -n '1,200p' exa.config.toml
            echo "--- end exa.config.toml ---"
          else
            echo "exa.config.toml not found in workspace"
          fi

      - name: "Clear Deno plug cache (avoid corrupted SQLite native plugin)"
        run: rm -rf ~/.cache/deno/plug/

      - name: "Run Full Pipeline"
        run: deno run -A scripts/ci.ts all

      # Placeholder for coverage upload
      # - name: Upload Coverage
      #   uses: codecov/codecov-action@v3
