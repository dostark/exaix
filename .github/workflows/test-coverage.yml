name: "Tests & Coverage"

# Manual test-coverage measurement. Standard validation runs without instrumentation.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests-and-coverage:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${{ secrets.GH_PAT }}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Init team submodule"
        run: |
          git config --local submodule.exaix-team.url "https://x-access-token:${{ secrets.EXAIX_TEAM_PAT }}@github.com/dostark/exaix-team.git"
          git submodule update --init --depth 1 exaix-team

      - name: "Init unslop-ts submodule"
        run: git submodule update --init --depth 1 unslop-ts

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Clear Deno plug cache (avoid corrupted SQLite native plugin)"
        run: rm -rf ~/.cache/deno/plug/

      - name: "Build agent index (generate .copilot/chunks/)"
        run: deno run --allow-read --allow-write scripts/build_agents_index.ts

      - name: "Run Test Suite & Verify Coverage"
        run: deno run --allow-run --allow-read --allow-write scripts/measure_coverage.ts
