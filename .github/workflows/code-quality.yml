name: "Code Quality Gates"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: "Quality Dashboard"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${{ secrets.GH_PAT }}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        id: setup-deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Cache dependencies"
        if: steps.setup-deno.outcome == 'success'
        run: deno cache src/main.ts tests/**/*.ts || true

      # --- GATE 0: Commit Message Validation ---
      - name: "Gate 0: Commit Message"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git log -1 --pretty=%B > .git/COMMIT_EDITMSG
          deno task check-commit-msg .git/COMMIT_EDITMSG

      # --- GATE 1: Format Check (includes packages-team/ via deno task config) ---
      - name: "Gate 1: Formatting"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task fmt:check

      # --- GATE 2: Linting ---
      - name: "Gate 2: Linting"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task lint

      # --- GATE 3: Style/Boundary Check ---
      - name: "Gate 3: Style & Boundaries"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task check:style

      # --- GATE 4: Test Placement Check ---
      - name: "Gate 4: Test Placement"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task check:test-placement

      # --- GATE 5: Magic Values Check ---
      - name: "Gate 4: Magic Values"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task check:magic

      # --- GATE 6: Docs Drift Check ---
      - name: "Gate 6: Documentation Drift"
        if: always() && steps.setup-deno.outcome == 'success'
        continue-on-error: true
        run: |
          deno task check:docs || echo "⚠️ Docs Drift Check failed; continuing remaining gates."

      # --- GATE 7: Markdown Lint ---
      - name: "Gate 7: Markdown Linting"
        if: always() && steps.checkout.outcome == 'success'
        run: |
          STAGED_MD_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '.md$' || true)
          if [ -n "$STAGED_MD_FILES" ]; then
            echo "📝 Checking changed markdown files..."
            echo "$STAGED_MD_FILES" | xargs deno run --allow-read scripts/markdown_lint.ts
          else
            echo "✅ No markdown files changed."
          fi

      # --- GATE 8: Complexity Check ---
      - name: "Gate 8: Code Complexity"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task check:complexity

      # --- GATE 9: Architecture Check ---
      - name: "Gate 9: Architecture & Grounding"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task check:arch

      # --- GATE 10: Agent Documentation Nervous System ---
      - name: "Gate 10: Agent-Native Documentation"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task docs-agent-validate

      # --- GATE 11: Hallucination Benchmarks ---
      - name: "Gate 11: Hallucination Benchmarks"
        if: always() && steps.setup-deno.outcome == 'success'
        run: deno task docs-bench

  tests-and-coverage:
    name: "Tests & Coverage"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${{ secrets.GH_PAT }}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Clear Deno plug cache (avoid corrupted SQLite native plugin)"
        run: rm -rf ~/.cache/deno/plug/

      - name: "Build agent index (generate .copilot/chunks/)"
        run: deno run --allow-read --allow-write scripts/build_agents_index.ts

      - name: "Run Test Suite & Verify Coverage"
        run: deno run --allow-run --allow-read --allow-write scripts/measure_coverage.ts

  edition-build:
    name: "Edition Build Smoke Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${{ secrets.GH_PAT }}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Build Solo edition"
        run: deno task build:solo

      - name: "Test Solo edition (excludes packages-team/)"
        run: deno run -A scripts/ci.ts test --edition solo

      - name: "Build Team edition"
        run: deno task build:team

      - name: "Test Team edition (includes packages-team/)"
        run: deno run -A scripts/ci.ts test --edition team

      - name: "Team edition smoke test"
        run: deno task test:team-smoke

      - name: "Build Enterprise edition (basis scaffold)"
        if: hashFiles('exaix-enterprise/mod.ts') != ''
        run: deno task build:enterprise

      - name: "Check no edition conditionals outside allowed dirs"
        run: deno task check:no-edition-conditionals
