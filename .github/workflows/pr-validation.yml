name: "PR Validation"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${GH_PAT}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Configure git identity (CI)"
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: "CI debug: show commit and config (Linux only)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "EXA_CONFIG_PATH=$EXA_CONFIG_PATH"
          echo "Workspace listing:" && ls -la
          if [ -f exa.config.toml ]; then
            echo "--- exa.config.toml ---"
            sed -n '1,200p' exa.config.toml
            echo "--- end exa.config.toml ---"
          else
            echo "exa.config.toml not found in workspace"
          fi

      - name: "Run Checks"
        run: deno run -A scripts/ci.ts check

      - name: "Clear Deno plug cache (avoid corrupted SQLite native plugin)"
        run: rm -rf ~/.cache/deno/plug/

      - name: "Run Quick Tests"
        run: deno run -A scripts/ci.ts test --quick

  eval-quick:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${GH_PAT}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Run Self-Contained Evaluation Packs (no sandbox needed)"
        run: deno run -A scripts/ci.ts eval --threshold 0.5

  eval-llm:
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    runs-on: ubuntu-latest
    environment: eval-llm
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${GH_PAT}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Run Full Evaluation with Anthropic LLM"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: deno run -A scripts/ci.ts eval --anthropic --threshold 0.5

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Init public submodule"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local submodule.exaix-dev-docs.url "https://x-access-token:${GH_PAT}@github.com/dostark/exaix-dev-docs.git"
          git submodule update --init --depth 1 exaix-dev-docs

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Configure git identity (CI)"
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: "Clear Deno plug cache (avoid corrupted SQLite native plugin)"
        run: rm -rf ~/.cache/deno/plug/

      - name: "Run Scenario Framework (Automated/Mock)"
        run: deno run -A scripts/ci.ts scenarios --profile ci-smoke
