name: "PR Validation"

on:
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Configure git identity (CI)"
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: "CI debug: show commit and config (Linux only)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "EXA_CONFIG_PATH=$EXA_CONFIG_PATH"
          echo "Workspace listing:" && ls -la
          if [ -f exa.config.toml ]; then
            echo "--- exa.config.toml ---"
            sed -n '1,200p' exa.config.toml
            echo "--- end exa.config.toml ---"
          else
            echo "exa.config.toml not found in workspace"
          fi

      - name: "Run Checks"
        run: deno run -A scripts/ci.ts check

      - name: "Run Quick Tests"
        run: deno run -A scripts/ci.ts test --quick

  scenarios:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: "Configure git identity (CI)"
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: "Run Scenario Framework (Automated/Mock)"
        run: deno run -A scripts/ci.ts scenarios --profile ci-smoke
