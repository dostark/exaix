[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.openai.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Phase 155 Step 3: the qualified "openai" compatible profile, targeting the real OpenAI Chat
# Completions endpoint through the shared @exaix/ai-openai compatible provider rather than a
# second HTTP stack. Requires OPENAI_API_KEY in the daemon's own environment; no key is present
# in this file, its `[[cells]]` catalog entry, or any captured fixture. Mirrors
# openai-no-delegate.toml's shape; unlike that preset, `provider = "openai-chat"` routes through
# OpenAICompatibleProviderFactory, which pins the endpoint host and the qualified model below.
[ai]
provider = "openai-chat"
model = "gpt-6-luna"

[ai.compatible]
profile = "openai"

[models.default]
provider = "openai-chat"
model = "gpt-6-luna"
timeout_ms = 60000

[agents]
default_model = "default"
# gpt-6-luna over-explores before committing to a write action (observed: 10/10 iterations
# spent on read_file/list_directory alone, "Reached maximum iterations without completing
# task" on map-dependencies). Raised for this cell only; Sonnet finishes well under the default.
max_iterations = 20

[rate_limiting]
enabled = true
max_calls_per_minute = 300
# gpt-6-luna needs more iterations than Sonnet for the same multi-file swe_tasks scope
# (observed: 37 calls / ~84k prompt tokens still mid-task on write-tests-uncovered), so the
# 100k/hour default cuts off a real task rather than a runaway one. Raised for this cell only.
max_tokens_per_hour = 500000

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[execution]
native_tools_enabled = true

[request_analysis]
enabled = true

# No [session_delegate] block: omitting it entirely defaults session_delegate to disabled,
# mirroring openai-no-delegate.toml.
