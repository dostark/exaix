[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["127.0.0.1:11434"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Phase 203 Step 7: the built-in OpenAI-compatible Ollama endpoint. The `ollama-chat` preset
# binds the catalog's `ollama-chat` service explicitly, so this config only has to boot the
# daemon. The compatible block keeps the config-driven path usable too, and carries no API key:
# a self-hosted Ollama serves plain HTTP on loopback, which needs the explicit opt-in below.
[ai]
provider = "openai-chat"
model = "llama3.1:8b"

[ai.compatible]
profile = "self-hosted"
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = "llama3.1:8b"
allow_insecure_loopback = true

[models.default]
provider = "openai-chat"
model = "llama3.1:8b"
timeout_ms = 180000

[execution]
native_tools_enabled = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# No [session_delegate] block: omitting it entirely defaults session_delegate to disabled,
# mirroring openai-chat.toml and deepseek-chat.toml.
