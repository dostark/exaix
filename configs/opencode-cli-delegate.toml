[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# swe_tasks provider-live cell verifying CliDelegateStrategy (packages/execution/src/strategies/
# cli_delegate_strategy.ts) with the opencode tool: real Anthropic analysis/planning (unchanged
# from anthropic-cli-delegate.toml) AND a real headless `opencode run` subprocess on
# opencode/deepseek-v4-flash-free for the code_changes step. Only the [cli_delegate] block
# differs from anthropic-cli-delegate.toml — planning stays on Anthropic so this cell isolates
# the delegate tool/model as the variable under test.
[ai]
provider = "anthropic"
model = "claude-sonnet-5"

[models.default]
provider = "anthropic"
model = "claude-sonnet-5"
timeout_ms = 60000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[ai_anthropic]
max_tokens_default = 8192
thinking_default = false

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Phase 134 Solo curated list: without this, a size-M request resolves via ProviderSelector's
# scoring path, which picked circuit-breaker-rate-limited Haiku over the [models.default]
# override above. Pin the curated list to Anthropic so the request genuinely plans and executes
# on the pinned model.
[model_presets.M]
max_cost_per_mtok = 3
min_context_window = 32000
supports_thinking = true
candidates = ["anthropic"]

# Verifies CliDelegateStrategy: AgentOrchestrator registers it only when enabled = true, and
# dispatches to it only for a blueprint whose capabilities include "cli_delegate" (the scenario
# patches a SANDBOXED COPY of senior-coder.md, not the real Blueprints/, to add that capability).
# deepseek-v4-flash-free is used instead of the paid deepseek-v4-flash because the OpenCode Zen
# account backing this environment has insufficient balance on the paid tier (confirmed via a
# manual `opencode run --model opencode/deepseek-v4-flash` probe returning "Insufficient balance").
[cli_delegate]
enabled = true
tool = "opencode"
model = "opencode/deepseek-v4-flash-free"
