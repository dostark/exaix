# Planning read-only tools on the DeepSeek compatible profile. It is a native-tools HTTP cell like
# planning-live.google.toml. Requires DEEPSEEK_API_KEY in the daemon environment. The key is never
# in this file.
[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.deepseek.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

[ai]
provider = "openai-chat"
model = "deepseek-v4-pro"

[ai.compatible]
profile = "deepseek"

[models.default]
provider = "openai-chat"
model = "deepseek-v4-pro"
timeout_ms = 180000

[agents]
default_model = "default"

[quality_gate]
enabled = false

[execution]
native_tools_enabled = true

# The compatible provider accepts one tool call per response.
[planning]
tools_enabled = true
max_tool_rounds = 3
max_tool_result_tokens = 2000
max_tool_calls_per_round = 1

[[portals]]
alias = "live-portal"
target_path = "__DOGFOOD_ROOT__/live-portal"

# Keep model resolution on the configured provider.
[model_presets.M]
max_cost_per_mtok = 1000
min_context_window = 32000
supports_thinking = false
candidates = ["openai-chat"]

[model_presets.L]
max_cost_per_mtok = 1000
min_context_window = 64000
supports_thinking = false
candidates = ["openai-chat"]
