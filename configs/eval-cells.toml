# Cell Catalog — the named presets a scenario selects with `matrix.from_catalog`.
# A scenario lists preset names instead of copying a config path, a provider label and the
# prerequisite predicates into every cell. Adding a provider or model tier requires only a
# new entry here — no YAML edits.
#
# Each `[tool.<name>]` row is one preset named `<name>`:
#   tool         = the matrix cell's tool: the delegate binary, or `exactl` (the default)
#   config       = path to the daemon config TOML (relative to repo root)
#   provider     = provider label used in history attribution (must match the config)
#   model        = model label used in history attribution (must match the config)
#   requires_bin = (optional) binary that must be on PATH for this cell to be runnable
#   requires_key = (optional) env var that must be set for this cell to be runnable
#   requires_optin = (optional) env var that must be set, or the cell is skipped
#   native_tools = (optional) documentary only; the config's native_tools_enabled decides
#   bindings     = (optional) the cell-layer bindings this preset sets
#   catalog      = (optional) catalog entries this preset adds
#
# A row that gates on `requires_key` defaults `requires_bin` to `true`, a binary that is
# always present. An API row therefore sets `bindings.default.model` to the canonical model
# its own config already pins, so a run binds the model it would have used anyway.
# A CLI-delegate row binds nothing: its delegate setup is config-driven.
# A `catalog` endpoint may hold `__COMPAT_FIXTURE_PORT__`; the runner substitutes it before
# any daemon reads the overlay.

[tool.claude-code]
tool = "claude-code"
config = "configs/claude-cli-delegate-all.toml"
provider = "claude-cli"
model = "claude-sonnet-5"
requires_bin = "claude"

[tool.claude-haiku-4-5]
tool = "claude-haiku-4-5"
config = "configs/claude-haiku-4-5-delegate-all.toml"
provider = "claude-cli"
model = "claude-haiku-4-5"
requires_bin = "claude"

[tool.opencode]
tool = "opencode"
config = "configs/opencode-cli-delegate-all.toml"
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"
requires_bin = "opencode"

[tool.opencode-north-mini-code]
tool = "opencode-north-mini-code"
config = "configs/opencode-north-mini-code-free.toml"
provider = "opencode-cli"
model = "opencode/north-mini-code-free"
requires_bin = "opencode"

[tool.opencode-go]
tool = "opencode-go"
config = "configs/opencode-go-delegate-all.toml"
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"
requires_bin = "opencode"

[tool.exactl-native]
tool = "exactl"
config = "configs/anthropic-no-delegate.toml"
provider = "anthropic"
model = "claude-sonnet-5"
requires_bin = "true"
requires_key = "ANTHROPIC_API_KEY"
native_tools = true

[tool.exactl-native.bindings.default]
model = "anthropic/claude-sonnet-5"

# The same config as `exactl-native`, declared without native tools. `native_tools` is
# documentary, so this row differs from `exactl-native` only by that label.
[tool.exactl-generic]
tool = "exactl"
config = "configs/anthropic-no-delegate.toml"
provider = "anthropic"
model = "claude-sonnet-5"
requires_bin = "true"
requires_key = "ANTHROPIC_API_KEY"
native_tools = false

[tool.exactl-generic.bindings.default]
model = "anthropic/claude-sonnet-5"

[tool.exactl-openai]
tool = "exactl"
config = "configs/openai-no-delegate.toml"
provider = "openai"
model = "gpt-5.6-terra"
requires_bin = "true"
requires_key = "OPENAI_API_KEY"
native_tools = true

[tool.exactl-openai.bindings.default]
model = "openai/gpt-5.6-terra"

[tool.exactl-google]
tool = "exactl"
config = "configs/google-no-delegate.toml"
provider = "google"
model = "gemini-flash-latest"
requires_bin = "true"
requires_key = "GOOGLE_API_KEY"
native_tools = true

[tool.exactl-google.bindings.default]
model = "google/gemini-flash-latest"

# Phase 203 Step 8: OpenRouter needs no new TOML file, because the binding selects the service.
# OpenRouter's model ids equal the canonical ids, so the binding reuses the config's own model.
# The row's provider stays the config's provider: only the service is swapped.
[tool.exactl-openrouter]
tool = "exactl"
config = "configs/anthropic-no-delegate.toml"
provider = "anthropic"
model = "claude-sonnet-5"
requires_bin = "true"
requires_key = "OPENROUTER_API_KEY"
native_tools = true

[tool.exactl-openrouter.bindings.default]
service = "openrouter"
model = "anthropic/claude-sonnet-5"

[tool.opencode-laguna-free]
tool = "opencode-laguna-free"
config = "configs/opencode-laguna-free.toml"
provider = "opencode-cli"
model = "opencode/laguna-s-2.1-free"
requires_bin = "opencode"

[tool.codex]
tool = "codex"
config = "configs/codex-cli-react.toml"
provider = "codex-cli"
model = "gpt-5.6-terra"
requires_bin = "codex"

[tool.openai-chat]
tool = "exactl"
config = "configs/openai-chat.toml"
provider = "openai-chat"
model = "gpt-6-luna"
requires_bin = "true"
requires_key = "OPENAI_API_KEY"
native_tools = true

[tool.openai-chat.bindings.default]
service = "openai-chat"
model = "openai/gpt-6-luna"

[tool.deepseek-chat]
tool = "exactl"
config = "configs/deepseek-chat.toml"
provider = "openai-chat"
model = "deepseek-v4-pro"
requires_bin = "true"
requires_key = "DEEPSEEK_API_KEY"
native_tools = true

[tool.deepseek-chat.bindings.default]
service = "deepseek"
model = "deepseek/deepseek-v4-pro"

# Phase 203 Step 7: Ollama's own OpenAI-compatible endpoint, which the built-in catalog declares
# as `ollama-chat`. Ollama is a background service CI cannot assume, so the cell is skipped unless
# EXA_MATRIX_OLLAMA is set. The model must already be pulled (`ollama pull llama3.1:8b`).
# The binding names the service explicitly: no `meta` preference key
# exists, because the catalog derives preferences from registered providers and `meta` is not one.
[tool.ollama-chat]
tool = "exactl"
config = "configs/ollama-chat.toml"
provider = "openai-chat"
model = "llama3.1:8b"
requires_bin = "true"
requires_optin = "EXA_MATRIX_OLLAMA"
native_tools = true

[tool.ollama-chat.bindings.default]
service = "ollama-chat"
model = "meta/llama3.1:8b"

[tool.ollama-chat.catalog.models."meta/llama3.1:8b"]
model_provider = "meta"

# A strong cloud default with local explorers: `default` stays on Anthropic while
# `role:web-explorer` runs on the local Ollama service. The opt-in gates the whole row.
[tool.split-strong-local]
tool = "exactl"
provider = "mixed"
config = "configs/anthropic-no-delegate.toml"
requires_bin = "true"
requires_key = "ANTHROPIC_API_KEY"
requires_optin = "EXA_MATRIX_OLLAMA"

[tool.split-strong-local.bindings.default]
model = "anthropic/claude-sonnet-5"

[tool.split-strong-local.bindings."role:web-explorer"]
service = "ollama-chat"
model = "meta/llama3.1:8b"

[tool.split-strong-local.catalog.models."meta/llama3.1:8b"]
model_provider = "meta"

# Test-only: the fixture service the Phase 203 Step 9 cutover drives. The judge is bound to a CLI
# delegate, which needs no provider credential, and the fixture config carries the host grant.
# The cell runs only when the fixture port exists, because the config and catalog both carry the
# port sentinel and an unset port would otherwise fail config materialization.
[tool.self-hosted-fixture]
tool = "exactl"
config = "configs/compat-fixture-base.toml"
provider = "openai-chat"
requires_bin = "true"
requires_optin = "EXA_COMPAT_FIXTURE_PORT"
native_tools = true

[tool.self-hosted-fixture.bindings.default]
service = "self-hosted-fixture"
model = "fixture/compat-fixture-v1"

[tool.self-hosted-fixture.bindings.judge]
service = "claude-cli"
model = "anthropic/claude-sonnet-5"

[tool.self-hosted-fixture.catalog.services.self-hosted-fixture]
adapter = "openai-chat"
profile = "self-hosted"
endpoint = "http://127.0.0.1:__COMPAT_FIXTURE_PORT__/v1/chat/completions"
allow_insecure_loopback = true
supports_tool_choice = false
transport = "local"
interface = "api"
serves = { "fixture/compat-fixture-v1" = "compat-fixture-v1" }

[tool.self-hosted-fixture.catalog.models."fixture/compat-fixture-v1"]
model_provider = "fixture"

# Phase 203 Step 8: the planning-live presets. `planning-read-only-tools-live` hand-listed seven
# cells on these configs. The presets keep each config, provider, model and opt-in, so the
# scenario migrates to `from_catalog` without changing a cell id or a run predicate.
[tool.planning-live-claude]
tool = "claude-code"
config = "configs/planning-live.claude.toml"
provider = "claude-cli"
model = "claude-haiku-4-5"
requires_bin = "claude"

[tool.planning-live-codex]
tool = "codex"
config = "configs/planning-live.codex.toml"
provider = "codex-cli"
model = "gpt-5.6-terra"
requires_bin = "codex"
requires_optin = "EXA_MATRIX_CODEX"

[tool.planning-live-opencode]
tool = "opencode"
config = "configs/planning-live.opencode.toml"
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"
requires_bin = "opencode"
requires_optin = "EXA_MATRIX_OPENCODE"

[tool.planning-live-anthropic]
tool = "exactl"
config = "configs/planning-live.anthropic.toml"
provider = "anthropic"
model = "claude-sonnet-5"
requires_key = "ANTHROPIC_API_KEY"

[tool.planning-live-openai]
tool = "exactl"
config = "configs/planning-live.openai.toml"
provider = "openai"
model = "gpt-5-mini"
requires_key = "OPENAI_API_KEY"

[tool.planning-live-google]
tool = "exactl"
config = "configs/planning-live.google.toml"
provider = "google"
model = "gemini-flash-latest"
requires_key = "GOOGLE_API_KEY"

[tool.planning-live-openrouter]
