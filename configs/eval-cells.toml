[tool.live-learning-effectiveness]
tool = "exactl"
config = "configs/agent-flows-mock-pattern.toml"
provider = "claude-cli"
requires_bin = "claude"
requires_optin = "EXA_MATRIX_LEARNING_EFFECTIVENESS"

# The Ollama provider with its own server, used by the live JSON plan test. It shares the EXA_MATRIX_OLLAMA opt-in with ollama-chat.
[tool.live-ollama]
tool = "exactl"
config = "configs/ollama-chat.toml"
provider = "ollama"
requires_bin = "true"
requires_optin = "EXA_MATRIX_OLLAMA"
