[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = []

# Step 9 paired value pilot executor: OpenCode Go DeepSeek V4.1 Flash at medium effort.
# The metric is the reused Step 8 oracle verdict, so no judge binding is present.
[ai]
provider = "opencode-cli"
model = "opencode-go/deepseek-v4.1-flash"

[models.default]
provider = "opencode-cli"
model = "opencode-go/deepseek-v4.1-flash"
timeout_ms = 300000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["opencode-cli"]

[cli_delegate_provider]
timeout_ms = 900000
