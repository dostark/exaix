[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com", "api.openai.com", "api.openrouter.ai", "localhost:11434"]

[ai]
provider = "ollama"
model = "ollama/llama3"

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Delegates the code_changes gate to headless Claude Code routed through OpenRouter. This is the claude-code plus openrouter cell of the provider-live matrix.
# The model is an Anthropic slug, because Claude Code via OpenRouter is only guaranteed with Anthropic first-party routing. Exaix has no delegate routing-order setting.
# The child env (base URL, auth token, empty API key) is injected at runtime from the provider block. sanitizeChildEnv strips provider keys, so only the resolved delegate env reaches the child.
[session_delegate]
enabled = true
tool = "claude-code"
# `provider:model` form: prepareBrief rejects a bare id, and the claude-code adapter
# strips the prefix before `--model` (Phase 150 LIVE-RT). The bare id here would have
# thrown in prepareBrief and abandoned the step.
model = "anthropic:claude-sonnet-5"
gates = ["code_changes"]
launch_mode = "headless"
# `paths_touched` are worktree-relative, so the `Workspace/**` fallback scope-violates
# every portal source edit. Scoped to source trees; `.env` and CI config still fail.
permitted_paths = ["src/**", "tests/**"]
harden_permissions = true

[session_delegate.provider]
name = "openrouter"
key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api"
