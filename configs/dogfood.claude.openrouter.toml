[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com", "api.openai.com", "api.openrouter.ai", "localhost:11434"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

[ai]
provider = "ollama"
model = "ollama/llama3"

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Delegate the code_changes gate to headless Claude Code routed through OpenRouter.
# This is the claude-code+openrouter cell of the Phase 127 provider_live matrix.
#
# OpenRouter-Claude 1P caveat (Phase 127 / §13.5): Claude Code via OpenRouter is only
# guaranteed to work with the Anthropic first-party provider, so `model` below is an
# Anthropic slug — the forwarded `--model` is the only routing signal Exaix controls.
# Exaix has NO delegate-config routing-order lever (SessionDelegateProviderSchema is
# {name, key_env, base_url} only); a `provider.order` pin would require a schema phase.
#
# The child env (ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN, and the deliberately EMPTY
# ANTHROPIC_API_KEY that stops the CLI falling back to direct Anthropic auth) is injected
# at runtime by SessionDelegateService.resolveDelegateEnv from this provider block —
# it is NOT set here, and cannot be (TOML has no field for child env values).
# Provider keys are stripped from the child by sanitizeChildEnv; only the resolved
# delegate-provider env reaches the child.
[session_delegate]
enabled = true
tool = "claude-code"
model = "claude-sonnet-5"
gates = ["code_changes"]
launch_mode = "headless"
harden_permissions = true

[session_delegate.provider]
name = "openrouter"
key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api"
