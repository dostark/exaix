[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.openai.com"]

# swe_tasks provider-live cell: real OpenAI end to end (analysis + execution), no session
# delegate - so execution runs through the daemon's own AgentExecutor/DynamicStepExecutor,
# journalling real dynamic_tool_call events (trajectory-assert's source). Mirrors
# anthropic-no-delegate.toml's shape exactly; carries no [[portals]] entry - swe_tasks
# scenarios register their own fixture portal via `exactl portal add` rather than mounting
# exaix-self. Phase 153 Step 5 Tier A live cutover.
[ai]
provider = "openai"
# gpt-5-mini (2025-08-07 snapshot) is labeled "Previous" generation in OpenAI's own docs.
# gpt-5.6-terra is their current "balance intelligence and cost" recommendation - Sol/
# Terra/Luna map to roughly Exaix's own XL/L/M/S size tiers; Terra (not the cheapest
# Luna tier) is the sensible default, matching Exaix's own model_presets.M/L below.
# Verified live against this account's real /v1/models catalog and function-calling
# behavior, 2026-08-14 (developers.openai.com/api/docs/models).
model = "gpt-5.6-terra"

[models.default]
provider = "openai"
model = "gpt-5.6-terra"
timeout_ms = 60000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[execution]
native_tools_enabled = true

[request_analysis]
enabled = true

# Pins the curated list to OpenAI for both M sizing and L sizing. Without the L pin, execution budget resolves to mock:mock-model.
# The pin is candidates. supports_thinking is false, matching the real registration. The cost and context bounds only satisfy the schema.
# The cost rate predates this model and is not re-verified here.
[model_presets.M]
max_cost_per_mtok = 3
min_context_window = 32000
supports_thinking = false
candidates = ["openai"]

[model_presets.L]
max_cost_per_mtok = 3
min_context_window = 32000
supports_thinking = false
candidates = ["openai"]

# No [session_delegate] block: tool/gates are required once the block is present at all (even
# with enabled = false), per SessionDelegateConfigSchema. Omitting it entirely defaults
# session_delegate to disabled - mirrors anthropic-no-delegate.toml.
