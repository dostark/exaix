[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = []

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Phase 159 Step 6: the react-strategy half of the cli_delegate-vs-react comparison —
# same opencode-go/deepseek-v4-flash model as configs/opencode-cli-delegate-all.toml, but
# [cli_delegate] stays disabled so a `strategy: "react"` flow step resolves ReActLoopStrategy
# against this real, live provider instead of spawning the headless CLI.
[ai]
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"

[models.default]
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"
timeout_ms = 300000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["opencode-cli"]

[cli_delegate]
enabled = false
tool = "opencode"
