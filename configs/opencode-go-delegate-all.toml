[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = []

# swe_tasks provider-live cell. Request analysis, plan generation and the code_changes step all run through the headless opencode CLI on the Go tier of deepseek-v4-flash.
# No ANTHROPIC_API_KEY or metered API call is used. allow_net is empty, so the daemon never dials out.
# The Go tier regressed on add-feature (1.000 on the free tier, 0.909 on Go), so this config is for targeted Go tier testing only.
[ai]
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"

[models.default]
provider = "opencode-cli"
model = "opencode-go/deepseek-v4-flash"
timeout_ms = 300000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["opencode-cli"]

[cli_delegate]
enabled = true
tool = "opencode"
model = "opencode-go/deepseek-v4-flash"
