[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = []

# swe_tasks provider-live cell. Request analysis, plan generation and the code_changes step all run through the headless claude CLI, billed to a Claude Pro or Max subscription.
# No ANTHROPIC_API_KEY or metered API call is used. allow_net is empty, and CliDelegateStrategy strips the API key variables from the spawned CLI environment.
[ai]
provider = "claude-cli"
model = "claude-haiku-4-5"

[models.default]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Pin the curated list to claude-cli so a size-M request cannot resolve to any other
# (metered) provider via ProviderSelector's scoring path — mirrors the Phase 134 Solo
# curated-list pin used by the other cli-delegate configs, adapted to this provider type.
[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["claude-cli"]

# Verifies CliDelegateStrategy: AgentComposer registers it only when enabled = true, and
# dispatches to it only for a blueprint whose capabilities include "cli_delegate" (the scenario
# patches a SANDBOXED COPY of senior-coder.md, not the real Blueprints/, to add that capability).
# Same model as [ai]/[models.default] above — every part of the test uses one tool/model.
[cli_delegate]
enabled = true
tool = "claude-code"
model = "claude-haiku-4-5"
