[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
# 127.0.0.1: the per-launch DogfoodContextServer loopback MCP endpoint (Phase 176) binds
# Deno.serve({hostname: "127.0.0.1"}) on an OS-assigned port — Deno's own listen permission,
# required whenever [dogfood.context] is enabled below, independent of any outbound API host.
# Only the per-launch DogfoodContextServer needs a daemon network permission. Claude Code
# performs its subscription-authenticated network traffic in its own child process.
allow_net = ["127.0.0.1"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Every daemon model turn (analysis, planning, and review) goes through subscribed Claude
# Code. The session-delegate code_changes gate below launches the same CLI explicitly.
[ai]
provider = "claude-cli"
model = "claude-haiku-4-5"

# The daemon resolves analysis and review via `agents.default_model` → `[models.<name>]`,
# not merely `[ai]`; keep every named model on the CLI provider.
[models.default]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[models.fast]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[agents]
default_model = "default"

# The high-prio identity e2e submits 7 requests in a tight burst, and each may
# retry plan generation locally on bad LLM output — so the default 60 calls/min
# throttle can be tripped by the burst itself. This is an identity-behavior test,
# not a throughput test: raise the per-minute ceiling so self-throttling does not
# distort the run. (Genuine provider faults still flow through the circuit breaker.)
[rate_limiting]
enabled = true
max_calls_per_minute = 300

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

# Bounded, scoped portal-knowledge + memory supplement composed onto both dogfood
# child-launch paths (Phase 176). Requires the `exaix-self` portal above to be the
# sole portal configured with this alias — enabled-but-unwired is a startup error.
[dogfood.context]
enabled = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Delegate the code_changes gate to headless Claude Code.
# Uses --output-format json; return is parsed from the single {type:"result"} object.
# Requires the `claude` CLI on PATH with its subscription login. Provider keys are
# stripped from the child by sanitizeChildEnv, so this preset cannot fall back to a
# metered Anthropic API credential.
[session_delegate]
enabled = true
tool = "claude-code"
# Model id must be the `provider:model` form — prepareBrief rejects a bare id, and the
# claude-code adapter strips the prefix before passing it to `--model`.
#
# CORRECTION (Phase 150 LIVE-RT): an earlier comment here claimed "the stale
# claude-sonnet-5 was rejected by the headless `claude` CLI as non-existent". That
# diagnosis was wrong. Probing claude CLI 2.1.217 directly:
#   --model claude-sonnet-5            -> works
#   --model anthropic:claude-sonnet-5  -> "It may not exist or you may not have access to it"
# The *provider prefix* was rejected, never the model name. The bare id pinned in
# response then failed prepareBrief's colon check, so this preset could not delegate
# at all unless the request carried its own model intent.
model = "claude-cli:claude-haiku-4-5"
gates = ["code_changes"]
launch_mode = "headless"
# Worktree-relative globs the delegate may touch. `paths_touched` are relative to the
# portal worktree, so a source edit reports `src/main.ts` — the `Workspace/**` fallback
# matches none of it and reconcile rejects every return as a scope violation. Scoped to
# source trees deliberately: a write to `.env` or CI config still trips the check.
permitted_paths = ["src/**", "tests/**"]
# Phase 128 R3: derive --permission-mode + scoped --allowedTools flags
# from SessionBrief.permitted_paths.
harden_permissions = true

# Pin the curated list to Claude Code so a size-M request cannot resolve to a metered
# HTTP provider through the ProviderSelector scoring path.
[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["claude-cli"]

# quality-judge declares model_size L; pin it too so review cannot fall back to a
# direct provider or the mock default.
[model_presets.L]
max_cost_per_mtok = 0
min_context_window = 64000
supports_thinking = false
candidates = ["claude-cli"]
