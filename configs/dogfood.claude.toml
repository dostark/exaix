[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com", "api.openai.com", "localhost:11434"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Analysis/planning model (the daemon's own in-process LLM, distinct from the delegate below).
# A "claude" preset plans with Claude: routes the request → plan step through the Anthropic API
# (ANTHROPIC_API_KEY), so the whole flow — analysis AND the headless `claude -p` delegate — runs on
# Claude, with no dependency on an auto-detected Google/Ollama provider.
[ai]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"

# The daemon resolves its analysis provider via `agents.default_model` → `[models.<name>]`, NOT the
# `[ai]` block above (which is only a fallback). The config schema DEFAULTS `[models].default` to
# Google, so a preset without an explicit [models] silently plans on Google regardless of [ai].
# Pin the named models to Anthropic here so this Claude preset truly plans with Claude.
[models.default]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
timeout_ms = 60000

[models.fast]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
timeout_ms = 60000

[agents]
default_model = "default"

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Delegate the code_changes gate to headless Claude Code.
# Uses --output-format json; return is parsed from the single {type:"result"} object.
# Requires the `claude` CLI on PATH with OAuth or API key in the daemon env.
# Provider keys are stripped from the child by sanitizeChildEnv — auth comes
# from the daemon's own environment or the [session_delegate.provider] block.
[session_delegate]
enabled = true
tool = "claude-code"
# Known-valid current model id (the stale claude-sonnet-4-20250514 was rejected by the headless
# `claude` CLI as non-existent, so the delegate spawned but made no edits). Matches the analysis
# model above, which this environment confirmed works for live runs.
model = "claude-haiku-4-5-20251001"
gates = ["code_changes"]
launch_mode = "headless"
# Phase 128 R3: derive --permission-mode + scoped --allowedTools flags
# from SessionBrief.permitted_paths.
harden_permissions = true
