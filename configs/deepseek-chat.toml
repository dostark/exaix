[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.deepseek.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Phase 155 Step 3: the qualified "deepseek" compatible profile, targeting the real DeepSeek
# Chat Completions endpoint through the shared @exaix/ai-openai compatible provider. Requires
# DEEPSEEK_API_KEY in the daemon's own environment; no key is present in this file, its
# `[[cells]]` catalog entry, or any captured fixture. "deepseek-v4-pro" is the qualified
# model (packages/core/src/types/constants.ts:OPENAI_COMPATIBLE_PROFILE_DEFAULTS). Requalify
# this preset if the returned model or its capabilities change (Technical Contracts, Architecture
# Notes). Unlike the OpenAI profile, DeepSeek supports explicit thinking mode — left disabled
# (the schema default) here since this preset is not itself a thinking-mode fixture.
[ai]
provider = "openai-chat"
model = "deepseek-v4-pro"

[ai.compatible]
profile = "deepseek"

[models.default]
provider = "openai-chat"
model = "deepseek-v4-pro"
timeout_ms = 180000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[execution]
native_tools_enabled = true

[request_analysis]
enabled = true

# No [session_delegate] block: omitting it entirely defaults session_delegate to disabled,
# mirroring openai-chat.toml.
