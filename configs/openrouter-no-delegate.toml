[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["openrouter.ai"]

# swe_tasks provider-live cell: real OpenRouter end to end (analysis + execution), no session
# delegate. Execution runs through the daemon's own AgentExecutor, journalling real
# dynamic_tool_call events. Mirrors anthropic-no-delegate.toml with the OpenRouter provider.
# The model is a floating alias (Phase 211 Q26), so the run records the resolved id.
[ai]
provider = "openrouter"
model = "~deepseek/deepseek-flash-latest"

[models.default]
provider = "openrouter"
model = "~deepseek/deepseek-flash-latest"
timeout_ms = 60000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[execution]
native_tools_enabled = true

[request_analysis]
enabled = true

# Pin the curated list to OpenRouter, so the request plans and executes on the pinned model.
[model_presets.M]
max_cost_per_mtok = 3
min_context_window = 32000
supports_thinking = true
candidates = ["openrouter"]

# No [session_delegate] block, as in anthropic-no-delegate.toml.
