[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = []

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# swe_tasks provider-live cell verifying CliDelegateStrategy end-to-end with a SINGLE
# provider/model/tool for every part of the test: request analysis, plan generation,
# AND the code_changes step all run through the headless `opencode` CLI on
# opencode/deepseek-v4-flash-free — no ANTHROPIC_API_KEY or any metered HTTP API call
# is used anywhere in this run (allow_net is empty; the daemon never dials out).
# Differs from opencode-cli-delegate.toml, which keeps [ai]/[models.default] on real
# Anthropic and only routes the code_changes step through opencode — this config
# isolates "does the whole request lifecycle work on one subscription-billed tool",
# not just the code-editing step.
[ai]
provider = "opencode-cli"
model = "opencode/deepseek-v4-flash-free"

[models.default]
provider = "opencode-cli"
model = "opencode/deepseek-v4-flash-free"
timeout_ms = 300000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Pin the curated list to opencode-cli so a size-M request cannot resolve to any other
# (metered) provider via ProviderSelector's scoring path — mirrors the Phase 134 Solo
# curated-list pin used by the other cli-delegate configs, adapted to this provider type.
[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["opencode-cli"]

# Verifies CliDelegateStrategy: AgentOrchestrator registers it only when enabled = true, and
# dispatches to it only for a blueprint whose capabilities include "cli_delegate" (the scenario
# patches a SANDBOXED COPY of senior-coder.md, not the real Blueprints/, to add that capability).
# Same model as [ai]/[models.default] above — every part of the test uses one tool/model.
# deepseek-v4-flash-free is used instead of the paid deepseek-v4-flash because the OpenCode Zen
# account backing this environment has insufficient balance on the paid tier (confirmed via a
# manual `opencode run --model opencode/deepseek-v4-flash` probe returning "Insufficient balance").
[cli_delegate]
enabled = true
tool = "opencode"
model = "opencode/deepseek-v4-flash-free"
