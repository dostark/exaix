[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["openrouter.ai"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

[ai]
provider = "openrouter"
model = "openrouter/auto"

[models.default]
provider = "openrouter"
model = "openrouter/auto"
timeout_ms = 60000

[models.fast]
provider = "openrouter"
model = "openrouter/auto"
timeout_ms = 60000

[agents]
default_model = "default"

[quality_gate]
enabled = false

[planning]
tools_enabled = true
max_tool_rounds = 2
max_tool_result_tokens = 2000

[[portals]]
alias = "live-portal"
target_path = "__DOGFOOD_ROOT__/live-portal"

[model_presets.M]
max_cost_per_mtok = 1000
min_context_window = 32000
supports_thinking = false
candidates = ["openrouter"]

[model_presets.L]
max_cost_per_mtok = 1000
min_context_window = 64000
supports_thinking = false
candidates = ["openrouter"]
