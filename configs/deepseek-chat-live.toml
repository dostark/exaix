[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.deepseek.com"]

# Qualified deepseek compatible profile. It reaches the DeepSeek Chat Completions endpoint through the shared ai-openai compatible provider.
# Requires DEEPSEEK_API_KEY in the daemon environment. The key is never stored in this file.
# Requalify the preset if the returned model or its capabilities change. Thinking mode stays off, which is the schema default.
[ai]
provider = "openai-chat"
model = "deepseek-v4-pro"

[ai.compatible]
profile = "deepseek"

[models.default]
provider = "openai-chat"
model = "deepseek-v4-pro"
timeout_ms = 180000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[portal_knowledge]
auto_analyze_on_mount = true

[quality_gate]
enabled = false

[execution]
native_tools_enabled = true

[request_analysis]
enabled = true

# No [session_delegate] block: omitting it entirely defaults session_delegate to disabled,
# mirroring openai-chat.toml.

# Live-leg additions: planning read tools (two serial rounds then the schema-validated plan) over a disposable portal.
[planning]
tools_enabled = true
max_tool_rounds = 3
max_tool_result_tokens = 2000
max_tool_calls_per_round = 1

[[portals]]
alias = "live-portal"
target_path = "__DOGFOOD_ROOT__/live-portal"
