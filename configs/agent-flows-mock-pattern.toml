[system]
root = "."
version = "1.0.0"
log_level = "info"

[watcher]
debounce_ms = 200
stability_check = true

[amendment]
enabled = true
threshold = 60

[session_delegate]
enabled = false
tool = "claude-code"
gates = ["refinement", "plan_review", "code_changes", "review"]
launch_mode = "headless"
bin_overrides = []

# The provider is declared so a matrix cell can select the pattern mock through its own EXA_CONFIG_PATH. A step env cannot be scoped to one cell.
# Pattern strategy gives a deterministic default response to a step with no captured fixture. An existing EXA_LLM_PROVIDER still wins.
# The declaration holds only while the file has no [models] table, because ConfigSchema derives the boot model from [ai].
[ai]
provider = "mock"

[ai.mock]
strategy = "pattern"

[rate_limiting]
max_cost_per_day = 300.0

# engine-trigger-matching asserts that two tag-only-reachable skills (reflexive-critique and
# architecture-review) both survive into matched_skill_ids. Their rendered blocks are 2045 and
# 1748 chars; the production default budget (2000) cannot hold both, so the scenario would fail
# on the budget, not on trigger matching. The sandbox is shared across a run, so whichever
# config a scenario writes first is the one every later scenario inherits — this shared mock
# config is the one the smoke pack leaves in place. 4000 is the value the user guide documents.
[skills]
context_budget_chars = 4000
