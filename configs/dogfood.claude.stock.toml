[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
# 127.0.0.1: the per-launch DogfoodContextServer loopback MCP endpoint (Phase 176) binds
# Deno.serve({hostname: "127.0.0.1"}) on an OS-assigned port — Deno's own listen permission,
# required whenever [dogfood.context] is enabled below, independent of any outbound API host.
# Only the per-launch DogfoodContextServer needs a daemon network permission. Claude Code
# performs its subscription-authenticated network traffic in its own child process.
allow_net = ["127.0.0.1"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

# Every daemon model turn (analysis, planning, and quality-judge review) goes through the
# subscribed Claude Code CLI. The implement step below also uses Claude Code directly.
[ai]
provider = "claude-cli"
model = "claude-haiku-4-5"

# The daemon resolves analysis and review via `agents.default_model` → `[models.<name>]`,
# not merely `[ai]`; keep every named model on the CLI provider.
[models.default]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[models.fast]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[agents]
default_model = "default"

[rate_limiting]
enabled = true
max_calls_per_minute = 300

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

# Bounded, scoped portal-knowledge + memory supplement composed onto both dogfood
# child-launch paths (Phase 176). Requires the `exaix-self` portal above to be the
# sole portal configured with this alias — enabled-but-unwired is a startup error.
[dogfood.context]
enabled = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# STOCK path (Phase 176 Step 4's stock-claude live cell): per-step execution via a headless
# CLI tool as an alternative to direct IModelProvider API calls, selected by an agent
# blueprint's own `strategy: cli_delegate` (e.g. the dogfood-loop flow's `implement` step —
# Blueprints/Flows/dogfood-loop.flow.yaml), NOT by a plan-review gate. Distinct from
# [session_delegate] (the governed "cycle" mechanism in configs/dogfood.claude.toml): this
# selects the execution strategy for a single agent step, not a whole gate — no
# `[session_delegate]` block in this file, so the code_changes gate (if any plan reaches
# one) is never delegated headlessly by this preset.
[cli_delegate]
enabled = true
tool = "claude-code"
model = "claude-haiku-4-5"

[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["claude-cli"]

# quality-judge declares model_size L; pin it too so review cannot fall back to a
# direct provider or the mock default.
[model_presets.L]
max_cost_per_mtok = 0
min_context_window = 64000
supports_thinking = false
candidates = ["claude-cli"]
