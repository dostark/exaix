[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com", "api.openai.com", "localhost:11434", "generativelanguage.googleapis.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

[ai]
provider = "ollama"
model = "ollama/llama3"

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

# Bounded, scoped portal-knowledge + memory supplement composed onto both dogfood
# child-launch paths (Phase 176). Requires the `exaix-self` portal above to be the
# sole portal configured with this alias — enabled-but-unwired is a startup error.
[dogfood.context]
enabled = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# Delegate the code_changes gate to headless OpenCode (Phase 122 Step 0).
# Reuses the shipped Phase 111 runtime: PlanExecutor.onCodeChangesDelegate ->
# HeadlessSessionLauncher spawns `opencode run --format json <objective>`.
# Requires the `opencode` CLI on PATH; absent it, an `abandoned` return is synthesized.
[session_delegate]
enabled = true
tool = "opencode"
# Model the delegate (opencode) should use, passed as `--model <model>`.
# Change this to swap the code-changes model (e.g. a Qwen slug), or change `tool`
# to "claude-code". The tool resolves the slug against its own provider config.
model = "opencode:deepseek-v4-flash-free"
gates = ["code_changes"]
launch_mode = "headless"
# Phase 128 R3: auto-generate a confined opencode.jsonc agent permission block
# derived from SessionBrief.permitted_paths.
harden_permissions = false
permitted_paths = ["src/**"]
