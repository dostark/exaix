[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
# 127.0.0.1: the per-launch DogfoodContextServer loopback MCP endpoint (Phase 176) binds
# Deno.serve({hostname: "127.0.0.1"}) on an OS-assigned port — Deno's own listen permission,
# required whenever [dogfood.context] is enabled below, independent of any outbound API host.
allow_net = ["api.anthropic.com", "api.openai.com", "localhost:11434", "generativelanguage.googleapis.com", "127.0.0.1"]

[ai]
provider = "ollama"
model = "ollama/llama3"

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

# Bounded, scoped portal-knowledge + memory supplement composed onto both dogfood
# child-launch paths (Phase 176). Requires the `exaix-self` portal above to be the
# sole portal configured with this alias — enabled-but-unwired is a startup error.
[dogfood.context]
enabled = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# STOCK path: per-step execution through a headless CLI tool, selected by an agent blueprint's own strategy: cli_delegate (the dogfood-loop flow's implement step), not by a plan-review gate.
# This file has no [session_delegate] block, so the code_changes gate is never delegated headlessly by this preset.
[cli_delegate]
enabled = true
tool = "opencode"
model = "opencode-go/deepseek-v4.1-flash"
