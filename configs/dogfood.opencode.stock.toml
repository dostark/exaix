[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com", "api.openai.com", "localhost:11434", "generativelanguage.googleapis.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

[ai]
provider = "ollama"
model = "ollama/llama3"

[[portals]]
alias = "exaix-self"
target_path = "__WORKTREE_PATH__"
execution_strategy = "worktree"
default_branch = "main"

[portal_knowledge]
auto_analyze_on_mount = true

# Bounded, scoped portal-knowledge + memory supplement composed onto both dogfood
# child-launch paths (Phase 176). Requires the `exaix-self` portal above to be the
# sole portal configured with this alias — enabled-but-unwired is a startup error.
[dogfood.context]
enabled = true

[quality_gate]
enabled = false

[request_analysis]
enabled = true

# STOCK path (Phase 176 Step 4's stock-opencode live cell): per-step execution via a headless
# CLI tool as an alternative to direct IModelProvider API calls, selected by an agent
# blueprint's own `strategy: cli_delegate` (e.g. the dogfood-loop flow's `implement` step —
# Blueprints/Flows/dogfood-loop.flow.yaml), NOT by a plan-review gate. Distinct from
# [session_delegate] (the governed "cycle" mechanism in configs/dogfood.toml): this selects
# the execution strategy for a single agent step, not a whole gate — no `[session_delegate]`
# block in this file, so the code_changes gate (if any plan reaches one) is never delegated
# headlessly by this preset.
[cli_delegate]
enabled = true
tool = "opencode"
model = "opencode:deepseek-v4-flash-free"
