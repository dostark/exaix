[system]
root = "__DOGFOOD_ROOT__"
log_level = "info"
allow_net = ["api.anthropic.com"]

[paths]
workspace = "Workspace"
portals = "Portals"
memory = "Memory"

[ai]
provider = "claude-cli"
model = "claude-haiku-4-5"

[models.default]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[models.fast]
provider = "claude-cli"
model = "claude-haiku-4-5"
timeout_ms = 300000

[agents]
default_model = "default"

[quality_gate]
enabled = false

[planning]
tools_enabled = true
max_tool_rounds = 3
max_tool_result_tokens = 2000

[[portals]]
alias = "live-portal"
target_path = "__DOGFOOD_ROOT__/live-portal"
[model_presets.M]
max_cost_per_mtok = 0
min_context_window = 32000
supports_thinking = false
candidates = ["claude-cli"]

[model_presets.L]
max_cost_per_mtok = 0
min_context_window = 64000
supports_thinking = false
candidates = ["claude-cli"]
