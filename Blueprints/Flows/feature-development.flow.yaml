id: feature-development
name: Feature Development Flow
description: End-to-end feature development from requirements to implementation
version: 1.0.0
defaultSkills:
  - typescript-patterns
steps:
  - id: analyze-requirements
    name: Analyze Requirements
    type: agent
    agent_role: product-manager
    strategy: cli_delegate
    dependsOn: []
    input:
      source: request
      transform: passthrough
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: design-architecture
    name: Design Architecture
    type: agent
    agent_role: software-architect
    strategy: cli_delegate
    dependsOn:
      - analyze-requirements
    input:
      source: step
      stepId: analyze-requirements
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: implement-feature
    name: Implement Feature
    type: agent
    agent_role: senior-coder
    strategy: cli_delegate
    dependsOn:
      - design-architecture
    input:
      source: step
      stepId: design-architecture
      transform: mergeAsContext
    timeout: 60000
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: write-tests
    name: Write Unit Tests
    type: agent
    agent_role: test-engineer
    strategy: cli_delegate
    dependsOn:
      - implement-feature
    input:
      source: step
      stepId: implement-feature
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: code-review
    name: Code Review
    type: agent
    agent_role: senior-coder
    strategy: cli_delegate
    dependsOn:
      - implement-feature
      - write-tests
    input:
      source: aggregate
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: integration-test
    name: Integration Testing
    type: agent
    agent_role: qa-engineer
    strategy: cli_delegate
    dependsOn:
      - code-review
    input:
      source: step
      stepId: code-review
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
output:
  # A flow feeding request-to-plan generation must aggregate to ONE plan document. Naming two
  # sources with `format: json` produced a map keyed by step id — `{"code-review": ...,
  # "integration-test": ...}` — which fails plan validation with a bare "Required". The three
  # flows that work all output from a single terminal step, and `integration-test` already
  # depends on `code-review`, so the second source was redundant with its own dependency chain.
  from: integration-test
  format: markdown
settings:
  maxParallelism: 3
  failFast: true
  timeout: 600000
  includeRequestCriteria: false
