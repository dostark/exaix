id: strategy-comparison-react
name: Strategy Comparison — react
description: >
  Single-step flow whose step forces strategy: react (Phase 159), used by the
  provider-live scenario proving a strategy-routed flow step reaches the real
  agent strategy registry with a live provider. Paired with
  strategy-comparison-cli-delegate.flow.yaml on the same task for a control-axis
  (cli_delegate vs react) comparison. Not a production task flow — a mechanism
  cutover fixture.
version: "1.0"
defaultSkills:
  - tdd-methodology
steps:
  - id: react-step
    name: Implement the task via forced react strategy
    agent_role: senior-coder
    execution_mode: declared
    strategy: react
    input:
      source: request
      transform: passthrough
    timeout: 300000
    retry:
      maxAttempts: 1
      backoffMs: 1000

output:
  from: react-step
  format: markdown

settings:
  maxParallelism: 1
  failFast: true
