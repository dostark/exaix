id: documentation
name: Documentation Generation Flow
description: Generate comprehensive documentation from code and requirements
version: 1.0.0
defaultSkills:
  - documentation-driven
steps:
  - id: extract-code-structure
    name: Extract Code Structure
    type: agent
    identity: code-analyst
    strategy: react
    dependsOn: []
    input:
      source: request
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: generate-api-docs
    name: Generate API Documentation
    type: agent
    identity: technical-writer
    dependsOn:
      - extract-code-structure
    input:
      source: step
      stepId: extract-code-structure
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: generate-user-guide
    name: Generate User Guide
    type: agent
    identity: technical-writer
    dependsOn:
      - extract-code-structure
    input:
      source: step
      stepId: extract-code-structure
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: generate-architecture-docs
    name: Generate Architecture Documentation
    type: agent
    identity: software-architect
    dependsOn:
      - extract-code-structure
    input:
      source: step
      stepId: extract-code-structure
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: compile-documentation
    name: Compile Final Documentation
    type: agent
    identity: technical-writer
    dependsOn:
      - generate-api-docs
      - generate-user-guide
      - generate-architecture-docs
    input:
      source: aggregate
      transform: mergeAsContext
    retry:
      maxAttempts: 1
      backoffMs: 1000
output:
  from: compile-documentation
  format: markdown
settings:
  maxParallelism: 3
  failFast: false
  timeout: 300000
  includeRequestCriteria: false
