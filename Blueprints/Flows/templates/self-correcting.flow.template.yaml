id: self-correcting-template
name: Self-Correcting Flow Template
description: Template for quality-checked flows with LLM-as-a-Judge evaluation
version: 1.0.0
steps:
  - id: generate-initial
    name: Generate Initial Output
    type: agent
    agent_role: "{{generator}}"
    dependsOn: []
    input:
      source: request
      transform: passthrough
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: evaluate-quality
    name: Evaluate Output Quality
    type: gate
    agent_role: quality-judge
    dependsOn: [generate-initial]
    input:
      source: step
      stepId: generate-initial
      transform: passthrough
    evaluate:
      agent_role: quality-judge
      criteria: [CODE_CORRECTNESS]
      threshold: 0.8
      onFail: retry
      maxRetries: 3
    loop:
      backTo: generate-initial
  - id: refine-output
    name: Refine Output Based on Feedback
    type: agent
    agent_role: "{{refiner}}"
    dependsOn:
      - evaluate-quality
    input:
      source: aggregate
      from:
        - generate-initial
        - evaluate-quality
      transform: merge_as_context
    retry:
      maxAttempts: 2
      backoffMs: 2000
  - id: finalize-output
    name: Finalize Output
    type: agent
    agent_role: "{{generator}}"
    dependsOn:
      - refine-output
    input:
      source: step
      stepId: refine-output
      transform: passthrough
    retry:
      maxAttempts: 1
      backoffMs: 1000
output:
  from: finalize-output
  format: markdown
settings:
  maxParallelism: 1
  failFast: false
  timeout: 600000
  includeRequestCriteria: false
