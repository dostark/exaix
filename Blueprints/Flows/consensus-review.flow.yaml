id: consensus-review
name: Consensus Review Flow
description: Produce candidate analyses from multiple specialists, then select the best by voting consensus.
version: 1.0.0
defaultSkills:
  - verdict-rubric
steps:
  - id: candidate-architecture
    name: Architecture Candidate
    type: agent
    agent_role: software-architect
    dependsOn: []
    input:
      source: request
      transform: passthrough
    timeout: 30000
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: candidate-security
    name: Security Candidate
    type: agent
    agent_role: security-expert
    dependsOn: []
    input:
      source: request
      transform: passthrough
    timeout: 30000
    retry:
      maxAttempts: 1
      backoffMs: 1000
  - id: consensus
    name: Voting Consensus
    type: agent
    agent_role: voting-judge
    dependsOn:
      - candidate-architecture
      - candidate-security
    input:
      source: aggregate
      transform: mergeAsContext
    condition: steps.every(r => r.success)
    retry:
      maxAttempts: 1
      backoffMs: 1000
output:
  from: consensus
  format: markdown
settings:
  maxParallelism: 2
  failFast: false
  timeout: 300000
  includeRequestCriteria: false
