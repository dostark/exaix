id: dogfood-meta-workflow
name: Dogfood Meta-Workflow Pipeline
description: Phase-plan → pre-gap → next-steps (N phases) → post-gap → clean-ci pipeline. Each step maps to a §7.5 identity.
version: 1.0.0
defaultSkills:
  - step-execution
  - exaix-conventions
steps:
  - id: pre-gap
    name: Pre-Gap Analysis
    type: agent
    agent_role: code-analyst
    strategy: react
    dependsOn: []
    input:
      source: request
      transform: passthrough
  - id: next-steps
    name: Implement Steps (TDD)
    type: session_delegate_cycle
    agent_role: dogfood-coder
    dependsOn:
      - pre-gap
    input:
      source: step
      stepId: pre-gap
      transform: passthrough
    delegateCycle:
      requireChangedPaths: true
      review:
        agent_role: quality-judge
        criteria:
          - code_correctness
          - has_tests
          - task_fulfillment
        threshold: 0.8
        onFail: halt
        maxRetries: 3
        includeRequestCriteria: false
  - id: post-gap
    name: Post-Gap Analysis
    type: agent
    agent_role: code-reviewer
    strategy: react
    dependsOn:
      - next-steps
    input:
      source: step
      stepId: next-steps
      transform: passthrough
output:
  from: post-gap
  format: markdown
settings:
  maxParallelism: 1
  failFast: true
  timeout: 600000
  includeRequestCriteria: true
