title: Implementation Planning
triggers:
  tags:
    - implementation-plan
    - implementation-planning
    - migration-planning
    - plan
    - planning
    - design-doc
    - rfc
    - ticket-breakdown
constraints:
  - Plan from agreed requirements and verified code, preserving settled decisions and established terminology
  - Use the project's planning format, language, commands, and test runner. Do not assume Exaix phase plans or a specific stack
  - Keep criteria pending when a material decision is unresolved
  - Prefer complete production slices with bounded checkpoints and actual blocking dependencies
  - Identify production consumers, wiring owners, and integration checks for runtime behavior
  - Record a consumer ledger for runtime changes and end with a documentation and handoff checkpoint
  - Include one non-deferrable integration and cutover checkpoint that wires new behavior into the real production entry point
  - Use compatible expand, migrate, and contract stages only for justified broad mechanical migrations
  - Specify focused tests, independent expectations, failure cases, compatibility checks, and rollback conditions
  - Ground third-party integrations in current official documentation and record the source date
  - Price requirements that force runtime code against a configuration-only alternative
  - Keep ordinary decisions in the plan and propose ADRs only for qualifying consequential tradeoffs
  - Produce a reviewable plan without treating planning as permission to implement or publish
output_requirements:
  - Goal, scope, exclusions, current behavior, and required behavior
  - The chosen planning format and the project-specific language or tooling assumptions
  - Grounded changes, decision rationale, and material alternatives
  - Bounded checkpoints with dependencies, production consumers, a consumer ledger, wiring, and testable acceptance criteria
  - A non-deferrable integration and cutover checkpoint with an end-to-end check through the real production entry point
  - Focused validation, relevant failure cases, documentation, handoff, and migration rollback where applicable
  - Current official sources and retrieval dates for each third-party integration
  - Requirement cost and the configuration-only alternative where runtime code is forced
  - Assumptions, pending decisions, risks, and honest review status
quality_criteria:
  - name: Requirement coverage
    description: Acceptance criteria cover the agreed behavior without speculative scope
    weight: 30
  - name: Grounding and integration
    description: Existing contracts are verified and required production wiring has executable validation
    weight: 30
  - name: Sequencing and compatibility
    description: Bounded checkpoints have actual dependencies and preserve required compatibility
    weight: 25
  - name: Evidence and risk
    description: Tests have independent expectations and the plan records unresolved decisions, risks, and review limits
    weight: 15
related_skills:
  - requirements-analysis
  - architecture-review
applies_to:
  agents:
    - "*"
