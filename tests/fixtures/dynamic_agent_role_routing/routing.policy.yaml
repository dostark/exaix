version: "1.0"
defaultMode: policy_first
allowExperiments: true
rules:
  - ruleId: "prefer-senior-coder"
    priority: 1
    match:
      capability: "code_review"
      language: "typescript"
      portalType: "api"
    prefer:
      agentRole: "senior-coder"
      trafficSplit: 1.0
      fallbackAgentRole: "default-agent"
