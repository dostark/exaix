[system]
version = "1.0.0"
log_level = "info"
root = "__ROOT__"

[watcher]
debounce_ms = 100
stability_check = false

[database]
batch_flush_ms = 100
batch_max_size = 100

[database.sqlite]
journal_mode = "WAL"
foreign_keys = true
busy_timeout_ms = 5000

[agents]
default_model = "default"

[models.default]
provider = "mock"
model = "gpt-5.2-pro"
timeout_ms = 30000

[quality_gate]
enabled = false

[portal_knowledge]
auto_analyze_on_mount = false
default_mode = "quick"
staleness_hours = 24
use_llm_inference = false
enable_ast_analysis = false
enable_vulnerability_scan = false
enable_git_history_analysis = false
enable_test_execution = false
relevance_search_embedding_enabled = false
quick_scan_limit = 50
max_files_to_read = 10
max_pattern_detector_sample_size = 10
min_pattern_detector_sample_size = 1
git_history_commit_limit = 50
ignore_patterns = ["node_modules", ".git"]

[mcp]
enabled = true
transport = "stdio"
server_name = "exaix"
version = "1.0.0"

[ai_retry]
max_attempts = 3
backoff_base_ms = 1000
timeout_per_request_ms = 30000

