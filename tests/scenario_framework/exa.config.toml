[system]
root = "."
version = "1.0.0"
log_level = "info"

[watcher]
debounce_ms = 200
stability_check = true

[amendment]
enabled = true
threshold = 60

[session_delegate]
enabled = false
tool = "claude-code"
gates = ["refinement", "plan_review", "code_changes", "review"]
launch_mode = "headless"
bin_overrides = []

# Phase 157: committed, call-site-addressed fixtures for the flow_blueprints pack. Strict
# mode is scoped per step via MOCK_STRICT env (flows scenarios pin it; identity/skill packs
# don't), so this global fixtures_dir is harmless for other packs — a miss there just falls
# back to pattern dispatch exactly as before. $FRAMEWORK_HOME is expanded by
# seedWorkspaceConfig into an absolute, repo-tree-anchored path.
[ai.mock]
strategy = "recorded"
fixtures_dir = "$FRAMEWORK_HOME/fixtures/mock_recordings/flow_blueprints"

# The daemon default (10 USD/day, packages/core/src/types/constants.ts) is sized for metered
# API spend. Headless CLI providers (claude-cli, opencode-cli) are subscription-billed — no
# real per-call cost — but RateLimitedProvider still tracks their self-reported cost_usd
# against the same persistent per-day budget, tripping RateLimiterError partway through any
# live-provider scenario batch (verified live during Phase 157 Step 3's flow_blueprints
# capture: 10 scenarios' worth of claude-cli calls exhausted the default cap and every
# scenario after that failed on the budget check, not on flow logic). Raised for this
# framework's live-provider runs only — the production default is untouched.
[rate_limiting]
max_cost_per_day = 300.0
