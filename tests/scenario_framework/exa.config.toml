[system]
root = "."
version = "1.0.0"
log_level = "info"

[watcher]
debounce_ms = 200
stability_check = true

[amendment]
enabled = true
threshold = 60

[session_delegate]
enabled = false
tool = "claude-code"
gates = ["refinement", "plan_review", "code_changes", "review"]
launch_mode = "headless"
bin_overrides = []
