[system]
root = "."
version = "1.0.0"
log_level = "info"

[watcher]
debounce_ms = 200
stability_check = true

[amendment]
enabled = true
threshold = 60

[session_delegate]
enabled = false
tool = "claude-code"
gates = ["refinement", "plan_review", "code_changes", "review"]
launch_mode = "headless"
bin_overrides = []

# The strategies scenario analyzes the full repo, which has over 3400 files. The default quick_scan_limit (200)
# scans only the first 400 files in walk order, so convention detection flips when additions shift that window.
# The config maximum makes the analysis cover the whole tree deterministically.
[portal_knowledge]
quick_scan_limit = 10000

# Phase 206 follow-up: pin the shared sandbox's boot provider to the mock explicitly. Without
# an explicit [models] table the boot model otherwise depends on `[ai]`-derived defaults, and a
# test/CI daemon could silently dispatch to a billable provider. Live-provider packs set
# EXA_LLM_PROVIDER per cell, which still wins over this declaration.
[agents]
default_model = "mock"

[ai]
provider = "mock"
model = "test"

[models.mock]
provider = "mock"
model = "test"

# Committed, call-site-addressed fixtures for the flow_blueprints pack. Strict mode is set per step through MOCK_STRICT,
# so this global fixtures_dir is harmless for other packs: a miss there falls back to pattern dispatch.
# seedWorkspaceConfig expands $FRAMEWORK_HOME into an absolute, repo-anchored path.
[ai.mock]
strategy = "recorded"
fixtures_dir = "$FRAMEWORK_HOME/fixtures/mock_recordings/flow_blueprints"

# The daemon default (10 USD/day) suits metered API spend. Subscription-billed CLI providers cost nothing per call,
# but RateLimitedProvider still counts their self-reported cost_usd against that budget, so a live batch trips RateLimiterError.
# This raises the cap for the framework's live runs only.
[rate_limiting]
max_cost_per_day = 300.0

# engine-trigger-matching asserts that two tag-only-reachable skills (reflexive-critique and
# architecture-review) both survive into matched_skill_ids. Their rendered blocks are 2045 and
# 1748 chars; the production default budget (2000) cannot hold both, so the scenario would fail
# on budget, not on trigger matching. 4000 is the value the user guide documents and holds both
# with headroom. Framework-scoped only — the production default is untouched.
[skills]
context_budget_chars = 4000
