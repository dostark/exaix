# @schema-version: 1.0.0
---
id: "permission-escalation-test"
name: "Permission Escalation Prevention"
description: "Verify dynamic mode cannot escalate to write tools"
version: "1.0.0"
output:
  from: step
  step: test
  format: markdown
steps:
  - id: "test"
    name: "Attempt to use write tools in dynamic mode"
    identity: "senior-coder"
    execution_mode: "dynamic"
    permitted_tools:
      - read_file
      - write_file # This should be rejected
    input:
      source: "request"
