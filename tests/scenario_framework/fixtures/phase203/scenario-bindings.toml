[system]
root = "__DOGFOOD_ROOT__"
allow_net = ["127.0.0.1:__COMPAT_FIXTURE_PORT__"]

[ai]
provider = "mock"
model = "mock-model"
timeout_ms = 10000

[ai.mock]
strategy = "pattern"

[quality_gate]
enabled = false

[request_analysis]
enabled = false

[catalog.models."openai/compat-fixture-v1"]
model_provider = "openai"

[catalog.services.svc-a]
adapter = "openai-chat"
profile = "local-test"
endpoint = "http://127.0.0.1:__COMPAT_FIXTURE_PORT__/v1/chat/completions"
allow_insecure_loopback = true
transport = "local"
interface = "api"
key_env = "EXA_COMPAT_TEST_API_KEY"
[catalog.services.svc-a.serves]
"openai/compat-fixture-v1" = "compat-fixture-v1"

[catalog.services.svc-b]
adapter = "openai-chat"
profile = "local-test"
endpoint = "http://127.0.0.1:__COMPAT_FIXTURE_PORT__/v1/chat/completions"
allow_insecure_loopback = true
transport = "local"
interface = "api"
key_env = "EXA_COMPAT_TEST_API_KEY"
[catalog.services.svc-b.serves]
"openai/compat-fixture-v1" = "compat-fixture-v1"

[catalog.services.svc-c]
adapter = "openai-chat"
profile = "local-test"
endpoint = "http://127.0.0.1:__COMPAT_FIXTURE_PORT__/v1/chat/completions"
allow_insecure_loopback = true
transport = "local"
interface = "api"
key_env = "EXA_COMPAT_TEST_API_KEY"
[catalog.services.svc-c.serves]
"openai/compat-fixture-v1" = "compat-fixture-v1"
