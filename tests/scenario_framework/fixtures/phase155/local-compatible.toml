[system]
root = "__DOGFOOD_ROOT__"

[ai]
provider = "openai-chat"
model = "compat-fixture-v1"
timeout_ms = 10000

[ai.compatible]
profile = "local-test"
endpoint = "http://127.0.0.1:__COMPAT_FIXTURE_PORT__/v1/chat/completions"
model = "compat-fixture-v1"
allow_insecure_loopback = true
max_response_bytes = 65536
max_tool_argument_bytes = 8192
max_history_bytes = 65536

[execution]
native_tools_enabled = true

[agents]
default_model = "compat-agent"

[models.compat-agent]
provider = "openai-chat"
model = "compat-fixture-v1"
timeout_ms = 10000
