schema_version: "1.0.0"
id: "blueprint-eval-mixed-outcome"
title: "Mixed outcome with weighted criteria — verifies partial credit scoring"
pack: "blueprint_eval"
tags: ["eval", "scoring", "mixed"]
request_fixture: "fixtures/requests/blueprint_eval/mixed-outcome.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "create-partial-artifacts"
    type: "write-file"
    path: "artifacts/existing-file.txt"
    content: "present"
    output_criteria:
      - id: "check-existing-file"
        kind: "file-exists"
        path: "artifacts/existing-file.txt"
        score_weight: 0.4
      - id: "check-missing-file"
        kind: "file-exists"
        path: "artifacts/non-existent-file.txt"
        score_weight: 0.6
