schema_version: "1.0.0"
id: "codebase-mapping-journal"
title: "Codebase mapping with full Activity Journal audit trail"
pack: "integration_e2e"
tags: ["e2e", "dynamic", "journal", "audit", "traceability", "provider-live"]
request_fixture: "fixtures/requests/integration_e2e/codebase_mapping_journal.md"
mode_support: ["auto", "manual-checkpoint"]
portals:
  - alias: "sample-project"
    source_path: "$WORKSPACE_ROOT/fixtures/portals/simple_repo"
flow_fixture: "fixtures/flows/integration_e2e/codebase_mapping.flow.yaml"
# Phase 142 Step 15 — repaired against the real surfaces. `exactl flow run` has never existed; a
# flow executes when a request naming it in its `flow:` frontmatter is submitted. The sample
# project was built with `mkdir -p /tmp/sample-project`, outside the sandbox and shared between
# runs; it is now the seeded git fixture the runner mounts. `mcp.tool.read_file` and its siblings
# are not action types the journal ever writes — tool calls are journalled as `dynamic_tool_call`.
# Nothing in the repository writes a `flow_run_*.json`, so that wait could only time out.
#
# Tagged provider-live: the tool calls it counts require a real model. The mock provider makes
# none, which is the Step 15 finding.
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    name: "Submit the request whose frontmatter names the flow"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: "plan-produced"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"

  - id: "verify-journal-entries"
    type: "journal-assert"
    name: "Every tool call is journalled, under the run's trace"
    action_type: "dynamic_tool_call"
    trace_scoped: true
    project:
      action_type: "action_type"
      trace_id: "trace_id"
      tool_name: "payload.tool_name"
    output_criteria:
      - id: "multiple-events"
        score_weight: 0.6
        kind: "json-query"
        query: "length"
        min: 3
      - id: "all-have-trace-id"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].trace_id"
        not_empty: true
      - id: "distinct-tools-used"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].tool_name"
        unique_count_min: 2

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
