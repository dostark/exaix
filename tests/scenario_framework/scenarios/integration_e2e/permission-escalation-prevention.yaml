schema_version: "1.0.0"
id: "permission-escalation-prevention"
title: "Permission escalation prevention security test"
pack: "integration_e2e"
tags: ["e2e", "security", "permission-boundary", "negative-test"]
request_fixture: "fixtures/requests/integration_e2e/permission_escalation_prevention.md"
mode_support: ["auto"]
portals: []
# `flow validate` takes a flow ID, not a file path. The runner stages the fixture into the sandbox catalog so the ID resolves.
# Validation is where the escalation is refused, so that is what this asserts. There is no flow-run command to execute the flow.
flow_fixture: "fixtures/flows/integration_e2e/permission_escalation.flow.yaml"
steps:
  - id: "validate-flow"
    type: "exactl"
    name: "A dynamic step granted write_file must fail validation"
    command: "flow"
    args: ["validate", "permission-escalation-test"]
    expect_failure: true
    output_criteria:
      - id: "validation-rejected"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 1
      - id: "names-the-escalating-tool"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["write_file", "dynamic"]

  - id: "read-only-tool-not-flagged"
    type: "exactl"
    name: "The rejection names only the write tool, not the read-only one beside it"
    # Guards against a rule that rejects any dynamic step carrying permitted_tools: the fixture grants read_file and write_file, and only write_file is an escalation.
    # validate fails on the write escalation, so expect_failure makes the non-zero exit the expected outcome. The not-contains criterion asserts read_file is not named as a write tool.
    command: "flow"
    args: ["validate", "permission-escalation-test"]
    expect_failure: true
    output_criteria:
      - id: "read-only-tool-accepted"
        score_weight: 0.6
        kind: "command-output-not-contains"
        not_contains: ['read_file" is a write tool']
