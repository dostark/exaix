schema_version: "1.0.0"
id: "full-refactor-workflow"
title: "End-to-end refactoring workflow with dynamic and declared steps"
pack: "integration_e2e"
tags: ["e2e", "dynamic", "patch_file", "integration", "provider-live"]
request_fixture: "fixtures/requests/integration_e2e/full_refactor_workflow.md"
mode_support: ["manual-checkpoint"]
portals:
  - alias: "sample-project"
    source_path: "$WORKSPACE_ROOT/fixtures/portals/simple_repo"
flow_fixture: "fixtures/flows/integration_e2e/full_refactor.flow.yaml"
# Phase 142 Step 15 — repaired against the real surfaces. `exactl flow run` has never existed; a
# flow executes when a request naming it in its `flow:` frontmatter is submitted. The sample
# project was built with `mkdir -p /tmp/sample-project`, outside the sandbox and shared between
# runs; it is now the seeded git fixture the runner mounts. `mcp.tool.read_file` and its siblings
# are not action types the journal ever writes — tool calls are journalled as `dynamic_tool_call`.
# Nothing in the repository writes a `flow_run_*.json`, so that wait could only time out.
#
# Tagged provider-live: the tool calls it counts require a real model. The mock provider makes
# none, which is the Step 15 finding.
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    name: "Submit the request whose frontmatter names the flow"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: "plan-produced"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"

  - id: "verify-journal"
    type: "shell"
    name: "Both phases of the refactor are journalled as tool calls"
    command: "sh"
    args: [
      "-c",
      "sqlite3 -json \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT action_type, json_extract(payload,'$.tool_name') AS tool_name FROM activity WHERE action_type = 'dynamic_tool_call' ORDER BY rowid\"",
    ]
    output_criteria:
      - id: "exploration-logged"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].tool_name"
        contains: ["read_file"]
      - id: "patch-logged"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].tool_name"
        contains: ["patch_file"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
