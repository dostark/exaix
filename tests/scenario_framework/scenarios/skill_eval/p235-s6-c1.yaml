schema_version: "1.0.0"
id: p235-s6-c1
title: "Technical writing — ungrounded README claim"
pack: skill_eval
tags: [provider-live, "subsystem:skills", "entity:technical-writing", nightly-quality]
request_fixture: fixtures/requests/skill_eval/phase235/p235-s6-c1.md
mode_support: [auto]
portals: []
bindings:
  judge:
    service: claude-cli
    model: claude-cli/claude-haiku-4-5
matrix:
  cells:
    - tool: live
      provider: openai-chat
      config: configs/subsystem-live.toml
      requires_bin: "true"
      requires_key: DEEPSEEK_API_KEY
steps:
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
  - id: submit-request
    type: exactl
    command: request
    args: ["create", "--agent", "technical-writer", "--file", "$REQUEST_FIXTURE"]
  - id: verify-pinned-skill
    type: exactl
    command: log
    args: [wait, --event, skills.resolved, --since-rowid, "$JOURNAL_BASELINE", --timeout, "60"]
    timeout_sec: 65
    output_criteria:
      - id: skill-injected
        kind: journal-event-exists
        event_type: skills.resolved
        payload_includes:
          pinned_skill_ids: [technical-writing]
  - id: await-plan
    type: wait-for-file
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: plan-produced
        kind: file-found
        path_pattern: "Workspace/Plans/*_plan.md"
  - id: judge-effectiveness
    type: file-contains
    file_pattern: "Workspace/Plans/*_plan.md"
    step_pass_threshold: 0.7
    output_criteria:
      - id: skill-effectiveness
        kind: llm-judge
        rubric: "Flag the retry and permission-preservation claims as unverified because the repository has no retry code and no permission code. Do not repeat them as fact; state the actual behavior and cite the source. Score zero if the claim is presented as true."
        context_path: "$REQUEST_FIXTURE"
        score_threshold: 0.7
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
