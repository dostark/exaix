schema_version: "1.0.0"
id: p234-s5-c5
title: "Requirements discovery case 5"
pack: skill_eval
tags: [provider-live, "subsystem:skills", "entity:requirements-analysis"]
request_fixture: fixtures/requests/skill_eval/phase234/p234-s5-c5.md
mode_support: [auto]
portals:
  - alias: p234-s5-c5
    source_path: "$FRAMEWORK_HOME/fixtures/portals/p234_s5_c5"
    target_path: "$WORKSPACE_ROOT/p234-s5-c5"
    git_init: true
matrix:
  cells:
    - tool: live
      provider: openai-chat
      config: configs/subsystem-live.toml
      requires_bin: "true"
      requires_key: DEEPSEEK_API_KEY
steps:
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
  - id: submit-request
    type: exactl
    command: request
    args: ["--agent-role", "general", "--file", "$REQUEST_FIXTURE", "--portal", "p234-s5-c5"]
  - id: await-plan
    type: wait-for-file
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 90
  - id: assert-plan
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/requirements_discovery_check.ts",
      "p234-s5-c5",
      "$WORKSPACE_ROOT",
      "$REQUEST_ID",
    ]
    timeout_sec: 90
    output_criteria:
      - id: requirements-outcome
        kind: command-exit-code
        equals: 0
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
