schema_version: "1.0.0"
id: "skill-revision-cutover"
title: "Real daemon revision cutover — an edit after plan A never reaches A's execution"
pack: "skill_eval"
tags: ["subsystem:skills", "smoke"]
request_fixture: "fixtures/requests/skill_eval/code_review_cutover.md"
mode_support: ["auto"]
scoring: "gated"
portals: []
steps:
  - id: "cutover"
    type: "test-run"
    command: "deno"
    args:
      - "test"
      - "--allow-all"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$REPO_ROOT/tests/integration/skill_revision_cutover_e2e_test.ts"
    env:
      CI: ""
      EXA_PHASE206_EVIDENCE_DIR: "$REPO_ROOT/tests/scenario_framework/output/phase-206"
    timeout_sec: 120
    output_criteria:
      - id: "cutover-safety"
        kind: "command-exit-code"
        equals: 0
        class: "security"
        score_weight: 1.0
      - id: "tests-executed"
        kind: "command-output-contains"
        contains: ["1 passed", "0 failed"]
        score_weight: 0.0
