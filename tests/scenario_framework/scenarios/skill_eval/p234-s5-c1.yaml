schema_version: "1.0.0"
id: p234-s5-c1
title: "Requirements discovery case 1"
pack: skill_eval
tags: [provider-live, "subsystem:skills", "entity:requirements-analysis"]
request_fixture: fixtures/requests/skill_eval/phase234/p234-s5-c1.md
mode_support: [auto]
portals:
  - alias: p234-s5-c1
    source_path: "$FRAMEWORK_HOME/fixtures/portals/p234_s5_c1"
    target_path: "$WORKSPACE_ROOT/p234-s5-c1"
    git_init: true
matrix:
  cells:
    - tool: codex
      provider: codex-cli
      config: configs/codex-terra-61-skill-eval.toml
      requires_bin: "codex"
steps:
  - id: prepare-request-context
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/skill_eval_request_context.ts",
      "$WORKSPACE_ROOT",
      "p234-s5-c1",
    ]
    timeout_sec: 90
    output_criteria:
      - id: request-context-prepared
        kind: command-exit-code
        equals: 0
  - id: capture-workspace-baseline
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/skill_evaluation_evidence.ts",
      baseline,
      "$WORKSPACE_ROOT",
      "p234-s5-c1",
    ]
    timeout_sec: 90
    output_criteria:
      - id: baseline-captured
        kind: command-exit-code
        equals: 0
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
  - id: submit-request
    type: exactl
    command: request
    args: [
      "--effort",
      "high",
      "--agent-role",
      "product-manager",
      "--file",
      "$WORKSPACE_ROOT/p234-s5-c1-request.md",
      "--portal",
      "p234-s5-c1",
    ]
  - id: await-plan
    type: wait-for-file
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 600
  - id: assert-plan
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/requirements_discovery_check.ts",
      "p234-s5-c1",
      "$WORKSPACE_ROOT",
      "$REQUEST_ID",
      initial,
      diagnostic,
    ]
    timeout_sec: 90
    output_criteria:
      - id: requirements-outcome
        kind: command-exit-code
        equals: 0
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
  - id: evaluate-evidence
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/requirements_discovery_check.ts",
      "p234-s5-c1",
      "$WORKSPACE_ROOT",
      "$REQUEST_ID",
      initial,
      evaluate,
    ]
    timeout_sec: 90
    output_criteria:
      - id: independent-evidence-complete
        kind: command-exit-code
        equals: 0
