schema_version: "1.0.0"
id: p234-s2-c3
title: "Runtime diagnosis — missing runner leaves the fix pending"
pack: skill_eval
tags: [provider-live, "subsystem:skills", "entity:fix-bug"]
request_fixture: fixtures/requests/skill_eval/phase234/p234-s2-c3.md
mode_support: [auto]
portals:
  - alias: p234-s2
    source_path: "$FRAMEWORK_HOME/fixtures/portals/p234_s2"
    target_path: "$WORKSPACE_ROOT/p234-s2"
    git_init: true
matrix:
  cells:
    - tool: codex
      provider: codex-cli
      config: configs/codex-terra-61-skill-eval.toml
      requires_bin: "codex"
steps:
  - id: capture-workspace-baseline
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/skill_evaluation_evidence.ts",
      baseline,
      "$WORKSPACE_ROOT",
      "p234-s2-c3",
    ]
    timeout_sec: 90
    output_criteria:
      - id: baseline-captured
        kind: command-exit-code
        equals: 0
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
  - id: submit-request
    type: exactl
    command: request
    args: ["--agent-role", "senior-coder", "--file", "$REQUEST_FIXTURE", "--portal", "p234-s2"]
  - id: await-plan
    type: wait-for-file
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: plan-produced
        kind: file-found
        path_pattern: "Workspace/Plans/*_plan.md"
  - id: assert-diagnosis
    type: run-script
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/runner/bug_diagnosis_runtime_oracle.ts"
      - "p234-s2-c3"
      - "$WORKSPACE_ROOT"
      - "$REQUEST_ID"
      - diagnostic
    timeout_sec: 60
    output_criteria:
      - id: diagnosis-matches
        kind: command-exit-code
        equals: 0
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
  - id: evaluate-evidence
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/skill_evaluation_evidence.ts",
      evaluate,
      "$WORKSPACE_ROOT",
      "p234-s2-c3",
      "$REQUEST_ID",
    ]
    timeout_sec: 90
    output_criteria:
      - id: independent-evidence-complete
        kind: command-exit-code
        equals: 0
