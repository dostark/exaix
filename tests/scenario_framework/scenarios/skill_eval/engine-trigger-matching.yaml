schema_version: "1.0.0"
# Exercises the trigger path: a request with no `skills:` frontmatter, whose tags and body keywords the matcher scores against a skill's declared triggers.
# A fixture that pins `skills:` would short-circuit matching entirely (AgentRunner takes the pinned ids and never calls matchSkills), so it could not observe trigger matching at all.
id: "skill-engine-trigger-matching"
title: "Skill engine — trigger matching hits skills whose triggers match request tags and keywords"
pack: "skill_eval"
tags: ["smoke", "engine", "subsystem:skills"]
request_fixture: "fixtures/requests/skill_eval/trigger_match.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  # A bare event-type match proves only that the matcher ran, because a zero-match result emits the same event. `self-critique` and `architecture-review` are each declared by exactly one skill,
  # and neither word appears in this fixture's request body, so only the tag channel can produce them.
  # Requiring them asserts that request-frontmatter tags survive parsing and reach the matcher.
  - id: "wait-for-match"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "skills.resolved", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "60"]
    timeout_sec: 60
    output_criteria:
      - id: "trigger-match-observed"
        kind: "journal-event-exists"
        event_type: "skills.resolved"
        score_weight: 0.5
        payload_includes:
          matched_skill_ids:
            - "reflexive-critique"
            - "architecture-review"

      # `skills.resolved` reports the union, so on its own it cannot say whether an id arrived by matching or by another route.
      # The matcher's own event proves the matching stage produced them, so keep it alongside.
      - id: "matcher-stage-observed"
        kind: "journal-event-exists"
        event_type: "skills.match_completed"
        score_weight: 0.5
        payload_includes:
          matched_skill_ids:
            - "reflexive-critique"
            - "architecture-review"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
