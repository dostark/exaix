schema_version: "1.0.0"
# Exercises the TRIGGER path — a request with no `skills:` frontmatter, whose tags and body
# keywords the matcher scores against a skill's declared triggers.
#
# The previous version used fixtures/requests/skill_eval/pin_batch1.md, which pins
# `skills: [tdd-methodology, ...]`. Explicit request.skills short-circuits matching entirely
# (AgentRunner takes the pinned ids and never calls matchSkills), so despite its title the
# scenario was a duplicate of skill-pin-batch-1 and could not observe trigger matching at all.
id: "skill-engine-trigger-matching"
title: "Skill engine — trigger matching hits skills whose triggers match request tags and keywords"
pack: "skill_eval"
tags: ["smoke", "engine", "subsystem:skills"]
request_fixture: "fixtures/requests/skill_eval/trigger_match.md"
mode_support: ["auto"]
portals: []
steps:
  # A fresh sandbox has no Memory dir at all, and a reused one has an empty Memory/Skills, so
  # SkillsService loads zero skills: trigger matching cannot fire and a pinned id hydrates to
  # nothing. Seed the repo's real catalog so the pack scores against the skills that ship.
  - id: "setup-skills"
    type: "shell"
    command: "sh"
    args: [
      "-c",
      "mkdir -p $WORKSPACE_ROOT/Memory && cp -r $FRAMEWORK_HOME/../../Memory/Skills $WORKSPACE_ROOT/Memory/Skills",
    ]
    output_criteria:
      - id: "skills-seeded"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  # A bare event-type match proves only that the matcher ran, not that it matched anything —
  # a zero-match result emits the same event. These two skills are reachable ONLY through the
  # tag channel for this fixture: `self-critique` and `architecture-review` are each declared
  # by exactly one skill, and neither word appears in a request body about exception paths,
  # so the keyword scorer cannot produce them. Requiring them is therefore precisely the
  # assertion that request-frontmatter tags survive parsing and reach the matcher (Step 17B).
  - id: "wait-for-match"
    type: "wait-for-journal-event"
    event_type: "skills.resolved"
    timeout_sec: 60
    output_criteria:
      - id: "trigger-match-observed"
        kind: "journal-event-exists"
        event_type: "skills.resolved"
        score_weight: 1.0
        payload_includes:
          matched_skill_ids:
            - "reflexive-critique"
            - "architecture-review"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
