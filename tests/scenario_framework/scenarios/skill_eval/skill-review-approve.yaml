schema_version: "1.0.0"
id: "skill-review-approve"
title: "Skill lifecycle — a draft is reviewed, approved by revision and injected by a real daemon"
pack: "skill_eval"
tags: ["smoke", "subsystem:skills", "entity:review-flow"]
request_fixture: "fixtures/requests/skill_eval/review_approve.md"
mode_support: ["auto"]
portals: []
steps:
  # The folder has no sidecar, so it is a draft. Its revision id is the UUIDv5 of the content hash of
  # exactly these bytes, which is why the approve steps below can name it.
  - id: "write-draft-skill"
    type: "write-file"
    path: "Memory/Skills/learned/review-flow/SKILL.md"
    content: |
      ---
      name: review-flow
      description: Scenario skill that is reviewed before it is injected
      ---
      # Review flow

      SCENARIO_REVIEWED_MARKER

  - id: "validate-catalog"
    type: "exactl"
    command: "skills"
    args: ["validate", "--format", "json"]
    output_criteria:
      - id: "catalog-valid"
        kind: "command-exit-code"
        equals: 0
      - id: "catalog-reports-valid"
        kind: "command-output-contains"
        contains: ['"valid": true']

  - id: "list-shows-the-draft"
    type: "exactl"
    command: "skills"
    args: ["list", "--all"]
    output_criteria:
      - id: "draft-listed"
        kind: "command-output-contains"
        contains: ["review-flow"]

  - id: "derive-another-draft"
    type: "exactl"
    command: "skills"
    args: [
      "derive",
      "--learning-ids",
      "scenario-learning-1,scenario-learning-2",
      "--name",
      "Derived One",
      "--instructions",
      "Derived body.",
    ]
    output_criteria:
      - id: "derive-prints-path-and-revision"
        kind: "command-output-contains"
        contains: ["Draft path: learned/derived-one", "Revision:"]

  - id: "approve-with-a-stale-revision-is-refused"
    type: "exactl"
    command: "skills"
    args: ["approve", "review-flow", "--revision", "00000000-0000-4000-8000-000000000000"]
    expect_failure: true
    output_criteria:
      - id: "stale-approval-exits-1"
        kind: "command-exit-code"
        equals: 1

  - id: "approve-with-a-malformed-revision-is-an-argument-error"
    type: "exactl"
    command: "skills"
    args: ["approve", "review-flow", "--revision", "not-a-uuid"]
    expect_failure: true
    output_criteria:
      - id: "malformed-revision-exits-2"
        kind: "command-exit-code"
        equals: 2

  - id: "approve-the-reviewed-revision"
    type: "exactl"
    command: "skills"
    args: ["approve", "review-flow", "--revision", "2beced21-b31f-5fe8-b100-5dc8256b2fbe"]
    output_criteria:
      - id: "approval-succeeds"
        kind: "command-exit-code"
        equals: 0
      - id: "approval-names-the-reviewed-revision"
        kind: "command-output-contains"
        contains: ["Approved skill: review-flow", "Reviewed revision: 2beced21-b31f-5fe8-b100-5dc8256b2fbe"]

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-usage"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "skills.usage_recorded", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "90"]
    timeout_sec: 90
    input_criteria: []
    output_criteria: []

  - id: "assert-usage-vector-names-the-approved-revision"
    type: "journal-assert"
    action_type: "skills.usage_recorded"
    trace_scoped: true
    payload_contains: ["b8e0484e-a3bd-53db-9e8b-238fa85db4ec"]
    output_criteria:
      - id: "usage-recorded-once"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-approval-journaled-with-the-reviewed-revision"
    type: "journal-assert"
    action_type: "skills.approved"
    payload_equals:
      - path: "name"
        value: "review-flow"
      - path: "reviewed_revision_id"
        value: "2beced21-b31f-5fe8-b100-5dc8256b2fbe"
    expect_count: 1
    output_criteria:
      - id: "approval-journaled"
        kind: "command-exit-code"
        equals: 0

  - id: "revisions-show-the-used-revision"
    type: "exactl"
    command: "skills"
    args: ["revisions", "review-flow"]
    output_criteria:
      - id: "one-use-recorded"
        kind: "command-output-contains"
        contains: ["review-flow", "1 use(s)"]

  - id: "deprecate-the-skill"
    type: "exactl"
    command: "skills"
    args: ["deprecate", "review-flow"]
    output_criteria:
      - id: "deprecated"
        kind: "command-output-contains"
        contains: ["deprecated"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
