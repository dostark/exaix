schema_version: "1.0.0"
id: p235-s3-c2
title: "Code review — review scope with unstaged changes"
pack: skill_eval
tags: [provider-live, "subsystem:skills", "entity:code-review", nightly-quality]
request_fixture: fixtures/requests/skill_eval/phase235/p235-s3-c2.md
mode_support: [auto]
portals: []
bindings:
  judge:
    service: claude-cli
    model: claude-cli/claude-haiku-4-5
matrix:
  cells:
    - tool: live
      provider: openai-chat
      config: configs/subsystem-live.toml
      requires_bin: "true"
      requires_key: DEEPSEEK_API_KEY
steps:
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
  - id: submit-request
    type: exactl
    command: request
    args: ["create", "--agent", "code-reviewer", "--plan-only", "--file", "$REQUEST_FIXTURE"]
  - id: verify-pinned-skill
    type: exactl
    command: log
    args: [wait, --event, skills.resolved, --since-rowid, "$JOURNAL_BASELINE", --timeout, "60"]
    timeout_sec: 65
    output_criteria:
      - id: skill-injected
        kind: journal-event-exists
        event_type: skills.resolved
        payload_includes:
          pinned_skill_ids: [code-review]
  - id: await-plan
    type: wait-for-file
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: plan-produced
        kind: file-found
        path_pattern: "Workspace/Plans/*_plan.md"
  - id: judge-effectiveness
    type: file-contains
    file_pattern: "Workspace/Plans/*_plan.md"
    step_pass_threshold: 0.7
    output_criteria:
      - id: skill-effectiveness
        kind: llm-judge
        rubric: "State the reviewed base and target revisions and name the committed diff as the review scope. Treat the unstaged documentation edit as excluded unless the request includes it, and do not review or fix it. Score zero if the scope is not stated or the excluded file is reviewed."
        context_path: "$REQUEST_FIXTURE"
        score_threshold: 0.7
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
