schema_version: "1.0.0"
id: p234-s1-c2
title: "Bug diagnosis — intermittent two-caller race"
pack: skill_eval
tags: [provider-live, "subsystem:skills", "entity:fix-bug"]
request_fixture: fixtures/requests/skill_eval/phase234/p234-s1-c2.md
mode_support: [auto]
portals:
  - alias: exaix-self
    source_path: "$FRAMEWORK_HOME/fixtures/portals/p234_s1"
    target_path: "$WORKSPACE_ROOT/p234-s1"
    git_init: true
steps:
  - id: prepare-dogfood-workspace
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/planning_workspace.ts",
      "$WORKSPACE_ROOT",
      "p234-s1-c2",
    ]
    timeout_sec: 90
    output_criteria:
      - id: dogfood-workspace-ready
        kind: command-exit-code
        equals: 0
  - id: capture-workspace-baseline
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/skill_evaluation_evidence.ts",
      baseline,
      "$WORKSPACE_ROOT",
      "p234-s1-c2",
    ]
    timeout_sec: 90
    output_criteria:
      - id: baseline-captured
        kind: command-exit-code
        equals: 0
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
  - id: submit-request
    type: exactl
    command: request
    args: ["create", "--agent", "senior-coder", "--file", "$REQUEST_FIXTURE", "--portal", "exaix-self"]
  - id: await-plan
    type: wait-for-file
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: plan-produced
        kind: file-found
        path_pattern: "Workspace/Plans/*_plan.md"
  - id: assert-diagnosis
    type: run-script
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/fixtures/skill_eval/phase234/bug_diagnosis_oracle.ts"
      - "p234-s1-c2"
      - "$WORKSPACE_ROOT"
      - "$REQUEST_ID"
      - diagnostic
    timeout_sec: 60
    output_criteria:
      - id: diagnosis-matches
        kind: command-exit-code
        equals: 0
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
  - id: evaluate-evidence
    type: run-script
    command: deno
    args: [
      run,
      -A,
      --config,
      "$REPO_ROOT/deno.json",
      "$FRAMEWORK_HOME/runner/skill_evaluation_evidence.ts",
      evaluate,
      "$WORKSPACE_ROOT",
      "p234-s1-c2",
      "$REQUEST_ID",
    ]
    timeout_sec: 90
    output_criteria:
      - id: independent-evidence-complete
        kind: command-exit-code
        equals: 0
