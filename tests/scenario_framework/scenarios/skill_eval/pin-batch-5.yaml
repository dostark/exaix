schema_version: "1.0.0"
id: "skill-pin-batch-5"
title: "Skill injection — pin batch 5 via skills: frontmatter"
pack: "skill_eval"
tags: ["smoke", "subsystem:skills"]
request_fixture: "fixtures/requests/skill_eval/pin_batch5.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  # Waits on `skills.resolved`, not `skills.match_completed`: matching is deliberately
  # skipped for a request that pins skills, so match_completed never fires on this path and
  # the step could only pass by accident, when some later plan step happened to call the
  # matcher. `payload_includes` then checks the pinned ids actually reached the resolved set,
  # which is the propagation this scenario exists to prove — and, because each batch pins a
  # distinct set, it also stops one batch's event from satisfying another's assertion in the
  # shared sandbox.
  - id: "wait-for-completion"
    type: "wait-for-journal-event"
    event_type: "skills.resolved"
    timeout_sec: 60
    output_criteria:
      - id: "skills-matched"
        kind: "journal-event-exists"
        event_type: "skills.resolved"
        score_weight: 1.0
        payload_includes:
          pinned_skill_ids:
            - "response-contract"
            - "response-contract-code-analysis"
            - "response-contract-judge"
            - "response-contract-performance"
            - "response-contract-qa"
            - "response-contract-security-analysis"
            - "conversational-dialogue"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
