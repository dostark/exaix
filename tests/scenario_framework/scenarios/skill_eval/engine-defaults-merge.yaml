schema_version: "1.0.0"
id: "skill-engine-defaults-merge"
title: "Skill engine — identity default_skills merge with pinned skills"
pack: "skill_eval"
tags: ["smoke", "engine", "subsystem:skills"]
request_fixture: "fixtures/requests/skill_eval/pin_batch1.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--identity", "senior-coder", "--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  # The merge rule under test is pinned ∪ matched ∪ defaults, so the assertion has to see
  # BOTH sides in one event: the ids pinned by the fixture and senior-coder's own
  # default_skills. `skills.match_completed` reports only the matching stage — which this
  # pinned request skips entirely — so it could never show the merge.
  - id: "wait-for-match"
    type: "wait-for-journal-event"
    event_type: "skills.resolved"
    timeout_sec: 60
    output_criteria:
      - id: "defaults-merged"
        kind: "journal-event-exists"
        event_type: "skills.resolved"
        score_weight: 1.0
        payload_includes:
          pinned_skill_ids:
            - "tdd-methodology"
            - "security-first"
          default_skill_ids:
            - "response-contract"
          skill_ids:
            - "tdd-methodology"
            - "response-contract"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
