schema_version: "1.0.0"
# Seeds a sandboxed SessionMemoryService and MemoryBankService with the fixtures/memory/info-extraction-basic session write,
# queries through the real keyword-retrieval surface (run_memory_replay.ts), and scores the retrieved ids with the recall-at-k criterion. Deterministic, with no LLM or provider.
id: "memory-info-extraction-basic"
title: "Memory evaluation — information-extraction ability scores recall@k end-to-end"
pack: "memory"
tags: ["domain", "subsystem:memory", "ability:information-extraction", "memory-corpus-version:phase148-v1"]
request_fixture: "fixtures/requests/memory/info_extraction_basic.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "memory-replay-info-extraction"
    type: "run-script"
    name: "seed one learning, query it, capture retrieved ids via the real retrieval surface"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/run_memory_replay.ts"
      - "$WORKSPACE_ROOT"
      - "$FRAMEWORK_HOME/fixtures/memory/info-extraction-basic/task.json"
    output_criteria:
      - id: "recall-at-k-perfect"
        kind: "recall-at-k"
        k: 5
        ground_truth_ids: ["aaaaaaaa-0000-4000-8000-000000000001"]
        score_weight: 1.0
