schema_version: "1.0.0"
# Staleness (current-over-retired retrieval preference) is a consolidation-quality metric that also measures the knowledge-updates ability, so this scenario carries both tags: ability:knowledge-updates and metric:staleness.
# run_memory_staleness_check.ts performs a real supersede (MemoryBankService.supersedeLearning), queries the real retrieval surface, and scores the result with computeStalenessCorrect.
id: "memory-staleness-basic"
title: "Memory evaluation — staleness: retrieval prefers the current fact over the retired one"
pack: "memory"
tags: [
  "domain",
  "subsystem:memory",
  "ability:knowledge-updates",
  "metric:staleness",
  "memory-corpus-version:phase148-v1",
]
request_fixture: "fixtures/requests/memory/staleness_basic.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "memory-staleness-check"
    type: "run-script"
    name: "supersede a retired fact with a current one, query, confirm staleness-correct retrieval"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/run_memory_staleness_check.ts"
      - "$WORKSPACE_ROOT"
    output_criteria:
      - id: "staleness-correct-perfect"
        kind: "json-query"
        query: ".staleness_correct"
        equals: 1
