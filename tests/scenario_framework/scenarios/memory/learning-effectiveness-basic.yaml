schema_version: "1.0.0"
# Learning effectiveness has no ability: slot, so this scenario is tagged metric:learning-effectiveness. run_learning_effectiveness.ts runs a cold workspace (nothing seeded, so recall is 0) and a warm workspace.
# The warm one runs task A's lesson through MemoryExtractorService, HeuristicExtractionStrategy and MemoryAutoApprovalService, then queries task B.
# This is the deterministic ci-core-tier leg with no LLM. learning_effectiveness_live_test.ts covers the live claude-cli leg.
id: "memory-learning-effectiveness-basic"
title: "Memory evaluation — learning-effectiveness: warm minus cold recall (heuristic extraction)"
pack: "memory"
tags: ["domain", "subsystem:memory", "metric:learning-effectiveness", "memory-corpus-version:phase148-v1"]
request_fixture: "fixtures/requests/memory/learning_effectiveness_basic.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "memory-learning-effectiveness-check"
    type: "run-script"
    name: "cold vs. warm recall of a freshly-extracted learning via the real extraction+approval pipeline"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/run_learning_effectiveness.ts"
      - "$WORKSPACE_ROOT/cold"
      - "$WORKSPACE_ROOT/warm"
      - "The database connection pool has a maximum of 20 connections."
      - "maximum of 20 connections"
    output_criteria:
      - id: "learning-effectiveness-perfect"
        kind: "json-query"
        query: ".learning_effectiveness"
        equals: 1
