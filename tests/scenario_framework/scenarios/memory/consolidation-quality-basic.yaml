schema_version: "1.0.0"
# Consolidation-quality metrics (dedup rate and contradiction correctness) have no ability: slot, so this scenario is tagged metric:consolidation-quality.
# computeMemoryMetricRows in eval_commands.ts groups it apart from the per-ability table.
# run_memory_consolidation_check.ts performs a near-duplicate merge (supersedeLearning) and a contradiction update (updateLearning) on a real MemoryBankService, then scores the store with computeDedupRate and computeContradictionCorrect.
id: "memory-consolidation-quality-basic"
title: "Memory evaluation — consolidation-quality: dedup rate and contradiction correctness"
pack: "memory"
tags: ["domain", "subsystem:memory", "metric:consolidation-quality", "memory-corpus-version:phase148-v1"]
request_fixture: "fixtures/requests/memory/consolidation_quality_basic.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "memory-consolidation-check"
    type: "run-script"
    name: "merge a near-duplicate and correct a contradicted fact via the real MemoryBankService"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/run_memory_consolidation_check.ts"
      - "$WORKSPACE_ROOT"
    output_criteria:
      - id: "dedup-rate-perfect"
        kind: "json-query"
        query: ".dedup_rate"
        equals: 1
      - id: "contradiction-correct-perfect"
        kind: "json-query"
        query: ".contradiction_correct"
        equals: 1
