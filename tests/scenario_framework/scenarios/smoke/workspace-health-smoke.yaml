schema_version: "1.0.0"
id: "workspace-health-smoke"
title: "Workspace health smoke — a request travels through a running daemon and produces a plan"
pack: "smoke"
# The previous version only checked that `exactl request` exited 0, which passes with no daemon
# running. This version proves the baseline path: daemon up, request picked up, plan written with
# the frontmatter every later stage reads.
tags: ["smoke", "workspace"]
request_fixture: "fixtures/requests/shared/workspace_health_smoke.md"
mode_support: ["auto"]
portals: []
matrix:
  cells:
    - tool: "exactl"
      provider: "mock"
      config: "configs/agent-flows-mock-pattern.toml"
      requires_bin: "true"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "workspace-health-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    input_criteria:
      - id: "workspace-health-fixture-exists"
        kind: "file-exists"
        path: "$REQUEST_FIXTURE"
    output_criteria:
      - id: "request-created"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.5

  - id: "validate-plan-frontmatter"
    type: "json-assert"
    file_pattern: "**/Plans/*_plan.md"
    output_criteria:
      - id: "has-trace"
        kind: "frontmatter-field-exists"
        field: "trace_id"
      - id: "has-agent-role"
        kind: "frontmatter-field-exists"
        field: "agent_role"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
