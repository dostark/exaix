schema_version: "1.0.0"
id: "default-smoke"
title: "default agent-role smoke and live validation"
pack: "agent_role_eval"
tags: ["smoke", "subsystem:agent_roles", "entity:default"]
request_fixture: "fixtures/requests/provider_live/default.md"
mode_support: ["auto"]
portals:
  - alias: portal-exaix
    source_path: "$REPO_ROOT"
bindings:
  judge:
    service: claude-cli
    model: claude-cli/claude-haiku-4-5
matrix:
  cells:
    - tool: exactl
      provider: mock
      config: configs/agent-flows-mock-pattern.toml
      requires_bin: "true"
    - tool: live
      provider: openai-chat
      config: configs/subsystem-live.toml
      requires_bin: "true"
      requires_key: DEEPSEEK_API_KEY
      requires_optin: EXA_MATRIX_AGENT_ROLE_LIVE
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "$CELL_PROVIDER"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    cells: [exactl]
    type: "exactl"
    command: "request"
    args: ["--plan-only", "--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-plan"
    cells: [exactl]
    type: "wait-for-file"
    args: ["**/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/*_plan.md"
        score_weight: 0.5

  - id: "validate-plan-structure"
    cells: [exactl]
    type: "json-assert"
    file_pattern: "**/*_plan.md"
    output_criteria:
      # The point of an agent-role smoke is that THIS agent role produced the plan.
      # frontmatter-field-exists only proves the field is present — PlanWriter stamps it
      # unconditionally, so every agent-role scenario would pass with the wrong agent role.
      - id: "plan-attributed-to-agent-role"
        score_weight: 1.0
        kind: "frontmatter-field-equals"
        field: "agent_role"
        equals: "default"
      - id: "has-subject"
        score_weight: 0.5
        kind: "frontmatter-field-exists"
        field: "subject"
      - id: "has-trace"
        score_weight: 0.3
        kind: "frontmatter-field-exists"
        field: "trace_id"

  # Frontmatter alone says nothing about whether a real plan was produced. The plan BODY
  # carries the structure the original `$.steps[0]` criterion was reaching for.
  - id: "verify-plan-has-steps"
    cells: [exactl]
    type: "file-contains"
    name: "The produced plan contains an executable step structure"
    file_pattern: "Workspace/Plans/*_plan.md"
    output_criteria:
      - id: "plan-has-execution-steps"
        kind: "text-matches"
        matches: ["## Execution Steps", "## Step 1"]
        score_weight: 0.8

  - id: "create-plan-request"
    type: "exactl"
    command: "request"
    args: ["--agent-role", "default", "--portal", "portal-exaix", "--plan-only", "--file", "$REQUEST_FIXTURE"]
    cells: ["live"]

  - id: "wait-for-live-plan"
    type: "wait-for-file"
    args: ["**/*_plan.md"]
    timeout_sec: 180
    cells: ["live"]

  - id: "validate-live-plan-structure"
    type: "json-assert"
    file_pattern: "**/*_plan.md"
    cells: ["live"]
    output_criteria:
      - id: "artifact-attributed-to-role"
        kind: "frontmatter-field-equals"
        field: "agent_role"
        equals: "default"

  - id: "validate-plan-content"
    type: "file-contains"
    file_pattern: "**/*_plan.md"
    cells: ["live"]
    step_pass_threshold: 0.7
    output_criteria:
      - id: "quality-plan"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        context_path: "$REQUEST_FIXTURE"
        score_threshold: 0.7

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
