schema_version: "1.0.0"
id: "senior-coder-smoke"
title: "senior-coder agent-role smoke and live validation"
pack: "agent_role_eval"
tags: ["smoke", "subsystem:agent_roles", "entity:senior-coder"]
request_fixture: "fixtures/requests/provider_live/senior_coder.md"
mode_support: ["auto", "step"]
portals:
  - alias: "portal-exaix"
    source_path: "$REPO_ROOT"
bindings:
  # The judge grades through a CLI delegate, so it needs no provider credential.
  judge:
    service: "claude-cli"
    model: "anthropic/claude-sonnet-5"
matrix:
  cells:
    # The mock cell is the former smoke. CI runs it and scores its structural criteria.
    - tool: "exactl"
      provider: "mock"
      config: "configs/agent-flows-mock-pattern.toml"
      requires_bin: "true"
    # The live cell is the former validation. It stays opt-in, so CI records a skip.
    - tool: "live"
      provider: "live"
      config: "configs/anthropic-no-delegate.toml"
      requires_bin: "true"
      requires_key: "ANTHROPIC_API_KEY"
      requires_optin: "EXA_MATRIX_AGENT_ROLE_LIVE"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      # The cell's config pins the provider. The matrix overlay supplies EXA_CONFIG_PATH.
      EXA_LLM_PROVIDER: "$CELL_PROVIDER"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  # --- mock cell: the former smoke's structural assertions ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--agent-role", "senior-coder", "--plan-only", "--file", "$REQUEST_FIXTURE"]
    cells: ["exactl"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/*_plan.md"]
    timeout_sec: 120
    cells: ["exactl"]
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/*_plan.md"
        score_weight: 0.5

  - id: "validate-plan-structure"
    type: "json-assert"
    file_pattern: "**/*_plan.md"
    cells: ["exactl"]
    output_criteria:
      # The point of an agent-role smoke is that THIS agent role produced the plan.
      # frontmatter-field-exists only proves the field is present, and PlanWriter stamps it
      # unconditionally, so every agent-role scenario would pass with the wrong agent role.
      - id: "plan-attributed-to-agent-role"
        score_weight: 1.0
        kind: "frontmatter-field-equals"
        field: "agent_role"
        equals: "senior-coder"
      - id: "has-subject"
        score_weight: 0.5
        kind: "frontmatter-field-exists"
        field: "subject"
      - id: "has-trace"
        score_weight: 0.3
        kind: "frontmatter-field-exists"
        field: "trace_id"

  # Frontmatter alone says nothing about whether a real plan was produced. The plan body
  # carries the structure the original `$.steps[0]` criterion was reaching for.
  - id: "verify-plan-has-steps"
    type: "file-contains"
    name: "The produced plan contains an executable step structure"
    file_pattern: "Workspace/Plans/*_plan.md"
    cells: ["exactl"]
    output_criteria:
      - id: "plan-has-execution-steps"
        kind: "text-matches"
        matches: ["## Execution Steps", "## Step 1"]
        score_weight: 0.8

  # --- live cell: the former validation's plan and judge assertions ---
  - id: "create-plan-request"
    type: "exactl"
    command: "request"
    args: ["--agent-role", "senior-coder", "--portal", "portal-exaix", "--plan-only", "--file", "$REQUEST_FIXTURE"]
    cells: ["live"]

  - id: "wait-for-live-plan"
    type: "wait-for-file"
    args: ["**/*_plan.md"]
    timeout_sec: 180
    cells: ["live"]

  - id: "validate-plan-content"
    type: "json-assert"
    file_pattern: "**/*_plan.md"
    cells: ["live"]
    output_criteria:
      - id: "has-steps"
        score_weight: 0.8
        kind: "json-path-exists"
        path: "$.steps[0]"
      - id: "quality-plan"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        context_path: "$REQUEST_FIXTURE"
        score_threshold: 0.7

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
