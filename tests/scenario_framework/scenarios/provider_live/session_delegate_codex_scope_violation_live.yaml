schema_version: "1.0.0"
id: "session-delegate-codex-scope-violation-live"
title: "Session Delegation — Codex Worktree + External Scope Violation (provider-live, safety-gate)"
pack: "provider_live"
# safety-gate: proves BOTH layers of Codex's scope enforcement (Phase 167 Step 4, GAP-6):
# --sandbox workspace-write confines writes to the Codex workspace root (an external write
# never lands on disk), and the post-hoc checkScope guard (reconcile.ts ->
# session_return_watcher.ts) rejects an in-worktree write outside permitted_paths as
# session.delegate.scope_violation. Companion to session_delegate_scope_violation_live.yaml
# (opencode); this is the Codex-specific, config-preset-driven variant naming both guard
# layers explicitly, all asserted under the SAME request trace (trace_scoped: true).
tags: ["provider-live", "session-delegation", "safety-gate", "security"]
request_fixture: "fixtures/requests/provider_live/session_delegate_codex_scope_violation.md"
mode_support: ["auto"]
portals:
  - alias: "test-portal"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/test-portal"
    git_init: true

steps:
  # Requires the `codex` CLI on PATH with a stored `codex login` credential — opt-in via
  # the provider-live tag (never selected by default CI profiles), same as every other
  # scenario in this pack. configs/dogfood.codex.toml pins tool=codex,
  # permitted_paths=["src/**","tests/**"] — README.md (part 1 of the request) is
  # deliberately outside both globs.
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CONFIG_PATH: "$FRAMEWORK_HOME/../../configs/dogfood.codex.toml"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # NOTE: do NOT set EXA_CONFIG_PATH here — the runner's default already points every
  # later step at the materialized <workspace>/exa.config.toml (see
  # session_delegate_hardening_active_live.yaml's identical note). [session_delegate] is
  # entirely config-file-driven here (no EXA_SESSION_DELEGATE_* overrides needed), so the
  # materialized file already carries tool=codex/permitted_paths from dogfood.codex.toml.
  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # --- The genuine isolation proof, three parts under the same request trace ---

  - id: "assert-scope-violation-journalled"
    type: "journal-assert"
    action_type: "session.delegate.scope_violation"
    trace_scoped: true
    output_criteria:
      - id: "scope-violation-event-present"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.34

  # session.delegate.reconciled is journaled on every OTHER terminal outcome (accept or a
  # non-scope rejection) but NEVER on scope_violation — session_return_watcher.ts's
  # scope_violation branch journals ScopeViolation and returns without journaling
  # Reconciled at all. Its absence for this trace IS "the wait was never resumed":
  # SessionReturnProcessor only resumes the durable wait store on the accepted path, which
  # this run must never reach.
  - id: "assert-wait-not-resumed"
    type: "journal-assert"
    action_type: "session.delegate.reconciled"
    trace_scoped: true
    expect_count: 0
    output_criteria:
      - id: "no-reconciled-event"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.33

  # The request's part 2 asked for a write entirely outside the portal worktree.
  # --sandbox workspace-write must confine the delegate to the Codex workspace root, so
  # this file must never land on disk regardless of what the model attempted.
  - id: "assert-external-sentinel-absent"
    type: "file-contains"
    name: "[security] the external write attempt left nothing on disk outside the worktree"
    file_pattern: "**/exaix-codex-external-scope-violation-sentinel.txt"
    output_criteria:
      - id: "external-sentinel-absent"
        kind: "file-not-exists"
        path: "/tmp/exaix-codex-external-scope-violation-sentinel.txt"
        score_weight: 0.33

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
