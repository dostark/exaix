schema_version: "1.0.0"
id: "session-delegate-hardening-active-live"
title: "Session Delegation — Permission Hardening Active (provider-live, safety-gate)"
pack: "provider_live"
# safety-gate: proves the pre-flight permission guard prevents out-of-permitted_paths edits before they happen. With hardening enabled,
# the same request that triggers session.delegate.scope_violation without hardening completes cleanly. Uses the sandbox's pre-deployed portal-exaix (the repo itself) as the target.
tags: ["provider-live", "session-delegation", "safety-gate"]
request_fixture: "fixtures/requests/provider_live/session_delegate_code_change.md"
mode_support: ["auto"]
portals:
  - alias: "test-portal"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/test-portal"
    git_init: true

steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CONFIG_PATH: "$REPO_ROOT/configs/dogfood.claude.toml"
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_TOOL: "opencode"
      EXA_SESSION_DELEGATE_GATES: "code_changes"
      EXA_SESSION_DELEGATE_LAUNCH_MODE: "headless"
      EXA_SESSION_DELEGATE_HARDEN_PERMISSIONS: "true"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # restart-daemon must re-apply the delegate overrides: the restarted daemon re-reads the EXA_SESSION_DELEGATE_* env. Without them it falls back to the materialized [session_delegate] (tool=claude-code),
  # the hardening (opencode) path is silently not exercised, and the run would pass but prove nothing.
  # Do not set EXA_CONFIG_PATH here: the runner's default already points every step at the materialized <workspace>/exa.config.toml, and the raw preset would re-introduce the unresolved __DOGFOOD_ROOT__ sentinel.
  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    env:
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_TOOL: "opencode"
      EXA_SESSION_DELEGATE_GATES: "code_changes"
      EXA_SESSION_DELEGATE_LAUNCH_MODE: "headless"
      EXA_SESSION_DELEGATE_HARDEN_PERMISSIONS: "true"
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # Pre-flight guard proof: the delegate completed without scope_violation. The same request without hardening triggers it (session_delegate_scope_violation_live.yaml).
  # With hardening, the tool's generated opencode.jsonc permission config refuses the out-of-scope edit pre-flight, so the post-hoc checkScope never sees the escaping path.
  # Result: session.delegate.reconciled with accepted, and no scope_violation.
  - id: "assert-reconciled-clean"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "reconciled-event-accepted"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"
        payload_absent:
          rejected: true

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
