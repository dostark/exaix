schema_version: "1.0.0"
id: "model-intent-e2e"
title: "Model Intent E2E — model-size M + thinking routing, plus Phase 134 Solo curated-list resolution (preferred_list)"
pack: "provider_live"
# Phase 142 Step 7 — retagged `provider-live` -> `manual-only`. The tag was overloaded to mean
# both "needs a real model" and "keep out of CI", and this scenario is the second, not the
# first: it asserts `model.resolved` is journalled with `preferred_list`, which is routing
# mechanics the mock provider exercises — hence the deliberate `EXA_LLM_PROVIDER: "mock"` pin
# below. Claiming provider-live while forcing mock meant the tier it advertised could never
# run it. `manual-only` is in CI_EXCLUDED_TAGS, so it stays out of CI either way.
tags: ["manual-only", "model-routing", "safety-gate"]
request_fixture: "fixtures/requests/provider_live/model_intent.md"
mode_support: ["auto"]
portals: []

steps:
  # --- Setup ---
  - id: "setup-blueprints"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Blueprints", "$WORKSPACE_ROOT/Blueprints"]
    output_criteria:
      - id: "blueprints-copied"
        kind: "command-exit-code"
        equals: 0

  # --- Start daemon ---
  # Phase 134 Solo curation: the dogfood config carries model_presets.M.candidates =
  # ["anthropic"] (the curated list). The runner materializes that config into the
  # workspace's exa.config.toml the daemon reads, so the size-M request below resolves
  # via the preferred list (reason: preferred_list) instead of scoring — the Solo
  # curation loop proven on the real daemon path, no separate seeding step needed.
  # Uses the no-delegate variant of the dogfood.claude preset (identical otherwise):
  # dogfood.claude.toml's session_delegate.gates = ["code_changes"] intercepts EVERY
  # plan step unconditionally once a plan is approved (apps/daemon/main.ts's
  # onCodeChangesDelegate wiring has no step-content filter), routing it to the headless
  # `claude -p` delegate instead of AgentOrchestrator/ModelResolver — so model.resolved would
  # never fire for this scenario's approved plan.
  - id: "start-daemon"
    type: "exactl"
    command: "daemon start"
    env:
      EXA_CONFIG_PATH: "$FRAMEWORK_HOME/../../configs/dogfood.claude.no-delegate.toml"
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Submit request with --model-size M --thinking ---
  # --portal exaix-self: the request fixture carries no portal frontmatter, so
  # resolvePortalName (packages/core/src/planning/plan_executor.ts) would otherwise fall
  # back to the "workspace" alias, which no dogfood config registers — executeStep would
  # error "Portal not found: workspace" once the plan is approved and executed. exaix-self
  # is the portal the dogfood.claude.no-delegate.toml preset already registers.
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: [
      "--file",
      "$REQUEST_FIXTURE",
      "--model-size",
      "M",
      "--thinking",
      "--portal",
      "exaix-self",
      "--subject",
      "Model intent e2e test",
    ]
    output_criteria:
      - id: "request-submitted"
        kind: "command-exit-code"
        equals: 0

  # --- Wait for plan to be created ---
  - id: "wait-for-plan"
    type: "shell"
    command: "sh"
    args:
      - "-c"
      - |
          for i in $(seq 1 90); do
            count=$(ls "$WORKSPACE_ROOT/Workspace/Plans/"*_plan.md 2>/dev/null | wc -l)
            if [ "$count" -ge 1 ]; then
              echo "Plan file found"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout: no plan created after 180s"
          exit 1
    output_criteria:
      - id: "plan-created"
        kind: "command-exit-code"
        equals: 0

  # --- Verify plan exists and request model_size/thinking flags are preserved ---
  - id: "verify-model-intent"
    type: "shell"
    command: "sh"
    args:
      - "-c"
      - |
          plan_file=$(ls "$WORKSPACE_ROOT/Workspace/Plans/"*_plan.md 2>/dev/null | head -1)
          request_file=$(ls "$WORKSPACE_ROOT/Workspace/Requests/"*.md 2>/dev/null | head -1)
          if [ -z "$plan_file" ]; then
            echo "FAIL: no plan file found"
            exit 1
          fi
          echo "Plan file: $plan_file"
          if [ -n "$request_file" ]; then
            echo "Request file: $request_file"
            if grep -q "^model_size:" "$request_file"; then
              model_size=$(grep "^model_size:" "$request_file" | sed 's/^model_size: *//')
              echo "Request model_size: $model_size"
            fi
            if grep -q "^thinking:" "$request_file"; then
              thinking=$(grep "^thinking:" "$request_file" | sed 's/^thinking: *//')
              echo "Request thinking: $thinking"
            fi
          fi
          echo "Plan uses a model matching M profile with thinking enabled"
    output_criteria:
      - id: "model-verified"
        kind: "command-exit-code"
        equals: 0

  # --- Approve the plan, moving it to Workspace/Active so ExecutionLoop picks it up ---
  # Without this, the plan sits in Workspace/Plans/ (review status) forever — ExecutionLoop
  # never sees it, ModelResolver never runs, and model.resolved never fires. verify-model-intent
  # above only checks the plan FILE exists, not that it was ever executed.
  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        kind: "command-exit-code"
        equals: 0

  # --- Wait for ExecutionLoop to pick up the approved plan and reach ModelResolver.resolve() ---
  # approve-plan only moves the plan file to Workspace/Active and returns — it does not wait
  # for the file watcher to detect it, execute the step, and journal model.resolved. Without
  # this barrier, verify-model-resolved-preferred-list below ran ~30ms after approval, well
  # before execution reached ModelResolver, and always observed an empty journal.
  - id: "wait-for-model-resolved"
    type: "wait-for-journal-event"
    event_type: "model.resolved"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Phase 134 Step 7 Solo checkpoints: model.resolved journalled via the curated list ---
  # The production resolver (agent_executor.resolveModelFromBlueprint -> ModelResolver.resolve)
  # journals model.resolved. With the curated list (model_presets.M.candidates = ["anthropic"])
  # materialized into the workspace config, the reason must be preferred_list — the Solo
  # curation loop reached from the real daemon run. Queried via the journal CLI (the
  # `exactl logs --filter model.resolved` trace surface the plan names), asserted with
  # json-query over its JSON output.
  - id: "verify-model-resolved-preferred-list"
    type: "exactl"
    name: "model.resolved journalled with reason preferred_list (Solo curated list won)"
    command: "journal"
    args: ["--filter", "action_type=model.resolved", "--format", "json"]
    output_criteria:
      - id: "model-resolved-present"
        score_weight: 1.0
        kind: "json-query"
        query: ".[].action_type"
        contains: ["model.resolved"]
      # The journal CLI serializes each record's payload as a JSON string, so the reason
      # is asserted as a substring of the payload text rather than a nested object path.
      - id: "reason-is-preferred-list"
        score_weight: 1.0
        kind: "json-query"
        query: ".[].payload"
        contains: ["preferred_list"]

  # --- Stop daemon ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon stop"
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
