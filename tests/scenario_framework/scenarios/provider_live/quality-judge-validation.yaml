schema_version: "1.0.0"
id: "quality-judge-validation"
title: "Quality Judge agent validation"
pack: "provider_live"
tags: ["provider-live", "planning", "subsystem:identities", "entity:quality-judge"]
request_fixture: "fixtures/requests/provider_live/quality_judge.md"
mode_support: ["auto", "step"]
portals:
  - alias: "portal-exaix"
    source_path: "$FRAMEWORK_HOME/../.."
steps:
  - id: "create-plan-request"
    type: "exactl"
    command: "request"
    args:
      - "--agent-role"
      - "quality-judge"
      - "--portal"
      - "portal-exaix"
      - "--plan-only"
      - "--file"
      - "$REQUEST_FIXTURE"
  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/*_plan.md"]
    timeout_sec: 180
  - id: "validate-plan-content"
    type: "json-assert"
    file_pattern: "**/*_plan.md"
    output_criteria:
      - id: "has-steps"
        score_weight: 0.8
        kind: "json-path-exists"
        path: "$.steps[0]"
      - id: "quality-plan"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        context_path: "$REQUEST_FIXTURE"
        score_threshold: 0.7
