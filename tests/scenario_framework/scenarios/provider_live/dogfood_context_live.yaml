schema_version: "1.0.0"
id: "dogfood-context-live"
title: "Dogfood Context — Stock/Cycle × Native Tool Matrix (provider-live)"
pack: "provider_live"
tags: ["provider-live", "dogfood-context", "subsystem:dogfood-context", "entity:phase-176"]
request_fixture: "fixtures/requests/provider_live/session_delegate_code_change.md"
mode_support: ["auto"]
portals:
  - alias: "test-portal"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/test-portal"
    git_init: true

# Five cells required by exaix-dev-docs/planning/phase-176-dogfood-context-management-
# refinement.md Step 4 Action 5: two "stock" cells (CliDelegateStrategy, selected by an
# agent blueprint's own `strategy: cli_delegate` — Blueprints/Flows/dogfood-loop.flow.yaml)
# and three "cycle" cells (SessionDelegationCoordinator, selected by the [session_delegate]
# `code_changes` gate). `--cell <name>` matches literally against a cell's `tool` field, so
# these five values are exactly what `exactl eval run --cell <name>` expects.
matrix:
  cells:
    - tool: "stock-claude"
      provider: "direct"
      config: "configs/dogfood.claude.stock.toml"
      requires_bin: "claude"
      requires_key: "ANTHROPIC_API_KEY"
    - tool: "stock-opencode"
      provider: "direct"
      config: "configs/dogfood.opencode.stock.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
    - tool: "cycle-claude"
      provider: "direct"
      config: "configs/dogfood.claude.toml"
      requires_bin: "claude"
      requires_key: "ANTHROPIC_API_KEY"
    - tool: "cycle-opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
    - tool: "cycle-codex"
      provider: "direct"
      config: "configs/dogfood.codex.toml"
      requires_bin: "codex"
      requires_optin: "EXA_MATRIX_CODEX"

steps:
  # --- Setup (shared across all cells) ---
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # A running daemon does not hot-reload config (documented pattern — README §2.2).
  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Stock cells: dogfood-loop flow (implement via cli_delegate, then review) ---
  - id: "submit-request-stock"
    type: "exactl"
    cells: ["stock-claude", "stock-opencode"]
    command: "request"
    args: ["--file", "fixtures/requests/provider_live/dogfood_context_stock_code_change.md", "--portal", "test-project"]
    output_criteria:
      - id: "stock-request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan-stock"
    type: "wait-for-file"
    cells: ["stock-claude", "stock-opencode"]
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120

  - id: "approve-plan-stock"
    type: "exactl"
    cells: ["stock-claude", "stock-opencode"]
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "stock-plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  # The dogfood-loop flow's `implement` step delegates via CliDelegateStrategy; its
  # completion, and the subsequent quality-judge `review` step's completion, are both
  # journalled as flow.step.completed (packages/flow/src/flow_runner.ts:1780).
  - id: "wait-for-stock-review-complete"
    type: "journal-assert"
    cells: ["stock-claude", "stock-opencode"]
    action_type: "flow.step.completed"
    trace_scoped: true
    payload_equals:
      - path: "stepId"
        value: "review"
    output_criteria:
      - id: "stock-review-step-completed"
        kind: "command-exit-code"
        equals: 0
        score_weight: 1.0

  - id: "assert-stock-worktree-change"
    type: "file-contains"
    cells: ["stock-claude", "stock-opencode"]
    cwd: "$WORKTREE"
    file_pattern: "src/main.ts"
    timeout_sec: 300
    output_criteria:
      - id: "stock-worktree-farewell-written"
        kind: "text-contains"
        contains: "export const FAREWELL ="

  # --- Cycle cells: plain request reaching the code_changes gate (session_delegate) ---
  - id: "submit-request-cycle"
    type: "exactl"
    cells: ["cycle-claude", "cycle-opencode", "cycle-codex"]
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "cycle-request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan-cycle"
    type: "wait-for-file"
    cells: ["cycle-claude", "cycle-opencode", "cycle-codex"]
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120

  - id: "approve-plan-cycle"
    type: "exactl"
    cells: ["cycle-claude", "cycle-opencode", "cycle-codex"]
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "cycle-plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    cells: ["cycle-claude", "cycle-opencode", "cycle-codex"]
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # Not trace_scoped: session.delegate.* rows are journalled under the CHILD delegate's
  # own trace_id, never the parent request trace `trace_scoped` resolves to (confirmed by
  # a real live run, 2026-09-09) — trace_scoped here always yields zero rows. A single
  # `--cell` invocation runs exactly one delegate per sandbox, so global presence is
  # unambiguous; matches the proven session_delegate_matrix_live.yaml's own shared (non
  # per-tool) `assert-reconciled-clean` step, not its `trace_scoped` codex-only steps.
  - id: "assert-cycle-reconciled-clean"
    type: "journal-assert"
    cells: ["cycle-claude", "cycle-opencode", "cycle-codex"]
    action_type: "session.delegate.reconciled"
    payload_not_contains: ["rejected"]
    output_criteria:
      - id: "cycle-reconciled-event-accepted"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "assert-cycle-worktree-change"
    type: "file-contains"
    cells: ["cycle-claude", "cycle-opencode", "cycle-codex"]
    cwd: "$WORKTREE"
    file_pattern: "src/main.ts"
    timeout_sec: 300
    output_criteria:
      - id: "cycle-worktree-greeting-written"
        kind: "text-contains"
        contains: "export const GREETING ="

  # --- Inspector comparison (shared): exactl request inspect over the produced trace ---
  # A single cell run always has exactly one governing trace at this point — the trace this
  # scenario's own request produced — so a single inspect covers whichever cell just ran.
  - id: "inspect-produced-trace"
    type: "run-script"
    name: "exactl request inspect reports the real captured dogfood-context submission"
    command: "deno"
    args:
      - "eval"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - |
          const planFiles = [...Deno.readDirSync("Workspace/Plans")]
            .filter((e) => e.isFile && e.name.endsWith("_plan.md"))
            .map((e) => `Workspace/Plans/${e.name}`);
          if (planFiles.length === 0) {
            console.error("FAILED: no plan file found");
            Deno.exit(1);
          }
          const planText = Deno.readTextFileSync(planFiles[0]);
          const match = planText.match(/trace_id:\s*"?([0-9a-fA-F-]{36})"?/);
          if (!match) {
            console.error(`FAILED: no trace_id found in ${planFiles[0]}`);
            Deno.exit(1);
          }
          const traceId = match[1];

          const cmd = new Deno.Command(Deno.execPath(), {
            args: ["run", "-A", "$FRAMEWORK_HOME/../../apps/exactl/src/exactl.ts", "request", "inspect", traceId, "--json"],
            stdout: "piped",
            stderr: "piped",
          });
          const { code, stdout, stderr } = await cmd.output();
          if (code !== 0) {
            console.error(`FAILED: expected exit 0 (a real capture), got ${code}. stderr: ${new TextDecoder().decode(stderr)}`);
            Deno.exit(1);
          }
          const parsed = JSON.parse(new TextDecoder().decode(stdout));
          const record = Array.isArray(parsed) ? parsed[0] : parsed;
          if (!record.recordId || typeof record.promptText !== "string" || !Array.isArray(record.tools)) {
            console.error(`FAILED: unexpected inspect shape: ${JSON.stringify(record)}`);
            Deno.exit(1);
          }
          console.log(`PASSED: exactl request inspect ${traceId} reported a real capture (${record.recordId})`);
    output_criteria:
      - id: "inspect-reported-real-capture"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["PASSED: exactl request inspect"]
      - id: "inspect-script-exit-code"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # --- Teardown ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
