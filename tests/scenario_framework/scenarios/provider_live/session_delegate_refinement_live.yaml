schema_version: "1.0.0"
id: "session-delegate-refinement-live"
title: "Session Delegation — Refinement Gate (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation"]
request_fixture: "fixtures/requests/agent_flows/quality_gate_clarification.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args: ["run", "-A", "--config", "$FRAMEWORK_HOME/../../deno.json", "$FRAMEWORK_HOME/../../scripts/setup_db.ts"]
    output_criteria:
      - id: "setup-done"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_TOOL: "claude-code"
      EXA_SESSION_DELEGATE_LAUNCH_MODE: "headless"
      ANTHROPIC_API_KEY: "__KEY_REQUIRED__"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-underspecified-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-clarification"
    type: "wait-for-file"
    args: ["**/Clarifications/*.json"]
    timeout_sec: 300

  - id: "verify-clarification"
    type: "exactl"
    command: "request"
    args: ["show", "--all"]
    output_criteria:
      - id: "clarification-enriched"
        score_weight: 1.0
        kind: "command-output-contains"
        contains: ["user-confirmed"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
