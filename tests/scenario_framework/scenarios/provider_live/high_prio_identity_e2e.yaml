schema_version: "1.0.0"
id: "high-prio-identity-e2e"
title: "High-Priority Identity E2E — each identity's persona demonstrably shapes the real LLM response"
pack: "provider_live"
tags: ["provider-live", "identity-catalog", "safety-gate"]
request_fixture: "fixtures/requests/provider_live/senior_coder.md"
mode_support: ["auto"]
portals: []

steps:
  # --- Setup ---
  - id: "start-daemon"
    type: "exactl"
    command: "daemon start"
    env:
      EXA_CONFIG_PATH: "$FRAMEWORK_HOME/../../configs/dogfood.claude.toml"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Submit all 7 high-prio identities ---
  - id: "submit-senior-coder"
    type: "exactl"
    command: "request"
    args: ["--file", "$FRAMEWORK_HOME/fixtures/requests/provider_live/senior_coder.md", "--identity", "senior-coder"]
    output_criteria:
      - id: "senior-coder-submitted"
        kind: "command-exit-code"
        equals: 0
  - id: "submit-software-architect"
    type: "exactl"
    command: "request"
    args: [
      "--file",
      "$FRAMEWORK_HOME/fixtures/requests/provider_live/software_architect.md",
      "--identity",
      "software-architect",
    ]
    output_criteria:
      - id: "software-architect-submitted"
        kind: "command-exit-code"
        equals: 0
  - id: "submit-quality-judge"
    type: "exactl"
    command: "request"
    args: ["--file", "$FRAMEWORK_HOME/fixtures/requests/provider_live/quality_judge.md", "--identity", "quality-judge"]
    output_criteria:
      - id: "quality-judge-submitted"
        kind: "command-exit-code"
        equals: 0
  - id: "submit-security-expert"
    type: "exactl"
    command: "request"
    args: [
      "--file",
      "$FRAMEWORK_HOME/fixtures/requests/provider_live/security_expert.md",
      "--identity",
      "security-expert",
    ]
    output_criteria:
      - id: "security-expert-submitted"
        kind: "command-exit-code"
        equals: 0
  - id: "submit-dogfood-developer"
    type: "exactl"
    command: "request"
    args: [
      "--file",
      "$FRAMEWORK_HOME/fixtures/requests/provider_live/dogfood_coder.md",
      "--identity",
      "dogfood-developer",
    ]
    output_criteria:
      - id: "dogfood-developer-submitted"
        kind: "command-exit-code"
        equals: 0
  - id: "submit-voting-judge"
    type: "exactl"
    command: "request"
    args: ["--file", "$FRAMEWORK_HOME/fixtures/requests/provider_live/voting_judge.md", "--identity", "voting-judge"]
    output_criteria:
      - id: "voting-judge-submitted"
        kind: "command-exit-code"
        equals: 0
  - id: "submit-default"
    type: "exactl"
    command: "request"
    args: ["--file", "$FRAMEWORK_HOME/fixtures/requests/provider_live/default.md", "--identity", "default"]
    output_criteria:
      - id: "default-submitted"
        kind: "command-exit-code"
        equals: 0

  # --- Wait for all 7 identities to PRODUCE AN OUTPUT (accepted plan or rejected
  #     draft) ---
  # The test's purpose is to prove each persona shaped the real LLM response, NOT
  # that a small model emitted strict executable-plan JSON. Both an accepted plan
  # (Workspace/Plans) and a rejected draft (Workspace/Rejected) capture the full
  # model output and its identity_id, so either counts as "the identity ran and
  # responded". We wait for 7 such outputs.
  - id: "wait-for-all-outputs"
    type: "file-contains"
    args: ["Workspace/Plans/*_plan.md", "Workspace/Rejected/*_rejected.md"]
    min_matches: 7
    timeout_sec: 300
    output_criteria:
      - id: "outputs-created"
        kind: "command-exit-code"
        equals: 0

  # --- Assert each identity actually SHAPED the LLM output ---
  # The point of this e2e is not that a plan file appears (routing stamps
  # identity_id regardless) — it is that the *concrete persona reached the model
  # and changed how it responded*. We therefore assert, per identity, that the
  # generated plan BODY contains an identity-distinctive signal: a generic
  # role-declaration ("I am operating as…", instructed by the fixtures) PLUS a
  # role-specific keyword that only that persona would produce. A judge that
  # refuses to generate, a security expert that talks vulnerabilities/OWASP, an
  # architect that talks scalability — these only appear if the persona was
  # injected and honored.
  - id: "assert-identity-reflection"
    type: "shell"
    command: "sh"
    args:
      - "-c"
      - |
          failures=0
          # Identity output lives in EITHER Plans (accepted) or Rejected (draft) —
          # both capture the full model response and its identity_id.
          out_dirs="$WORKSPACE_ROOT/Workspace/Plans $WORKSPACE_ROOT/Workspace/Rejected"
          find_output() {
            grep -rl "identity_id: $1" $out_dirs 2>/dev/null | head -1
          }
          # id|case-insensitive ERE of role-distinctive signals (>=1 must match the body)
          specs="senior-coder:software engineer|maintainable|implementation
          software-architect:architect|scalab|system design|architecture
          quality-judge:quality (judge|assess)|evaluat|do not generate|rubric
          security-expert:security|vulnerab|owasp|threat|remediation
          dogfood-developer:dogfood|tdd|red.*green|ci gate
          voting-judge:voting|consensus|rank|select the best|do not generate
          default:coding assistant|implementation plan|implement"
          printf '%s\n' "$specs" | while IFS=: read -r id signal; do
            [ -z "$id" ] && continue
            id=$(echo "$id" | sed 's/^ *//')
            out=$(find_output "$id")
            if [ -z "$out" ]; then
              echo "FAIL: no output (plan or rejected) routed to $id"
              echo fail >> "$WORKSPACE_ROOT/.reflection_failures"
              continue
            fi
            # The role-distinctive signal in the model's OWN words is the proof that
            # THIS persona shaped the response: a security expert talks
            # vulnerabilities/OWASP, a judge talks evaluation/consensus, an architect
            # talks scalability/system design. A wrong (or no) persona would not
            # produce its role-specific vocabulary. (We assert on the model's words,
            # not the daemon-stamped identity_id, which only proves routing.)
            if grep -qiE "$signal" "$out"; then
              echo "OK: $id persona shaped the response (matched: $signal) in $(basename "$out")"
            else
              echo "FAIL: $id output lacks any role-distinctive signal ($signal) — persona did not shape it"
              echo fail >> "$WORKSPACE_ROOT/.reflection_failures"
            fi
          done
          if [ -f "$WORKSPACE_ROOT/.reflection_failures" ]; then
            failures=$(wc -l < "$WORKSPACE_ROOT/.reflection_failures")
            rm -f "$WORKSPACE_ROOT/.reflection_failures"
          fi
          echo "reflection failures: $failures"
          [ "$failures" -eq 0 ]
    output_criteria:
      - id: "all-identities-reflected"
        kind: "command-exit-code"
        equals: 0

  # --- Stop daemon ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon stop"
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
