schema_version: "1.0.0"
id: "session-delegate-matrix-live"
title: "Session Delegation — Tool × Provider Matrix (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation", "safety-gate"]
request_fixture: "fixtures/requests/agent_flows/request_analysis_smoke.md"
mode_support: ["auto"]
portals: []

matrix:
  axes:
    tool: ["opencode", "claude-code"]
    provider: ["direct", "openrouter"]
  cells:
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
    - tool: "opencode"
      provider: "openrouter"
      config: "configs/dogfood.openrouter.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
      requires_key: "OPENROUTER_API_KEY"
    - tool: "claude-code"
      provider: "direct"
      config: "configs/dogfood.claude.toml"
      requires_bin: "claude"
      requires_key: "ANTHROPIC_API_KEY"
    - tool: "claude-code"
      provider: "openrouter"
      config: "configs/dogfood.claude.openrouter.toml"
      requires_bin: "claude"
      requires_key: "OPENROUTER_API_KEY"

steps:
  # --- Setup (shared across all cells) ---
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args:
      [
        "run",
        "-A",
        "--config",
        "$FRAMEWORK_HOME/../../deno.json",
        "$FRAMEWORK_HOME/../../scripts/setup_db.ts",
      ]
    output_criteria:
      - id: "setup-done"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # start-daemon: per-cell env overlay applied by matrix_expander.ts:
  #   EXA_CONFIG_PATH ← cell config (provider selector — GAP-2)
  #   EXA_SESSION_DELEGATE_TOOL ← cell tool
  #   EXA_SESSION_DELEGATE_ENABLED=true
  # Never sets EXA_SESSION_DELEGATE_PROVIDER — that env var does not exist.
  # The base env below sets the gate and launch mode common to all cells.
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_SESSION_DELEGATE_GATES: "code_changes"
      EXA_SESSION_DELEGATE_LAUNCH_MODE: "headless"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  # --- Delegate request cycle ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  # Wait for the delegate to drop its return.json — the signal that
  # SessionReturnProcessor has parsed the delegate output and reconciliation
  # (reconcile.ts:78) has run, journalling the outcome.
  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # --- Assertion: the delegate reconciled cleanly ---
  # session.delegate.reconciled must be PRESENT (the delegate returned a
  # parseable result and the scope check passed). The scope_violation event
  # is asserted by the negative scenario (session_delegate_scope_violation_live.yaml);
  # the matrix does not re-assert it here.
  - id: "assert-reconciled-clean"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "reconciled-event-present"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"

  # --- Teardown ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
