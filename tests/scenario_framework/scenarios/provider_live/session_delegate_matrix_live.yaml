schema_version: "1.0.0"
id: "session-delegate-matrix-live"
title: "Session Delegation — Tool × Provider Matrix (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation", "safety-gate"]
request_fixture: "fixtures/requests/provider_live/session_delegate_code_change.md"
mode_support: ["auto"]
portals: []

matrix:
  axes:
    tool: ["opencode", "claude-code"]
    provider: ["direct", "openrouter"]
  cells:
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
    - tool: "opencode"
      provider: "openrouter"
      config: "configs/dogfood.openrouter.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
      requires_key: "OPENROUTER_API_KEY"
    - tool: "claude-code"
      provider: "direct"
      config: "configs/dogfood.claude.toml"
      requires_bin: "claude"
      requires_key: "ANTHROPIC_API_KEY"
    - tool: "claude-code"
      provider: "openrouter"
      config: "configs/dogfood.claude.openrouter.toml"
      requires_bin: "claude"
      requires_key: "OPENROUTER_API_KEY"

steps:
  # --- Setup (shared across all cells) ---
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args:
      [
        "run",
        "-A",
        "--config",
        "$FRAMEWORK_HOME/../../deno.json",
        "$FRAMEWORK_HOME/../../scripts/setup_db.ts",
      ]
    # The DB lands in the workspace CWD (.exa/journal.db) so the daemon finds it; the
    # migrations *source* is the repo (a deployable workspace has no migrations/ dir).
    # EXA_MIGRATIONS_DIR points setup_db.ts at the repo migrations (Phase 127 harness fix).
    env:
      EXA_MIGRATIONS_DIR: "$FRAMEWORK_HOME/../../migrations"
    output_criteria:
      - id: "setup-done"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # setup-blueprints: the daemon resolves agent identities from <workspace>/Blueprints/Identities/,
  # which deploy_workspace.ts provisions for a deployed sandbox but the synthetic runner's bare
  # workspace lacks — so analysis fails with "Blueprint not found: default". Copy the repo's
  # Blueprints/ into the workspace (mirrors deploy_workspace) so the identity the request routes to
  # exists. The shell step's cwd is the workspace.
  - id: "setup-blueprints"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Blueprints", "$WORKSPACE_ROOT/Blueprints"]
    output_criteria:
      - id: "blueprints-copied"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # setup-portal-repo: the code_changes delegate gate creates a git WORKTREE from the portal for the
  # delegate's isolated edits — so the portal MUST be a git repo. The simple_repo fixture is not one;
  # copy it into the workspace and git-init+commit it, then mount THAT (next step) as the portal.
  # Leaves the read-only fixture untouched; mirrors how setup-blueprints/setup-db provision prereqs.
  - id: "setup-portal-repo"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cp -r \"$FRAMEWORK_HOME/fixtures/portals/simple_repo\" \"$WORKSPACE_ROOT/test-portal\" && cd \"$WORKSPACE_ROOT/test-portal\" && git init -q && git add -A && git -c user.email=delegate@exaix.dev -c user.name=delegate commit -q -m 'init test portal'",
      ]
    output_criteria:
      - id: "portal-repo-initialized"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # start-daemon: the matrix_expander overlay repoints EXA_CONFIG_PATH at the workspace's
  # materialized exa.config.toml (sentinels resolved: root → workspace, worktree → portal),
  # which carries the cell's [session_delegate.provider] realm + the complete [session_delegate]
  # block (enabled, tool=claude-code, gates=[code_changes], launch_mode=headless). The daemon
  # MUST start before the portal is added so portal add + the daemon share one live config file.
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  # add-portal: registers `test-project` (the git-init'd workspace copy from setup-portal-repo, so
  # the code_changes gate can create a worktree from it) into the SAME exa.config.toml the daemon
  # runs, and creates the Portals/ symlink.
  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # restart-daemon: a running daemon does not hot-reload config, so restart it to pick up the
  # newly-registered `test-project` portal (the documented portal-mount pattern — README §2.2:
  # `portal add` then `daemon stop && daemon start`). Without this the daemon's config never
  # learns the portal and the request submitted below stalls unprocessed.
  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  # wait-for-daemon-ready: `daemon restart`/`start` return when the process is ALIVE (the CLI's
  # daemon.started), NOT when the daemon's watchers are listening. Submitting the request in that gap
  # races — and loses to — the not-yet-started Requests watch. Block on `daemon.ready`, which the
  # daemon PROCESS emits only after every watcher is confirmed listening (distinct from the CLI's
  # daemon.started — no same-named-event ambiguity).
  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Delegate request cycle ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  # The daemon analyses the request and writes a plan in `review` status. The delegate fires only
  # AFTER the plan is approved and execution reaches the code_changes gate — so wait for the plan,
  # then approve it (mirrors agent_flows/session_delegate_code_changes.yaml).
  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  # Wait for the delegate to drop its return.json — the signal that
  # SessionReturnProcessor has parsed the delegate output and reconciliation
  # (reconcile.ts:78) has run, journalling the outcome.
  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # --- Assertion: the delegate reconciled cleanly AND was ACCEPTED ---
  # session.delegate.reconciled must be PRESENT *with an accepted payload*. The watcher
  # journals this same event on BOTH the accepted path ({decision}) and a non-scope
  # rejection ({rejected:true}); `payload_absent: {rejected: true}` requires a matching
  # event that is NOT a rejection, so the delegate genuinely returned a parseable result
  # and reconciliation accepted (the scope check passed — reconciled is only emitted on the
  # accepted branch when accepted, and the rejected branch sets rejected:true).
  # The scope_violation event is asserted by the negative scenario
  # (session_delegate_scope_violation_live.yaml); the matrix does not re-assert it here.
  - id: "assert-reconciled-clean"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "reconciled-event-accepted"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"
        payload_absent:
          rejected: true

  # --- Teardown ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
