schema_version: "1.0.0"
id: "session-delegate-matrix-live"
title: "Session Delegation — Tool × Provider Matrix (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation", "safety-gate"]
request_fixture: "fixtures/requests/provider_live/session_delegate_code_change.md"
mode_support: ["auto"]
portals:
  - alias: "test-portal"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/test-portal"
    git_init: true

matrix:
  cells:
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
    - tool: "opencode"
      provider: "openrouter"
      config: "configs/dogfood.openrouter.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
      requires_key: "OPENROUTER_API_KEY"
    - tool: "claude-code"
      provider: "direct"
      config: "configs/dogfood.claude.toml"
      requires_bin: "claude"
      requires_key: "ANTHROPIC_API_KEY"
    - tool: "claude-code"
      provider: "openrouter"
      config: "configs/dogfood.claude.openrouter.toml"
      requires_bin: "claude"
      requires_key: "OPENROUTER_API_KEY"
    - tool: "codex"
      provider: "direct"
      config: "configs/dogfood.codex.toml"
      requires_bin: "codex"
      requires_optin: "EXA_MATRIX_CODEX"

steps:
  # --- Setup (shared across all cells) ---
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  # add-portal: registers `test-project` (the git-init'd workspace copy from setup-portal-repo, so
  # the code_changes gate can create a worktree from it) into the SAME exa.config.toml the daemon
  # runs, and creates the Portals/ symlink.
  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  # restart-daemon: a running daemon does not hot-reload config, so restart it to pick up the newly registered `test-project` portal (`portal add`, then `daemon stop && daemon start`).
  # Without it the daemon never learns the portal and the request submitted below stalls unprocessed.
  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  # wait-for-daemon-ready: `daemon restart` and `start` return when the process is alive, not when its watchers are listening, so submitting the request in that gap loses the race to the Requests watch.
  # Block on `daemon.ready`, which the daemon process emits only after every watcher is confirmed listening. It is distinct from the CLI's daemon.started.
  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Delegate request cycle ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  # The daemon analyses the request and writes a plan in `review` status. The delegate fires only
  # AFTER the plan is approved and execution reaches the code_changes gate — so wait for the plan,
  # then approve it (mirrors agent_flows/session_delegate_code_changes.yaml).
  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  # Wait for the delegate to drop its return.json — the signal that
  # SessionReturnProcessor has parsed the delegate output and reconciliation
  # (reconcile.ts:78) has run, journalling the outcome.
  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # --- Codex-only: trace-scoped audit-chain proof ---
  # The shared assert-reconciled-clean check below uses the journal-event-exists criterion, which has no trace_scoped support. These four steps assert the same four-event session.delegate.* audit chain scoped to this run's request trace,
  # so a leftover row from an earlier scenario in a shared sandbox can never satisfy them.
  - id: "assert-codex-briefed"
    type: "journal-assert"
    cells: ["codex"]
    action_type: "session.delegate.briefed"
    trace_scoped: true
    output_criteria:
      - id: "codex-briefed-recorded"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.25

  - id: "assert-codex-launched"
    type: "journal-assert"
    cells: ["codex"]
    action_type: "session.delegate.launched"
    trace_scoped: true
    payload_equals:
      - path: "tool"
        value: "codex"
    output_criteria:
      - id: "codex-launched-recorded"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.25

  - id: "assert-codex-returned"
    type: "journal-assert"
    cells: ["codex"]
    action_type: "session.delegate.returned"
    trace_scoped: true
    payload_equals:
      - path: "accepted"
        value: true
    output_criteria:
      - id: "codex-returned-accepted"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.25

  - id: "assert-codex-reconciled"
    type: "journal-assert"
    cells: ["codex"]
    action_type: "session.delegate.reconciled"
    trace_scoped: true
    payload_not_contains: ["rejected"]
    output_criteria:
      - id: "codex-reconciled-accepted"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.25

  # --- Assertion: the delegate reconciled cleanly and was accepted ---
  # The watcher journals session.delegate.reconciled on both the accepted path ({decision}) and a non-scope rejection ({rejected:true}), so `payload_absent: {rejected: true}` requires a matching event that is not a rejection.
  # The negative scenario session_delegate_scope_violation_live.yaml asserts scope_violation, so the matrix does not re-assert it.
  - id: "assert-reconciled-clean"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "reconciled-event-accepted"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"
        payload_absent:
          rejected: true

  # The journal chain above cannot show the edit landed: a delegate that returned changes_made
  # with zero edits used to pass. This step polls the newest execution worktree for the
  # fixture's `export const GREETING` in src/main.ts.
  - id: "assert-worktree-change"
    type: "file-contains"
    cwd: "$WORKTREE"
    file_pattern: "src/main.ts"
    timeout_sec: 300
    output_criteria:
      - id: "worktree-greeting-written"
        kind: "text-contains"
        contains: "export const GREETING ="

  # --- Teardown ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
