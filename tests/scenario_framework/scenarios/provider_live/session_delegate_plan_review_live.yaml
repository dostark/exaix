schema_version: "1.0.0"
id: "session-delegate-plan-review-live"
title: "Session Delegation — Plan Review Gate (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation", "manual-only"]
request_fixture: "fixtures/requests/agent_flows/request_analysis_smoke.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_TOOL: "opencode"
      EXA_SESSION_DELEGATE_GATES: "plan_review"
      EXA_SESSION_DELEGATE_LAUNCH_MODE: "headless"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-amendment"
    type: "wait-for-file"
    args: ["**/Amendments/*.json"]
    timeout_sec: 120

  - id: "verify-amendment-decision"
    type: "exactl"
    command: "plan"
    args: ["amendment", "list"]
    output_criteria:
      - id: "decision-present"
        score_weight: 1.0
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
