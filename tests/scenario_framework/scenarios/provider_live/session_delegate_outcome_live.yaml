schema_version: "1.0.0"
id: "session-delegate-outcome-live"
title: "Session Delegation — Outcome Assertion (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation", "outcome-assertion"]
request_fixture: "fixtures/requests/provider_live/session_delegate_code_change.md"
mode_support: ["auto"]
portals: []

matrix:
  axes:
    tool: ["opencode"]
    provider: ["direct"]
  cells:
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"

steps:
  # --- Setup ---
  - id: "setup-blueprints"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Blueprints", "$WORKSPACE_ROOT/Blueprints"]
    output_criteria:
      - id: "blueprints-copied"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "setup-portal-repo"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cp -r \"$FRAMEWORK_HOME/fixtures/portals/simple_repo\" \"$WORKSPACE_ROOT/test-portal\" && cd \"$WORKSPACE_ROOT/test-portal\" && git init -q && git add -A && git -c user.email=delegate@exaix.dev -c user.name=delegate commit -q -m 'init test portal'",
      ]
    output_criteria:
      - id: "portal-repo-initialized"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Delegate request cycle ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-delegate-return"
    type: "wait-for-file"
    args: ["**/Session/**/return.json"]
    timeout_sec: 300

  # --- Outcome assertions ---
  # The delegate must have reconciled cleanly (not rejected)
  - id: "assert-reconciled-clean"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "reconciled-event-accepted"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"
        payload_absent:
          rejected: true

  # The intended file change must be present in the portal worktree.
  # A no-op delegation (paths_touched: []) fails here because the file
  # would not contain the expected constant.
  - id: "assert-greeting-added"
    type: "file-contains"
    args: ["$WORKSPACE_ROOT/test-portal/src/main.ts"]
    input_criteria: []
    output_criteria:
      - id: "greeting-constant-present"
        score_weight: 1.0
        kind: "text-contains"
        path: "$WORKSPACE_ROOT/test-portal/src/main.ts"
        contains: "GREETING"
      - id: "greeting-value-present"
        score_weight: 1.0
        kind: "text-contains"
        path: "$WORKSPACE_ROOT/test-portal/src/main.ts"
        contains: "hello from delegate"

  # --- Teardown ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
