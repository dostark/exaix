schema_version: "1.0.0"
id: "session-delegate-outcome-live"
title: "Session Delegation — Outcome Assertion (provider-live)"
pack: "provider_live"
tags: ["provider-live", "session-delegation", "outcome-assertion"]
request_fixture: "fixtures/requests/provider_live/session_delegate_code_change.md"
mode_support: ["auto"]
portals:
  - alias: "test-portal"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/test-portal"
    git_init: true

matrix:
  cells:
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_optin: "EXA_MATRIX_OPENCODE"
    # claude-code on Sonnet 5. Deliberately not gated on ANTHROPIC_API_KEY: this cell runs with that variable unset, so the headless `claude` child authenticates with the subscription OAuth credential.
    # The daemon's own analysis provider is Google in this preset, so it needs no Anthropic key either.
    - tool: "claude-code"
      provider: "direct"
      config: "configs/dogfood.claude.sonnet5.toml"
      requires_bin: "claude"
      requires_optin: "EXA_MATRIX_CLAUDE_SONNET5"

steps:
  # --- Setup ---
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/test-portal", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # --- Delegate request cycle ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  # Wait for the intended change, not for "a return.json". The planner decides the step count, and a read-only first step produces a return.json of its own, so waiting on the first return raced the delegate.
  # Polling for the outcome is plan-shape independent, and it cannot mask a genuine no-op: if the delegate never writes GREETING the loop exhausts and the step fails.
  - id: "wait-for-intended-change"
    type: "file-contains"
    cwd: "$WORKTREE"
    file_pattern: "src/main.ts"
    timeout_sec: 300
    output_criteria:
      - id: "intended-change-observed"
        kind: "text-contains"
        contains: "GREETING"

  # The file appears as soon as the delegate writes it, but the return.json is parsed and reconciled afterwards. Asserting the journal straight after the write raced reconciliation,
  # and teardown stopped the daemon before it finished. Block until reconciliation is journalled.
  - id: "wait-for-reconcile"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "session.delegate.reconciled", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  # --- Outcome assertions ---
  # Brief preparation must have happened with a real objective. The CI variant (tests/integration/meta_workflow_queue_pipeline_test.ts) stops before this point, because it cannot boot a daemon token-free, so this scenario owns the `briefed` proof.
  - id: "assert-brief-prepared"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "briefed-event-present"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.briefed"

  # The delegate must have reconciled cleanly (not rejected)
  - id: "assert-reconciled-clean"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "reconciled-event-accepted"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"
        payload_absent:
          rejected: true

  # The intended file change must be present in the delegate's git worktree, not the portal checkout. The execution loop creates an isolated worktree under .exa/worktrees/<portal>/<traceId>/, and reconcile.ts only validates a return, so the portal's own tree is unchanged by design.
  # A shell step rather than file-contains, because the worktree directory is named for the trace id and criterion `path` values are literal, so the shell must resolve the wildcard.
  # A no-op delegation (paths_touched: []) fails here: the file would still read `console.log("hello")` with no GREETING constant.
  - id: "assert-greeting-added"
    type: "file-contains"
    cwd: "$WORKTREE"
    file_pattern: "src/main.ts"
    input_criteria: []
    output_criteria:
      - id: "greeting-constant-present"
        score_weight: 1.0
        kind: "text-contains"
        contains: "GREETING"
      - id: "greeting-value-present"
        score_weight: 1.0
        kind: "text-contains"
        contains: "hello from delegate"

  # --- Teardown ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
