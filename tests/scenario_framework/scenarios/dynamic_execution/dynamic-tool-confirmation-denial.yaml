schema_version: "1.0.0"
id: "dynamic-tool-confirmation-denial"
title: "Queued tool confirmation can be listed and denied"
pack: "dynamic_execution"
edition: "team"
tags: ["dynamic", "tool-confirmation", "denial", "security", "subsystem:mcp-client", "entity:exaix_request_create"]
request_fixture: "fixtures/requests/dynamic_execution/tool_confirmation_denial.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "seed-confirmation"
    type: "run-script"
    name: "Seed pending tool confirmation"
    command: "deno"
    args:
      [
        "run",
        "-A",
        "--config",
        "$REPO_ROOT/deno.json",
        "$FRAMEWORK_HOME/scripts/seed_tool_confirmation.ts",
        "123e4567-e89b-42d3-a456-426614174000",
      ]
    output_criteria:
      - id: "confirmation-seeded"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["seeded", "123e4567-e89b-42d3-a456-426614174000", "exaix_request_create"]

  - id: "list-pending"
    type: "exactl"
    name: "List pending tool confirmations"
    command: "approval"
    args: ["list"]
    output_criteria:
      - id: "pending-entry-visible"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["tool:123e4567-e89b-42d3-a456-426614174000", "exaix_request_create", "dynamic-create-request"]

  - id: "deny-confirmation"
    type: "exactl"
    name: "Deny pending tool confirmation"
    command: "approval"
    args: ["reject", "tool:123e4567-e89b-42d3-a456-426614174000", "--reason", "Denied by scenario framework"]
    output_criteria:
      - id: "denial-confirmed"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["Tool confirmation denied", "123e4567-e89b-42d3-a456-426614174000"]

  - id: "verify-empty-pending"
    type: "exactl"
    name: "Verify there are no remaining pending tool confirmations"
    command: "approval"
    args: ["list"]
    output_criteria:
      - id: "no-pending-left"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["No pending approvals."]

  - id: "assert-decision-journaled"
    type: "journal-assert"
    name: "The denial is journaled once with its reason"
    action_type: "tool_confirmation.decided"
    expect_count: 1
    payload_equals:
      - path: "confirmation_id"
        value: "123e4567-e89b-42d3-a456-426614174000"
      - path: "approved"
        value: false
      - path: "reason"
        value: "Denied by scenario framework"
    output_criteria:
      - id: "decision-event-present"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0
