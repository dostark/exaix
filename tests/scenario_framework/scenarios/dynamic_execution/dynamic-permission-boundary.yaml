schema_version: "1.0.0"
id: "dynamic-permission-boundary"
title: "Dynamic steps accept approval-required domain tools at validation time"
pack: "dynamic_execution"
tags: ["security", "dynamic", "validation", "tool-confirmation", "subsystem:mcp-client", "entity:exaix_create_request"]
request_fixture: "fixtures/requests/dynamic_execution/approval_required_tool.md"
mode_support: ["auto"]
portals: []
flow_fixture: "fixtures/flows/dynamic_execution/approval_required.flow.yaml"
steps:
  - id: "stage-flow"
    type: "shell"
    name: "Stage approval-required flow fixture into workspace"
    command: "mkdir"
    args: ["-p", "$WORKSPACE_ROOT/Blueprints/Flows"]
    output_criteria:
      - id: "flows-dir-created"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "copy-flow"
    type: "shell"
    name: "Copy approval-required flow fixture"
    command: "cp"
    args: ["$FLOW_FIXTURE", "$WORKSPACE_ROOT/Blueprints/Flows/approval-required.flow.yaml"]
    output_criteria:
      - id: "flow-copied"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "validate-flow"
    type: "exactl"
    name: "Validate flow with approval-required tool in dynamic mode"
    command: "flow"
    args: ["validate", "approval-required"]
    input_criteria:
      - id: "flow-file-exists"
        score_weight: 0.4
        kind: "file-found"
        path_pattern: "fixtures/flows/dynamic_execution/approval_required.flow.yaml"
    output_criteria:
      - id: "validation-succeeded"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0
      - id: "validation-ok-message"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["approval-required", "valid"]
