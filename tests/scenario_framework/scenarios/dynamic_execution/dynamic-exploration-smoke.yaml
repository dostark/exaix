schema_version: "1.0.0"
id: "dynamic-exploration-smoke"
title: "A dynamic-mode flow step executes end to end and is journalled"
pack: "dynamic_execution"
tags: ["smoke", "dynamic", "read-only", "subsystem:mcp-client"]
request_fixture: "fixtures/requests/dynamic_execution/explore_codebase.md"
mode_support: ["auto", "manual-checkpoint"]
# Mounted by the runner from the seeded fixture, which is a real git repository — portals are
# mutated only through worktrees, and a plain directory has nowhere isolated to put changes.
# Previously this pointed at /tmp/sample-ts-project, a bare `mkdir -p` outside the sandbox that
# leaked between runs and gave `file-found` the whole filesystem to walk.
portals:
  - alias: "sample-ts-project"
    source_path: "$WORKSPACE_ROOT/fixtures/portals/simple_repo"
flow_fixture: "fixtures/flows/dynamic_execution/explore.flow.yaml"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"

  - id: "verify-dynamic-step-ran"
    type: "journal-assert"
    name: "The dynamic step is journalled as started and completed"
    args: [
      "SELECT action_type, json_extract(payload,'$.stepId') AS step_id FROM activity WHERE action_type IN ('flow.step.started','flow.step.completed') AND json_extract(payload,'$.stepId') = 'explore' ORDER BY rowid",
    ]
    output_criteria:
      - id: "dynamic-step-started-and-completed"
        score_weight: 0.6
        kind: "json-query"
        query: "length"
        min: 2
      - id: "step-completion-journalled"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].action_type"
        contains: ["flow.step.completed"]

  - id: "verify-single-trace"
    type: "journal-assert"
    name: "The run is journalled under one trace"
    args: ["SELECT action_type, trace_id FROM activity WHERE trace_id = '$TRACE_ID' ORDER BY rowid"]
    output_criteria:
      - id: "events-under-trace"
        score_weight: 0.6
        kind: "json-query"
        query: "length"
        min: 1
      - id: "trace-id-present"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].trace_id"
        not_empty: true

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
