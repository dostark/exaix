schema_version: "1.0.0"
id: "dynamic-step-timeout"
title: "A flow carrying a dynamic step is accepted, executed and journalled"
pack: "dynamic_execution"
tags: ["timeout", "dynamic", "error-handling", "subsystem:mcp-client", "entity:read_file"]
request_fixture: "fixtures/requests/dynamic_execution/timeout_test.md"
mode_support: ["auto"]
portals: []
# Staged into the sandbox's Blueprints/Flows by the runner; the request fixture names it in its
# `flow:` frontmatter, which is the only way a flow executes. The scenario previously invoked
# `exactl flow run <flow> --request <file>` — a command that has never existed — so the step
# failed on Cliffy's usage dump rather than on anything to do with timeouts.
#
# The original expectation ("timeout" / "max iterations" in the output) is not assertable on the
# mock tier: a dynamic step makes no tool calls under the mock provider, so it never approaches
# its iteration ceiling and never times out. That claim belongs with the provider-live tier, for
# the same reason as the selection trajectories — see the Step 15 finding.
flow_fixture: "fixtures/flows/dynamic_execution/timeout.flow.yaml"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"

  - id: "verify-partial-logging"
    type: "shell"
    name: "The run is journalled under a single trace"
    command: "sh"
    args: [
      "-c",
      "trace_id=$(sqlite3 \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT trace_id FROM activity WHERE trace_id IS NOT NULL ORDER BY rowid DESC LIMIT 1\"); echo \"trace_id: $trace_id\" >&2; \"$FRAMEWORK_HOME/bin/exactl\" journal --filter \"trace_id=$trace_id\" --format json",
    ]
    output_criteria:
      - id: "some-events-logged"
        score_weight: 0.6
        kind: "json-query"
        query: "length"
        min: 1

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
