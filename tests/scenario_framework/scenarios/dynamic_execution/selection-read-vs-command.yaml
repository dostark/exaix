schema_version: "1.0.0"
id: "selection-read-vs-command"
title: "Tool selection — read_file preferred over run_command (cat)"
pack: "dynamic_execution"
tags: ["selection", "read-vs-command", "trajectory", "subsystem:mcp-client", "entity:read_file"]
request_fixture: "fixtures/requests/dynamic_execution/explore_codebase.md"
mode_support: ["auto"]
portals: []
steps:
  # The daemon migrates only the Config DB at boot; the journal schema is
  # scripts/setup_db.ts's job (see the scenario template's setup-db step). Without this,
  # `.exa/journal.db` has no `activity` table, every daemon activity write fails silently
  # into daemon.log, and no plan is ever produced — the request just sits in Requests/.
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args: ["run", "-A", "--config", "$FRAMEWORK_HOME/../../deno.json", "$FRAMEWORK_HOME/../../scripts/setup_db.ts"]
    env:
      EXA_MIGRATIONS_DIR: "$FRAMEWORK_HOME/../../migrations"
    output_criteria:
      - id: "setup-done"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  # `exactl daemon start` returns at daemon.started, ~700ms BEFORE the request watchers
  # are up. A request written into that gap already exists when the watcher starts, so the
  # watcher never fires on it and the request sits in Requests/ unprocessed forever. This
  # barrier is the established fix (see agent_flows/amendment_lifecycle.scenario.yaml).
  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.4

  - id: "assert-tool-selection"
    type: "trajectory-assert"
    name: "Verify read_file was selected over run_command"
    source_step: "submit-request"
    expected_sequence:
      - tool: "read_file"
    order_matters: false
    allow_extra_tools: true
    partial_credit: true
    input_criteria: []
    output_criteria: []

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
