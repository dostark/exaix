schema_version: "1.0.0"
id: "trajectory-tool-args-assert"
title: "Trajectory eval enforces args_contains and min/max args"
pack: "dynamic_execution"
tags: ["dynamic", "manual-only", "trajectory", "subsystem:mcp-client"]
request_fixture: "fixtures/requests/dynamic_execution/explore_codebase.md"
portals: []
mode_support: ["manual-checkpoint"]
# Phase 142 Step 15 — `exactl flow run <flow> --request <file>` was invoked here and has never
# existed: `flow` offers only list/show/validate, and a flow executes when a request naming it in
# its `flow:` frontmatter is submitted. The referenced `fixtures/requests/trajectory/example.md`
# does not exist either. Both replaced with the real path, which the scenario's own declared
# `request_fixture` already supports. Remains manual-only: the trajectory it asserts needs
# real tool calls, which the mock provider does not make.
# Phase 142 Step 7 — declares the flow its request fixture names, so the runner stages it.
# Without this the scenario only worked when another had already staged `explore-codebase`
# into the shared sandbox.
flow_fixture: "fixtures/flows/dynamic_execution/explore.flow.yaml"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    name: "Submit the request whose frontmatter names the flow"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: "plan-produced"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"

  - id: "assert-args-constraints"
    type: "trajectory-assert"
    name: "Verify tool args match expected constraints"
    source_step: "submit-request"
    expected_sequence:
      - tool: "search_code"
        args_contains: ["foo", "/src"]
        min_args: 3
        max_args: 3
      - tool: "read_file"
        args_contains: ["bar.py"]
        min_args: 1
        max_args: 2
    order_matters: true
    allow_extra_tools: false
    partial_credit: false
    input_criteria: []
    output_criteria: []

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
