schema_version: "1.0.0"
id: "trajectory-explore-assert"
title: "Trajectory eval checks tool order and tool arguments of a read-only exploration"
pack: "dynamic_execution"
# Replaces trajectory-tool-order-assert and trajectory-tool-args-assert, which expected tools Exaix
# does not have (edit_file, bash, search_code) and so could never pass. Provider-live: the mock
# provider makes no tool calls, so only a real model produces a trajectory to assert.
tags: ["dynamic", "trajectory", "subsystem:mcp-client", "entity:list_directory", "provider-live"]
request_fixture: "fixtures/requests/dynamic_execution/explore_codebase.md"
mode_support: ["auto"]
portals: []
flow_fixture: "fixtures/flows/dynamic_execution/explore.flow.yaml"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.4

  # An agent exploring an unknown project lists before it reads: it cannot name a file it has
  # not seen. Other read-only calls may interleave.
  - id: "assert-trajectory-order"
    type: "trajectory-assert"
    name: "list_directory runs before read_file"
    source_step: "submit-request"
    expected_sequence:
      - tool: "list_directory"
      - tool: "read_file"
    order_matters: true
    allow_extra_tools: true
    partial_credit: false
    input_criteria: []
    output_criteria: []

  - id: "assert-read-args"
    type: "trajectory-assert"
    name: "read_file is always called with a path argument"
    source_step: "submit-request"
    expected_sequence:
      - tool: "read_file"
        min_args: 1
    order_matters: false
    allow_extra_tools: true
    partial_credit: false
    input_criteria: []
    output_criteria: []

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
