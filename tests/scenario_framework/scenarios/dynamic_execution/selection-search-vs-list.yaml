schema_version: "1.0.0"
id: "selection-search-vs-list"
title: "Tool selection — search_files preferred over list_directory for finding files"
pack: "dynamic_execution"
edition: "team"
# Provider-live tier. Every step below the plan wait asserts a tool trajectory, and the mock provider makes no tool calls: dynamic_tool_call rows stay 0 under every configuration.
# So trajectory-assert reports matched 0/1 (score 0.00): the scorer works but has nothing to score. Which tool an agent picks is a real-model judgement, which a canned-response tier cannot serve.
tags: ["selection", "search-vs-list", "trajectory", "subsystem:mcp-client", "entity:search_files", "provider-live"]
request_fixture: "fixtures/requests/dynamic_execution/explore_codebase.md"
mode_support: ["auto"]
portals: []
# Declares the flow its request fixture names (`flow: "explore-codebase"` in `explore_codebase.md`). Without flow_fixture, the flow is staged only when `dynamic-exploration-smoke` runs first in the same sandbox.
# Run alone, as the nightly live tier does, it fails with "Flow 'explore-codebase' not found".
flow_fixture: "fixtures/flows/dynamic_execution/explore.flow.yaml"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.4

  - id: "assert-tool-selection"
    type: "trajectory-assert"
    name: "Verify search_files was selected over list_directory"
    source_step: "submit-request"
    expected_sequence:
      - tool: "search_files"
    order_matters: false
    allow_extra_tools: true
    partial_credit: true
    input_criteria: []
    output_criteria: []

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
