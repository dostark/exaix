schema_version: "1.0.0"
id: "dynamic-write-tool-boundary"
title: "Dynamic steps are refused write-only tools at validation time"
pack: "dynamic_execution"
edition: "team"
tags: ["security", "dynamic", "validation", "subsystem:mcp-client", "entity:write_file"]
request_fixture: "fixtures/requests/dynamic_execution/write_attempt.md"
mode_support: ["auto"]
portals: []
# Sibling of `dynamic-permission-boundary`. `validateDynamicStepTools` refuses a tool on two grounds: it is a WRITE tool, or it is APPROVAL-REQUIRED.
# The sibling's `exaix_create_request` is in both sets, so the approval branch catches it whatever the write branch does. This scenario grants `write_file`, which is write-only,
# so the write branch in `flow_loader.ts` is the only thing that can refuse it.
flow_fixture: "fixtures/flows/dynamic_execution/write_tool_dynamic.flow.yaml"
steps:
  - id: "validate-flow"
    type: "exactl"
    name: "A dynamic step granted a write-only tool must fail validation"
    command: "flow"
    args: ["validate", "write-tool-dynamic"]
    expect_failure: true
    output_criteria:
      - id: "validation-rejected"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 1
      - id: "names-the-write-tool-and-step"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["write_file", "write-attempt", "write tool"]
