schema_version: "1.0.0"
# Asserts the SSE transport boots and accepts a connection. A long-lived server run in the foreground can only be stopped by the timeout and report non-zero,
# so the probe script backgrounds the server, polls an ephemeral port, and always reaps the child.
id: "mcp-server-sse-liveness"
title: "MCP server — SSE transport boots and serves its endpoint"
pack: "mcp_server"
tags: ["sse", "liveness", "subsystem:mcp-server", "team"]
edition: "team"
request_fixture: "fixtures/requests/mcp_tools_extended/read_file.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "probe-sse-liveness"
    type: "run-script"
    name: "SSE server accepts a connection, then exits cleanly"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/probe_sse_liveness.ts"
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    timeout_sec: 90
    output_criteria:
      - id: "sse-alive"
        kind: "command-output-contains"
        contains: ["\"sse_alive\": true"]
        score_weight: 1.0
      - id: "probe-exited-zero"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5

  - id: "verify-no-leaked-server"
    type: "run-script"
    name: "No MCP server process survives the probe"
    # Native-Deno process check (scripts/check_process_alive.ts) enumerates /proc cmdlines —
    # no `pgrep`/`sh` spawn. Self-match is impossible because the helper's own argv is
    # `deno run ...`, not the MCP server path.
    command: "deno"
    args: ["run", "-A", "$REPO_ROOT/scripts/check_process_alive.ts", "apps/mcp-server/main.ts"]
    output_criteria:
      - id: "no-leak"
        kind: "command-output-contains"
        contains: ["no leaked server"]
        score_weight: 1.0
