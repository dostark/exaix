schema_version: "1.0.0"
id: "mcp-server-error-shape"
title: "MCP server — error shapes for malformed requests and unknown tools"
pack: "mcp_server"
tags: ["error", "malformed", "subsystem:mcp-server", "team"]
edition: "team"
request_fixture: "fixtures/requests/mcp_tools_extended/read_file.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "test-error-shapes"
    type: "shell"
    name: "Test error shapes via stdio driver"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "tests/scenario_framework/scripts/mcp_stdio_driver.ts"
      - "--timeout-ms"
      - "15000"
      - "--"
      - "deno"
      - "run"
      - "-A"
      - "apps/mcp-server/main.ts"
      - "--"
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","clientInfo":{"name":"test","version":"1.0"}}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"nonexistent_tool","arguments":{}}}'
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "error-returned"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5
      - id: "error-content"
        kind: "command-output-contains"
        contains: ["not found"]
        score_weight: 0.5
