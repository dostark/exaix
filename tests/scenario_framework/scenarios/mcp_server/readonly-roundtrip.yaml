schema_version: "1.0.0"
id: "mcp-server-readonly-roundtrip"
title: "MCP server — read-only tool round-trips over stdio"
pack: "mcp_server"
tags: ["readonly", "roundtrip", "subsystem:mcp-server", "team"]
edition: "team"
request_fixture: "fixtures/requests/mcp_tools_extended/read_file.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-fixture"
    type: "shell"
    name: "Create fixture file for read test"
    command: "sh"
    args: ["-c", "mkdir -p /tmp/exaix-mcp-test && echo 'mcp test content' > /tmp/exaix-mcp-test/sample.txt"]
    output_criteria:
      - id: "fixture-created"
        kind: "command-exit-code"
        equals: 0

  - id: "run-read-roundtrip"
    type: "shell"
    name: "Run MCP stdio driver for read-only tools"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "tests/scenario_framework/scripts/mcp_stdio_driver.ts"
      - "--timeout-ms"
      - "15000"
      - "--"
      - "deno"
      - "run"
      - "-A"
      - "apps/mcp-server/main.ts"
      - "--"
      - '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","clientInfo":{"name":"test","version":"1.0"}}}'
      - '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "roundtrip-succeeded"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5
      - id: "tools-list-returned"
        kind: "command-output-contains"
        contains: ["tools"]
        score_weight: 0.5

  - id: "cleanup"
    type: "shell"
    name: "Clean up fixture"
    command: "rm"
    args: ["-rf", "/tmp/exaix-mcp-test"]
    output_criteria:
      - id: "cleaned"
        kind: "command-exit-code"
        equals: 0
