schema_version: "1.0.0"
id: "bare-swe-add-feature-endpoint"
title: "Bare delegate baseline — Add a search feature endpoint"
pack: "swe_tasks"
tags: ["swe", "provider-live"]
request_fixture: "fixtures/requests/swe_tasks/add-feature-endpoint.md"
portals: []
mode_support: ["auto"]
matrix:
  cells:
    - tool: "claude-code"
      provider: "claude-cli"
      config: "configs/claude-cli-delegate-all.toml"
      requires_bin: "claude"
      harness: "bare"
    - tool: "claude-haiku-4-5"
      provider: "claude-cli"
      config: "configs/claude-haiku-4-5-delegate-all.toml"
      requires_bin: "claude"
      harness: "bare"
steps:
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args: ["run", "-A", "--config", "$FRAMEWORK_HOME/../../deno.json", "$FRAMEWORK_HOME/../../scripts/setup_db.ts"]
    env:
      EXA_MIGRATIONS_DIR: "$FRAMEWORK_HOME/../../migrations"
    output_criteria:
      - id: "setup-done"
        kind: "command-exit-code"
        equals: 0
  - id: "setup-portal-repo"
    type: "shell"
    command: "sh"
    args: [
      "-c",
      "cp -r \"$FRAMEWORK_HOME/fixtures/portals/todo_app\" \"$WORKSPACE_ROOT/todo-app\" && cd \"$WORKSPACE_ROOT/todo-app\" && git init -q && git add -A && git -c user.email=swe-tasks@exaix.dev -c user.name=swe-tasks commit -q -m 'init todo-app fixture'",
    ]
    output_criteria:
      - id: "portal-repo-initialized"
        kind: "command-exit-code"
        equals: 0
  - id: "setup-blueprints"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Blueprints", "$WORKSPACE_ROOT/Blueprints"]
    output_criteria:
      - id: "blueprints-copied"
        kind: "command-exit-code"
        equals: 0
  - id: "setup-memory"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Memory", "$WORKSPACE_ROOT/Memory"]
    output_criteria:
      - id: "memory-copied"
        kind: "command-exit-code"
        equals: 0
  - id: "stage-bare-opencode-config"
    type: "shell"
    command: "sh"
    args: [
      "-c",
      "printf '%s' '{\"agent\":{\"dogfood-developer\":{\"edit\":{\"*\":\"deny\",\"**\":\"allow\"},\"external_directory\":{\"**\":\"deny\"},\"bash\":{\"*\":\"deny\"}}}}' > \"$WORKSPACE_ROOT/todo-app/opencode.jsonc\"",
    ]
    output_criteria:
      - id: "opencode-config-staged"
        kind: "command-exit-code"
        equals: 0
  - id: "bare-delegate"
    type: "shell"
    command: "opencode"
    env:
      OPENCODE_CONFIG: "$WORKSPACE_ROOT/todo-app/opencode.jsonc"
    args: ["run", "--format", "json", "--dir", "$WORKSPACE_ROOT/todo-app", "$REQUEST_FIXTURE_CONTENT"]
    timeout_sec: 600
    output_criteria:
      - id: "delegate-ran"
        kind: "command-exit-code"
        equals: 0
  - id: "verify-tests"
    type: "shell"
    command: "sh"
    args: ["-c", "cd \"$WORKSPACE_ROOT/todo-app\" && deno test src/"]
    output_criteria:
      - id: "tests-pass"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3
