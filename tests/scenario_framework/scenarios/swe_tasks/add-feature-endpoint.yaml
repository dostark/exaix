schema_version: "1.0.0"
id: "swe-add-feature-endpoint"
title: "Add CRUD endpoint for users with input validation"
pack: "swe_tasks"
tags: ["swe", "add-feature", "ci-extended"]
request_fixture: "fixtures/requests/swe_tasks/add-feature-endpoint.md"
portals:
  - alias: "add-feature-endpoint"
    source_path: "fixtures/portals/add-feature-endpoint"
mode_support: ["auto"]
matrix:
  cells:
    - tool: "mock"
      provider: "mock"
      config: "configs/mock.toml"
      requires_bin: "true"
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_key: "ANTHROPIC_API_KEY"
      requires_optin: "EXA_MATRIX_OPENCODE"
steps:
  - id: "create-workspace"
    type: "shell"
    command: "mkdir -p $WORKSPACE_ROOT/src && cp -r $FRAMEWORK_HOME/../fixtures/portals/add-feature-endpoint/src/* $WORKSPACE_ROOT/src/"
    input_criteria: []
    output_criteria:
      - id: "files-copied"
        kind: "file-found"
        path_pattern: "**/api.ts"
        score_weight: 0.2
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "$PORTAL_add-feature-endpoint"]
    input_criteria: []
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/_plan.md"
        score_weight: 0.5
      - id: "llm-judge-quality"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        evidence_path: "llm-judge-input.txt"
        score_threshold: 0.5
        score_weight: 0.5
