schema_version: "1.0.0"
id: "swe-fix-bug-null-guard"
title: "Fix null-safety bugs in formatAssignee and formatDueDate"
pack: "swe_tasks"
scoring: "gated"
tags: ["swe", "provider-live"]
request_fixture: "fixtures/requests/swe_tasks/fix-bug-null-guard.md"
reference_patch: "fixtures/swe_tasks/fix-bug-null-guard/reference.patch"
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app_null_guard_bug"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
mode_support: ["auto"]
matrix:
  cells:
    - tool: "claude-code"
      provider: "$CELL_PROVIDER"
      config: "configs/claude-cli-delegate-all.toml"
      requires_bin: "claude"
    - tool: "opencode"
      provider: "$CELL_PROVIDER"
      config: "configs/opencode-cli-delegate-all.toml"
      requires_bin: "opencode"
    - tool: "exactl"
      provider: "anthropic"
      config: "configs/anthropic-no-delegate.toml"
      requires_bin: "true"
      requires_key: "ANTHROPIC_API_KEY"
    - tool: "exactl"
      provider: "openai"
      config: "configs/openai-no-delegate.toml"
      requires_bin: "true"
      requires_key: "OPENAI_API_KEY"
    - tool: "exactl"
      provider: "google"
      config: "configs/google-no-delegate.toml"
      requires_bin: "true"
      requires_key: "GOOGLE_API_KEY"
    # OpenRouter cell deliberately omitted (Phase 153 Step 5 Tier B, Pre-Gap-Analysis GAP-2):
    # no OPENROUTER_API_KEY/persisted credential available in this environment. Add a
    # `configs/openrouter-no-delegate.toml` + matching cell here once one is provisioned -
    # tracked as an explicit follow-up, not silently folded into this scenario's coverage.
steps:
  - id: "patch-blueprint-capability"
    type: "patch-blueprint"
    blueprint: "senior-coder"
    add_capabilities: ["cli_delegate"]
    # Scoped to the CLI-delegate cells only (Phase 153 Step 5 finding): the direct-API
    # exactl cells below (anthropic/openai/google) never enable [cli_delegate] in their
    # configs, so AgentOrchestrator never registers CliDelegateStrategy for them. Before
    # this field existed, the capability patch applied unconditionally to every cell,
    # so a direct-API cell's blueprint carried a capability its config could never back —
    # AgentOrchestrator.resolveStrategyName() picks CLI_DELEGATE whenever the capability is
    # present (by design, to fail loudly rather than silently fall back to a different
    # execution path — see cli_delegate_dispatch_test.ts), so execution threw "Execution
    # strategy not found: cli_delegate" for every direct-API cell, never reaching
    # ReActLoopStrategy/native tool-calling at all.
    cells: ["claude-code", "opencode"]
    output_criteria:
      - id: "capability-patched"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]
  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]
  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app", "--identity", "senior-coder"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]
  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 180
    failure_glob: "Workspace/Rejected/*_rejected.md"
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.15
  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        class: "security"
        kind: "command-output-contains"
        contains: ["approved"]
  - id: "wait-for-execution-completion"
    type: "wait-for-file"
    args: ["**/Archive/*_plan.md"]
    timeout_sec: 300
    output_criteria:
      - id: "execution-completed"
        kind: "file-found"
        path_pattern: "**/Archive/*_plan.md"
        score_weight: 0.15
  - id: "approve-review"
    type: "exactl"
    command: "review"
    args: ["approve", "$REQUEST_ID"]
    output_criteria:
      - id: "review-approved"
        class: "security"
        kind: "command-output-contains"
        contains: ["review.approved"]
        score_weight: 0.15
  - id: "verify-tests"
    type: "test-run"
    cwd: "todo-app"
    command: "deno"
    args: ["test", "src/"]
    # A failing test run must NOT skip the judge: the failure is the signal being graded.
    continue_on_failure: true
    output_criteria:
      - id: "tests-pass"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3
  - id: "assert-no-dynamic-tool-calls"
    type: "journal-assert"
    action_type: "dynamic_tool_call"
    trace_scoped: true
    expect_count: 0
    # Scoped to the CLI-delegate cells only (Phase 153 GAP-1): direct-API cells (anthropic/openai/google)
    # intentionally execute via ReActLoopStrategy with native_tools_enabled: true, which produces
    # real dynamic_tool_call journal rows. This security gate asserts that no freelance tool calls
    # were made, which is relevant only to CLI delegates (claude-code, opencode) that are expected
    # to run completely without Exaix-side dynamic tool-calling.
    cells: ["claude-code", "opencode"]
    output_criteria:
      - id: "no-dynamic-tool-calls"
        class: "security"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2
  - id: "assert-files-changed"
    type: "journal-assert"
    action_type: "agent.execution_completed"
    trace_scoped: true
    expect_sum:
      path: "files_changed"
      gt: 0
    output_criteria:
      - id: "files-changed-nonempty"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2
  - id: "judge-quality"
    type: "judge"
    step_pass_threshold: 0.8
    env:
      EXA_EVAL_LLM_MOCK: "false"
    output_criteria:
      - id: "llm-judge-quality"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        # Code-change task: the judge reviews the FULL worktree branch diff (the applied
        # changes) against the task's reference patch — never a pre-picked single file.
        evidence_diff_dir: "todo-app"
        context_path: "$REFERENCE_PATCH"
        # Pass the verify-tests outcome (PASSED/FAILED + exit code + output) to the judge.
        test_run_source: "verify-tests"
        score_threshold: 0.5
        score_weight: 0.4
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
