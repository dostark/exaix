schema_version: "1.0.0"
id: "swe-refactor-extract-function"
title: "Refactor monolithic order processor into extracted functions"
pack: "swe_tasks"
tags: ["swe", "refactor", "ci-extended"]
request_fixture: "fixtures/requests/swe_tasks/refactor-extract-function.md"
portals:
  - alias: "refactor-extract-function"
    source_path: "fixtures/portals/refactor-extract-function"
mode_support: ["auto"]
matrix:
  cells:
    - tool: "mock"
      provider: "mock"
      config: "configs/mock.toml"
      requires_bin: "true"
    - tool: "opencode"
      provider: "direct"
      config: "configs/dogfood.toml"
      requires_bin: "opencode"
      requires_key: "ANTHROPIC_API_KEY"
      requires_optin: "EXA_MATRIX_OPENCODE"
steps:
  - id: "start-daemon"
    type: "shell"
    command: "sh"
    args: ["-c", "echo daemon-ready"]
    input_criteria: []
    output_criteria: []
  - id: "create-workspace"
    type: "shell"
    command: "sh"
    args: [
      "-c",
      "mkdir -p $WORKSPACE_ROOT/src && cp -r $FRAMEWORK_HOME/../fixtures/portals/refactor-extract-function/src/* $WORKSPACE_ROOT/src/",
    ]
    input_criteria: []
    output_criteria:
      - id: "files-copied"
        kind: "file-found"
        path_pattern: "**/order_processor.ts"
        score_weight: 0.2
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "refactor-extract-function"]
    input_criteria: []
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/_plan.md"
        score_weight: 0.5
      - id: "llm-judge-quality"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        evidence_path: "llm-judge-input.txt"
        score_threshold: 0.5
        score_weight: 0.5
