schema_version: "1.0.0"
id: "swe-add-feature-endpoint-cli-all-legacy"
title: "Add a complete-task endpoint to the todo-app API entirely via a headless CLI subscription (analysis, planning, and code_changes — zero API key)"
pack: "swe_tasks"
tags: ["swe", "swe-legacy", "add-feature", "provider-live", "cli-delegate", "no-api-key"]
request_fixture: "fixtures/requests/swe_tasks/add-feature-endpoint.md"
portals: []
mode_support: ["auto"]

# Two cells, one per supported CLI-delegate tool. The runner only ever executes the FIRST
# cell with status "run" (synthetic_runner.ts) — select explicitly to exercise a specific tool:
#   run-scenarios -s swe-add-feature-endpoint-cli-all --cell claude-code
#   run-scenarios -s swe-add-feature-endpoint-cli-all --cell opencode
matrix:
  cells:
    - tool: "claude-code"
      provider: "$CELL_PROVIDER"
      config: "configs/claude-cli-delegate-all.toml"
      requires_bin: "claude"
    - tool: "opencode"
      provider: "$CELL_PROVIDER"
      config: "configs/opencode-cli-delegate-all.toml"
      requires_bin: "opencode"

steps:
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args:
      [
        "run",
        "-A",
        "--config",
        "$FRAMEWORK_HOME/../../deno.json",
        "$FRAMEWORK_HOME/../../scripts/setup_db.ts",
      ]
    env:
      EXA_MIGRATIONS_DIR: "$FRAMEWORK_HOME/../../migrations"
    output_criteria:
      - id: "setup-done"
        kind: "command-exit-code"
        equals: 0

  # code_changes forces PortalExecutionStrategy.WORKTREE for a plan whose frontmatter carries a
  # portal, so the portal must be a real git repo. Mirrors add-feature-endpoint.yaml.
  - id: "setup-portal-repo"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cp -r \"$FRAMEWORK_HOME/fixtures/portals/todo_app\" \"$WORKSPACE_ROOT/todo-app\" && cd \"$WORKSPACE_ROOT/todo-app\" && git init -q && git add -A && git -c user.email=swe-tasks@exaix.dev -c user.name=swe-tasks commit -q -m 'init todo-app fixture'",
      ]
    output_criteria:
      - id: "portal-repo-initialized"
        kind: "command-exit-code"
        equals: 0

  - id: "setup-blueprints"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Blueprints", "$WORKSPACE_ROOT/Blueprints"]
    output_criteria:
      - id: "blueprints-copied"
        kind: "command-exit-code"
        equals: 0

  # CliDelegateStrategy is dispatched only for a blueprint whose capabilities include
  # "cli_delegate" (AgentOrchestrator.executeStep). Patch ONLY the sandboxed copy just staged
  # into the workspace, so this verification never touches the repo's real identity file.
  - id: "patch-blueprint-capability"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "sed -i 's/\"react\"\\]/\"react\", \"cli_delegate\"\\]/' \"$WORKSPACE_ROOT/Blueprints/Identities/senior-coder.md\" && grep -q cli_delegate \"$WORKSPACE_ROOT/Blueprints/Identities/senior-coder.md\"",
      ]
    output_criteria:
      - id: "capability-patched"
        kind: "command-exit-code"
        equals: 0

  - id: "setup-memory"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Memory", "$WORKSPACE_ROOT/Memory"]
    output_criteria:
      - id: "memory-copied"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app", "--identity", "senior-coder"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    failure_glob: "**/Workspace/Rejected/*_rejected.md"
    timeout_sec: 180
    input_criteria: []
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.15

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-execution-completion"
    type: "wait-for-file"
    args: ["**/Archive/*_plan.md"]
    timeout_sec: 300
    output_criteria:
      - id: "execution-completed"
        kind: "file-found"
        path_pattern: "**/Archive/*_plan.md"
        score_weight: 0.15

  # PortalExecutionStrategy.WORKTREE is forced for every plan whose frontmatter carries a
  # portal; approve the review to merge the worktree branch back before run-tests checks the
  # mounted portal. See fix-bug-null-guard-cli-all.yaml for the full rationale.
  - id: "approve-review"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "trace_id=$(sqlite3 \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT trace_id FROM activity WHERE action_type = 'request.created' ORDER BY rowid ASC LIMIT 1\"); short_id=$(printf '%s' \"$trace_id\" | cut -c1-8); echo \"trace_id: $trace_id\"; \"$FRAMEWORK_HOME/bin/exactl\" review approve \"request-$short_id\"",
      ]
    output_criteria:
      - id: "review-approved"
        kind: "command-output-contains"
        contains: ["review.approved"]
        score_weight: 0.15

  # Deterministic pass signal: the fixture's own test suite must still pass after the new
  # handler is added, checked against the mounted portal now that approve-review has merged in.
  - id: "run-tests"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cd \"$WORKSPACE_ROOT/todo-app\" && deno test src/",
      ]
    output_criteria:
      - id: "tests-pass"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  # CliDelegateStrategy is a single synchronous subprocess call per step — it never journals
  # dynamic_tool_call rows (that's ReActLoopStrategy's per-tool-invocation event).
  - id: "assert-no-dynamic-tool-calls"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "count=$(sqlite3 \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT COUNT(*) FROM activity WHERE action_type = 'dynamic_tool_call'\"); echo \"dynamic_tool_call count: $count\"; test \"$count\" = \"0\"",
      ]
    output_criteria:
      - id: "no-dynamic-tool-calls"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  - id: "assert-files-changed"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "n=$(sqlite3 \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT COALESCE(SUM(json_extract(payload,'$.files_changed')),0) FROM activity WHERE action_type = 'agent.execution_completed'\"); echo \"files_changed total: $n\"; test \"${n:-0}\" -gt 0",
      ]
    output_criteria:
      - id: "files-changed-nonempty"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  - id: "prepare-llm-judge-evidence"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cat \"$WORKSPACE_ROOT/todo-app/src/api.ts\" > \"$WORKSPACE_ROOT/llm-judge-input.txt\"",
      ]
    output_criteria:
      - id: "evidence-prepared"
        kind: "command-exit-code"
        equals: 0

  - id: "judge-quality"
    type: "shell"
    command: "sh"
    args: ["-c", "true"]
    step_pass_threshold: 0.8
    env:
      EXA_EVAL_LLM_MOCK: "false"
      EXA_LLM_PROVIDER: "$CELL_PROVIDER"
      EXA_LLM_MODEL: "$CELL_PROVIDER:$CELL_MODEL"
    output_criteria:
      - id: "llm-judge-quality"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        evidence_path: "llm-judge-input.txt"
        context_path: "$REQUEST_FIXTURE"
        score_threshold: 0.5
        score_weight: 0.4

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
