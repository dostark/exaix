schema_version: "1.0.0"
id: "swe-fix-bug-null-guard-cli-all"
title: "Fix null-safety bugs in todo-app entirely via a headless CLI subscription (analysis, planning, and code_changes — zero API key)"
pack: "swe_tasks"
tags: ["swe", "fix-bug", "provider-live", "cli-delegate", "no-api-key"]
request_fixture: "fixtures/requests/swe_tasks/fix-bug-null-guard.md"
portals: []
mode_support: ["auto"]

# Two cells, one per supported CLI-delegate tool. The runner only ever executes the FIRST
# cell with status "run" (synthetic_runner.ts) — a bare invocation with no --cell selection
# always runs whichever cell's binary happens to be on PATH first, silently never running the
# other. Select explicitly to exercise a specific tool:
#   run-scenarios -s swe-fix-bug-null-guard-cli-all --cell claude-code
#   run-scenarios -s swe-fix-bug-null-guard-cli-all --cell opencode
# CI (or a local full pass) runs both by invoking once per --cell. Adding a new CLI-delegate
# tool (Codex, Kimi, GLM, ...) means adding one more cell here + one new config file — no
# other scenario changes.
matrix:
  cells:
    # provider is a documentary label only (matrix_expander.ts) — the config's own [ai].provider
    # is the real source of truth. $CELL_PROVIDER/$CELL_MODEL are resolved from that same
    # config's [ai] block by materializeCellConfig (synthetic_runner.ts), so this placeholder
    # never drifts from the config and the scenario never hardcodes a provider/model string.
    - tool: "claude-code"
      provider: "$CELL_PROVIDER"
      config: "configs/claude-cli-delegate-all.toml"
      requires_bin: "claude"
    - tool: "opencode"
      provider: "$CELL_PROVIDER"
      config: "configs/opencode-cli-delegate-all.toml"
      requires_bin: "opencode"

steps:
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args:
      [
        "run",
        "-A",
        "--config",
        "$FRAMEWORK_HOME/../../deno.json",
        "$FRAMEWORK_HOME/../../scripts/setup_db.ts",
      ]
    env:
      EXA_MIGRATIONS_DIR: "$FRAMEWORK_HOME/../../migrations"
    output_criteria:
      - id: "setup-done"
        kind: "command-exit-code"
        equals: 0

  # code_changes forces PortalExecutionStrategy.WORKTREE for a plan whose frontmatter carries a
  # portal, so the portal must be a real git repo. Mirrors fix-bug-null-guard.yaml.
  - id: "setup-portal-repo"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cp -r \"$FRAMEWORK_HOME/fixtures/portals/todo_app\" \"$WORKSPACE_ROOT/todo-app\" && cd \"$WORKSPACE_ROOT/todo-app\" && git init -q && git add -A && git -c user.email=swe-tasks@exaix.dev -c user.name=swe-tasks commit -q -m 'init todo-app fixture'",
      ]
    output_criteria:
      - id: "portal-repo-initialized"
        kind: "command-exit-code"
        equals: 0

  - id: "setup-blueprints"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Blueprints", "$WORKSPACE_ROOT/Blueprints"]
    output_criteria:
      - id: "blueprints-copied"
        kind: "command-exit-code"
        equals: 0

  # CliDelegateStrategy (packages/execution/src/strategies/cli_delegate_strategy.ts) is dispatched
  # only for a blueprint whose capabilities include "cli_delegate" (AgentOrchestrator.executeStep).
  # The real Blueprints/Identities/senior-coder.md intentionally does NOT declare this capability —
  # patch ONLY the sandboxed copy just staged into the workspace, so this verification never
  # touches the repo's real identity file.
  - id: "patch-blueprint-capability"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "sed -i 's/\"react\"\\]/\"react\", \"cli_delegate\"\\]/' \"$WORKSPACE_ROOT/Blueprints/Identities/senior-coder.md\" && grep -q cli_delegate \"$WORKSPACE_ROOT/Blueprints/Identities/senior-coder.md\"",
      ]
    output_criteria:
      - id: "capability-patched"
        kind: "command-exit-code"
        equals: 0

  - id: "setup-memory"
    type: "shell"
    command: "cp"
    args: ["-r", "$FRAMEWORK_HOME/../../Memory", "$WORKSPACE_ROOT/Memory"]
    output_criteria:
      - id: "memory-copied"
        kind: "command-exit-code"
        equals: 0

  # The selected cell's config (configs/claude-cli-delegate-all.toml or
  # configs/opencode-cli-delegate-all.toml): [ai]/[models.default] AND [cli_delegate] all point
  # at the same tool/model — request analysis, plan generation, and the code_changes step all
  # run through the same headless CLI subprocess. allow_net is empty; no ANTHROPIC_API_KEY or
  # any metered HTTP call is used anywhere in this run.
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app", "--identity", "senior-coder"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    # A rejected plan (e.g. the CLI-delegate model using a tool name outside
    # McpToolName) writes to Workspace/Rejected/ within seconds — fail fast on that
    # instead of burning the full 180s timeout waiting for a plan that already can't
    # exist, and surface the real rejection reason instead of a generic timeout.
    failure_glob: "**/Workspace/Rejected/*_rejected.md"
    timeout_sec: 180
    input_criteria: []
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.15

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-execution-completion"
    type: "wait-for-file"
    args: ["**/Archive/*_plan.md"]
    timeout_sec: 300
    output_criteria:
      - id: "execution-completed"
        kind: "file-found"
        path_pattern: "**/Archive/*_plan.md"
        score_weight: 0.15

  # CliDelegateStrategy edits the mounted portal directly (its resolvePortalPath resolves the
  # identity's options.portal to the portal's real target_path — no code_changes delegate
  # worktree, that's session_delegate's mechanism, not cli_delegate's).
  - id: "run-tests"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cd \"$WORKSPACE_ROOT/todo-app\" && deno test src/",
      ]
    output_criteria:
      - id: "tests-pass"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  # CliDelegateStrategy is a single synchronous subprocess call per step — it never calls
  # executor.logDynamicToolCall (that's ReActLoopStrategy's per-tool-invocation journal event),
  # so a genuine CliDelegateStrategy run journals ZERO dynamic_tool_call rows.
  - id: "assert-no-dynamic-tool-calls"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "count=$(sqlite3 \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT COUNT(*) FROM activity WHERE action_type = 'dynamic_tool_call'\"); echo \"dynamic_tool_call count: $count\"; test \"$count\" = \"0\"",
      ]
    output_criteria:
      - id: "no-dynamic-tool-calls"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  # SUM (not the last row alone — a multi-step plan's final step is often a read-only
  # verification turn that legitimately reports 0) across all agent.execution_completed rows.
  - id: "assert-files-changed"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "n=$(sqlite3 \"$WORKSPACE_ROOT/.exa/journal.db\" \"SELECT COALESCE(SUM(json_extract(payload,'$.files_changed')),0) FROM activity WHERE action_type = 'agent.execution_completed'\"); echo \"files_changed total: $n\"; test \"${n:-0}\" -gt 0",
      ]
    output_criteria:
      - id: "files-changed-nonempty"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  - id: "prepare-llm-judge-evidence"
    type: "shell"
    command: "sh"
    args:
      [
        "-c",
        "cat \"$WORKSPACE_ROOT/todo-app/src/utils.ts\" > \"$WORKSPACE_ROOT/llm-judge-input.txt\"",
      ]
    output_criteria:
      - id: "evidence-prepared"
        kind: "command-exit-code"
        equals: 0

  # The LLM judge itself is a SEPARATE evaluation call (not part of the request/plan/execution
  # loop under test), resolved via ModelResolver against bootstrapProviderRegistry() — the
  # same registration path the selected cell's provider went through, so pointing the judge at
  # it too keeps this scenario's "zero API key" claim true end-to-end (agent AND judge).
  # $CELL_PROVIDER / $CELL_MODEL come from the selected cell's own config's [ai] block via
  # materializeCellConfig — never hardcoded here, so a future provider only needs a new config
  # file plus one new matrix cell above, not an edit to this scenario's steps.
  - id: "judge-quality"
    type: "shell"
    command: "sh"
    args: ["-c", "true"]
    # step_pass_threshold: a near-perfect (but not 1.0) judge score is still a pass —
    # only a score below 0.8 flips the scenario outcome to scenario-failure.
    step_pass_threshold: 0.8
    env:
      EXA_EVAL_LLM_MOCK: "false"
      EXA_LLM_PROVIDER: "$CELL_PROVIDER"
      EXA_LLM_MODEL: "$CELL_PROVIDER:$CELL_MODEL"
    output_criteria:
      - id: "llm-judge-quality"
        kind: "llm-judge"
        preset: "GOAL_ALIGNED_REVIEW"
        evidence_path: "llm-judge-input.txt"
        score_threshold: 0.5
        score_weight: 0.4

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
