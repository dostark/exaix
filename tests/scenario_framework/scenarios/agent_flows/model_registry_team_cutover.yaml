schema_version: "1.0.0"
id: "model-registry-team-cutover"
title: "Model Registry Team cutover — request-to-plan-approval-to-execution resolves via ModelResolver (best_ranked)"
pack: "agent_flows"
tags: ["safety-gate", "model-routing", "subsystem:flows"]
edition: "team"
request_fixture: "fixtures/requests/agent_flows/model_registry_team_cutover.md"
mode_support: ["auto"]
portals: []

steps:
  # --- Setup ---
  - id: "setup-best-agent-role"
    type: "write-file"
    path: "Blueprints/Agents/stub-best.md"
    content: |
      ---
      agent_role: "stub-best"
      model: ""
      characteristics: ["best"]
      task_type: feature
      permitted_tools:
        - write_file
      ---

      You are a stub agent for testing best-ranked model resolution.
    output_criteria:
      - id: "agent-role-written"
        kind: "command-exit-code"
        equals: 0

  # No EXA_CONFIG_PATH override on start-daemon (see below) means the framework never
  # materializes $WORKSPACE_ROOT/exa.config.toml — every step falls back to schema
  # defaults, which have quality_gate/request_analysis enabled (they'd otherwise route
  # this request into needs-clarification and no plan is ever written). Write the file
  # ourselves: quality_gate/request_analysis disabled (heuristic-only would still need a
  # provider round trip we don't want here), model_registry enabled for Team edition.
  # Deliberately NOT configs/dogfood.toml — its session_delegate.model = "deepseek-v4-flash"
  # intercepts plan steps before AgentOrchestrator/ModelResolver ever runs.
  - id: "write-config"
    type: "write-file"
    path: "exa.config.toml"
    content: |
      [system]
      root = "$WORKSPACE_ROOT"

      [paths]
      workspace = "Workspace"
      blueprints = "Blueprints"
      runtime = ".exa"
      memory = "Memory"
      portals = "Portals"

      [quality_gate]
      enabled = false

      [request_analysis]
      enabled = false

      [model_registry]
      enabled = true
    output_criteria:
      - id: "config-written"
        kind: "command-exit-code"
        equals: 0

  # --- Start daemon (Team edition) ---
  - id: "start-daemon"
    type: "exactl"
    command: "daemon start"
    env:
      EXA_LLM_PROVIDER: "mock"
      EXAIX_EDITION: "team"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  # AgentOrchestrator.executeStep requires a `workspace`-aliased portal to be registered
  # (resolvePortalName's fallback default) — the framework's default config has none.
  - id: "add-workspace-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT", "workspace"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  # --- Submit request targeting the best-characteristic agent role ---
  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: [
      "--file",
      "$REQUEST_FIXTURE",
      "--agent-role",
      "stub-best",
      "--subject",
      "Model registry Team cutover scenario",
    ]
    output_criteria:
      - id: "request-submitted"
        kind: "command-exit-code"
        equals: 0

  # --- Wait for the plan to reach review status ---
  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["Workspace/Plans/*_plan.md"]
    timeout_sec: 180
    output_criteria:
      - id: "plan-created"
        kind: "file-found"
        path_pattern: "Workspace/Plans/*_plan.md"

  # --- Approve the plan, moving it to Workspace/Active so ExecutionLoop picks it up ---
  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        kind: "command-exit-code"
        equals: 0

  # --- Step 8/9 checkpoint: model.resolved journalled with reason best_ranked ---
  # The production resolver (agent_executor.resolveModelFromBlueprint -> ModelResolver.resolve,
  # wired through PlanExecutor's IPlanExecutorOptions.modelResolver — Phase 135 Step 9, GAP-C9)
  # journals model.resolved once ExecutionLoop picks up the approved plan.
  - id: "verify-model-resolved-best-ranked"
    type: "exactl"
    name: "model.resolved journalled with reason best_ranked (Step 8 scoring reachable from real plan execution)"
    command: "journal"
    args: ["--filter", "action_type=model.resolved", "--format", "json"]
    output_criteria:
      - id: "model-resolved-present"
        score_weight: 1.0
        kind: "json-query"
        query: ".[].action_type"
        contains: ["model.resolved"]
      - id: "reason-is-best-ranked"
        score_weight: 1.0
        kind: "json-query"
        query: ".[].payload"
        contains: ["best_ranked"]

  # --- Stop daemon ---
  - id: "stop-daemon"
    type: "exactl"
    command: "daemon stop"
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
