schema_version: "1.0.0"
id: "execution-unslop-exhausted"
title: "Post-execution unslop repair exhausts"
pack: "agent_flows"
tags: ["safety-gate"]
request_fixture: "fixtures/requests/agent_flows/execution_unslop_exhausted.md"
mode_support: ["auto"]
unslop_assets: true
portals:
  - alias: "verify-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/verify-app"
    git_init: true
    verification:
      checks:
        - kind: "unslop"
      max_repair_attempts: 0
      check_timeout_ms: 20000
steps:
  - id: "write-repair-agent"
    type: "write-file"
    name: "Write the unslop repair agent blueprint"
    path: "Blueprints/Agents/verification-unslop-coder.md"
    content: |
      ---
      agent_role: "verification-unslop-coder"
      name: "Verification Unslop Coder"
      model: "mock:test"
      capabilities: ["read_file", "write_file"]
      created: "2026-10-24T00:00:00Z"
      created_by: "test"
      version: "1.0.0"
      ---

      # Verification Unslop Coder
    output_criteria:
      - id: "agent-written"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.1
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "inject-approved-plan"
    type: "write-file"
    name: "Write an approved plan that adds a chained type assertion"
    path: "Workspace/Active/execution-unslop-exhausted_plan.md"
    content: |
      ---
      trace_id: "22900000-0000-4000-8000-000000000229"
      request_id: "execution-unslop-exhausted"
      status: approved
      portal: verify-app
      agent_role: verification-unslop-coder
      ---

      # Unslop plan

      ```toml
      tool = "write_file"
      description = "write a seed with a chained cast"

      [params]
      path = "seed.ts"
      content = """
      export const seed = 1 as unknown as string;
      """
      ```
    output_criteria:
      - id: "plan-injected"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-execution"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "execution.completed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 150
    output_criteria:
      - id: "execution-completed"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
