schema_version: "1.0.0"
id: "portal-knowledge-adaptive-tools"
title: "A code-analyst ReAct turn calls query_symbols through the real registry, past the permitted_tools allowlist"
pack: "agent_flows"
# The live model chooses the tool; deterministic role-denial coverage lives in
# packages/execution/tests/agents/react_loop_portal_graph_permissions_test.ts.
tags: ["portal", "tools", "query_symbols", "subsystem:mcp-client", "entity:query_symbols", "provider-live"]
request_fixture: "fixtures/requests/agent_flows/portal_knowledge_query_symbols.md"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
matrix:
  cells:
    - tool: "codex"
      provider: "codex-cli"
      config: "configs/codex-cli-portal-graph.toml"
      requires_bin: "codex"
      requires_optin: "EXA_MATRIX_CODEX"
steps:
  - id: "analyze-portal"
    type: "exactl"
    command: "portal analyze todo-app --mode standard --force"
    timeout_sec: 120
    output_criteria:
      - id: "symbol-cache-populated"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-react-step"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "flow.step.started", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "60"]
    timeout_sec: 60
    output_criteria:
      - id: "react-step-started"
        kind: "journal-event-exists"
        event_type: "flow.step.started"
        score_weight: 0.3

  - id: "assert-react-step"
    type: "journal-assert"
    action_type: "flow.step.started"
    trace_scoped: true
    payload_equals:
      - path: "stepId"
        value: "query-symbols"
      - path: "strategy"
        value: "react"
    output_criteria:
      - id: "react-strategy-honored"
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-query-symbols"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "dynamic_tool_call", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 120
    output_criteria:
      - id: "tool-call-journaled"
        kind: "journal-event-exists"
        event_type: "dynamic_tool_call"

  - id: "assert-query-symbols-result"
    type: "journal-assert"
    action_type: "dynamic_tool_call"
    trace_scoped: true
    payload_equals:
      - path: "tool"
        value: "query_symbols"
    expect_contains: ["symbols", "src/"]
    output_criteria:
      - id: "bounded-symbol-result"
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
