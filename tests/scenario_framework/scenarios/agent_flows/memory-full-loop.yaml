schema_version: "1.0.0"
# Cutover scenario for the full memory-maturation chain, asserted end to end against the mocked provider in one run: capture (a real ReAct loop calling remember_fact through a context-wired ToolRegistry),
# scratchpad-informed extraction, real auto-approval (auto_approve.enabled=true), hybrid retrieval for a later request, and a reflection cycle whose synthesis writes topical links.
# It uses the in-process pattern of run_memory_full_loop.ts.
id: "memory-full-loop"
title: "Agent flow — the full capture → extract → approve → retrieve → reflect loop closes unattended"
pack: "agent_flows"
tags: ["domain", "subsystem:memory", "entity:remember_fact", "entity:memory-loop"]
request_fixture: "fixtures/requests/agent_flows/memory_full_loop.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "memory-full-loop"
    type: "run-script"
    name: "real ReAct capture, extraction, auto-approval, retrieval, and reflection close in one run"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/run_memory_full_loop.ts"
      - "$WORKSPACE_ROOT"
    output_criteria:
      - id: "capture-captured"
        kind: "command-output-contains"
        contains: ['"scratchpad_entries":1']
        score_weight: 0.15
      - id: "react-tool-call-observed"
        kind: "command-output-contains"
        contains: ['"tool_calls":1']
        score_weight: 0.15
      - id: "auto-approved"
        kind: "command-output-contains"
        contains: ['"approved_count":1']
        score_weight: 0.2
      - id: "retrieved-for-later-request"
        kind: "command-output-contains"
        contains: ['"retrieved":true']
        score_weight: 0.2
      - id: "reflection-synthesised"
        kind: "command-output-contains"
        contains: ['"synthesised":1']
        score_weight: 0.15
      - id: "topical-links-written"
        kind: "command-output-contains"
        contains: ['"topical_linked":true']
        score_weight: 0.15
