schema_version: "1.0.0"
id: "execution-unslop-disabled"
title: "Post-execution unslop check stays disabled"
pack: "agent_flows"
tags: ["safety-gate"]
request_fixture: "fixtures/requests/agent_flows/execution_unslop_disabled.md"
mode_support: ["auto"]
unslop_assets: false
portals:
  - alias: "verify-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/verify-app"
    git_init: true
steps:
  # A scenario pack shares one sandbox, so a sibling that stages the lint assets would
  # leave them here. Removing them first makes "no asset dependency" a real assertion:
  # this run must neither stage them back nor read them.
  - id: "remove-lint-assets"
    type: "remove-files"
    name: "Remove any lint assets a sibling scenario staged"
    args: ["lint/**"]
    output_criteria:
      - id: "assets-removed"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.1
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "inject-approved-plan"
    type: "write-file"
    name: "Write an approved plan that adds a chained type assertion"
    path: "Workspace/Active/execution-unslop-disabled_plan.md"
    content: |
      ---
      trace_id: "22b00000-0000-4000-8000-000000000231"
      request_id: "execution-unslop-disabled"
      status: approved
      portal: verify-app
      agent_role: senior-coder
      ---

      # Unslop plan

      ```toml
      tool = "write_file"
      description = "write a seed with a chained cast"

      [params]
      path = "seed.ts"
      content = """
      export const seed = 1 as unknown as string;
      """
      ```
    output_criteria:
      - id: "plan-injected"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-execution"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "execution.completed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 150
    output_criteria:
      - id: "execution-completed"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  # An injected plan emits no request.created, so trace_scoped has nothing to resolve.
  # Every verification event carries the plan's request_id, which scopes them instead.
  - id: "assert-not-configured"
    type: "journal-assert"
    action_type: "execution.completed"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-disabled"
      - path: "verification_status"
        value: "not_configured"
    expect_count: 1
    output_criteria:
      - id: "verification-not-configured"
        class: "security"
        score_weight: 0.3
        kind: "command-exit-code"
        equals: 0

  - id: "assert-no-verification-started"
    type: "journal-assert"
    action_type: "execution.verification.started"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-disabled"
    expect_count: 0
    output_criteria:
      - id: "no-verification-run"
        class: "security"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  # The adapter emits one started and one completed event per invocation, including a
  # zero-selection run. Neither may appear for a portal without the check.
  - id: "assert-no-lint-spawn"
    type: "journal-assert"
    action_type: "execution.verification.lint_check.started"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-disabled"
    expect_count: 0
    output_criteria:
      - id: "no-lint-child"
        class: "security"
        score_weight: 0.3
        kind: "command-exit-code"
        equals: 0

  - id: "assert-no-snapshot"
    type: "journal-assert"
    action_type: "execution.verification.lint_findings"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-disabled"
    expect_count: 0
    output_criteria:
      - id: "no-terminal-snapshot"
        class: "security"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  # The run must not stage the packaged lint assets back into the sandbox.
  - id: "assert-no-assets"
    type: "file-contains"
    file_pattern: "lint/manifest.json"
    output_criteria:
      - id: "no-staged-assets"
        class: "security"
        score_weight: 0.3
        kind: "file-not-exists"
        path: "lint/manifest.json"

  # The reviewer view carries the status and no findings summary at all.
  - id: "review-show"
    type: "exactl"
    command: "review"
    args: ["show", "feat/execution-unslop-disabled-22b00000"]
    output_criteria:
      - id: "review-shows-not-configured"
        class: "security"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["verification: not_configured"]
      - id: "review-has-no-unslop-summary"
        class: "security"
        score_weight: 0.2
        kind: "command-output-not-contains"
        not_contains: ["unslop:"]

  - id: "canonical-lint-event-inventory"
    type: "journal-assert"
    action_types: [
      "execution.verification.lint_check.started",
      "execution.verification.lint_check.completed",
      "execution.verification.lint_findings",
      "execution.completed",
    ]
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-disabled"
    project:
      action: "action_type"
      trace: "trace_id"
      request: "payload.request_id"
      run: "payload.run_id"
      completed_run: "payload.verification_run_id"
      attempt: "payload.attempt"
      check_index: "payload.check_index"
      target: "payload.target_sha"
      commit_sha: "payload.commit_sha"
      status: "payload.verification_status"
      outcome: "payload.outcome"
      total: "payload.total"
      error: "payload.error_class"
    output_criteria:
      - id: "canonical-trace"
        class: "security"
        kind: "command-output-contains"
        contains: ["22b00000-0000-4000-8000-000000000231"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
