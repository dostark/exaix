schema_version: "1.0.0"
id: "session-delegate-plan-review"
title: "Session Delegation — Plan Review Gate"
pack: "agent_flows"
tags: ["safety-gate", "session-delegation", "manual-only", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/plan_amendment_trigger_drift.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120

  - id: "approve-and-delegate-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-amendment-decision"
    type: "wait-for-file"
    args: ["**/Amendments/*.json"]
    timeout_sec: 120
    output_criteria:
      - id: "amendment-decision-created"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Amendments/*.json"

  - id: "verify-delegated-decision"
    type: "exactl"
    command: "plan"
    args: ["amendment", "list"]
    output_criteria:
      - id: "delegated-decision-present"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
