schema_version: "1.0.0"
id: "flow-strategy-routing"
title: "A flow step declaring strategy routes through the agent strategy registry"
pack: "agent_flows"
tags: ["subsystem:flows", "entity:strategy-routing-smoke.flow"]
request_fixture: "fixtures/requests/agent_flows/strategy_routing_smoke.md"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
matrix:
  cells:
    - tool: "exactl"
      provider: "mock"
      config: "configs/agent-flows-mock-pattern.toml"
      requires_bin: "true"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-flow-completed"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "flow.completed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 120
    input_criteria: []
    output_criteria:
      - id: "flow-completed"
        kind: "journal-event-exists"
        event_type: "flow.completed"
        score_weight: 0.34

  - id: "assert-strategy-in-journal"
    type: "journal-assert"
    action_type: "flow.step.completed"
    payload_contains:
      - '"stepId":"react-step"'
      - '"strategy":"react"'
    output_criteria:
      - id: "strategy-honored"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.33

  - id: "assert-no-strategy-step-unchanged"
    type: "journal-assert"
    action_type: "flow.step.completed"
    payload_contains:
      - '"stepId":"no-strategy-step"'
    payload_not_contains:
      - '"strategy":'
    output_criteria:
      - id: "no-strategy-step-unchanged"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.33
