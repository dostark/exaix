schema_version: "1.0.0"
id: "openai-compatible-native-dynamic"
title: "Phase 155 — dynamic flow step runs two native tool rounds on the configured OpenAI-compatible local route"
pack: "agent_flows"
tags: ["safety-gate", "manual-only", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/openai_compatible_native_dynamic.md"
mode_support: ["auto"]
flow_fixture: "fixtures/flows/phase155/compat_dynamic.flow.yaml"
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
bindings:
  default:
    service: "compat-fixture"
    model: "openai-chat/compat-fixture-v1"
pin:
  - selector: default
    fields: [service, model]
    reason: wire-compat-regression
    note: "The wire format this fixture asserts is qualified for this model, so an operator override would change what the fixture measures."
matrix:
  cells:
    - tool: "compat-fixture"
      provider: "openai-chat"
      config: "tests/scenario_framework/fixtures/phase155/local-compatible.toml"
      requires_bin: "deno"
      requires_key: "EXA_COMPAT_TEST_API_KEY"
steps:
  - id: "write-compat-agent"
    type: "write-file"
    path: "Blueprints/Agents/compat-agent.md"
    content: |
      ---
      agent_role: "compat-agent"
      name: "Compatible ReAct Agent"
      model: "openai-chat:compat-fixture-v1"
      model_size: M
      characteristics: [fastest]
      capabilities: ["react"]
      created: "2026-09-27T00:00:00Z"
      created_by: "scenario-framework"
      version: "1.0.0"
      description: "Local compatible provider scenario agent"
      default_skills: []
      permitted_tools: ["read_file"]
      ---
      Read the requested file and return the result.

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXAIX_EDITION: "team"
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    env:
      EXAIX_EDITION: "team"
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-flow-terminal"
    type: "exactl"
    command: "journal"
    args: [
      "wait",
      "--event",
      "flow.completed",
      "--event",
      "flow.failed",
      "--since-rowid",
      "$JOURNAL_BASELINE",
      "--timeout",
      "120",
    ]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "assert-flow-completed"
    type: "journal-assert"
    action_type: "flow.completed"
    trace_scoped: true
    output_criteria:
      - id: "flow-completed"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-dynamic-step-completed"
    type: "journal-assert"
    action_type: "flow.step.completed"
    trace_scoped: true
    payload_equals:
      - path: "stepId"
        value: "explore"
    output_criteria:
      - id: "dynamic-step-completed"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-two-native-tool-rounds"
    type: "journal-assert"
    action_type: "dynamic_tool_call"
    trace_scoped: true
    expect_count: 2
    output_criteria:
      - id: "two-dynamic-tool-calls"
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
