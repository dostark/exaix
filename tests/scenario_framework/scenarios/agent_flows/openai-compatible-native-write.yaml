schema_version: "1.0.0"
id: "openai-compatible-native-write"
title: "Phase 155 — portal change through the configured OpenAI-compatible local route"
pack: "agent_flows"
tags: ["safety-gate", "manual-only", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/openai_compatible_native_write.md"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
bindings:
  default:
    service: "compat-fixture"
    model: "openai-chat/compat-fixture-v1"
pin:
  - selector: default
    fields: [service, model]
    reason: wire-compat-regression
    note: "The wire format this fixture asserts is qualified for this model, so an operator override would change what the fixture measures."
matrix:
  cells:
    - tool: "compat-fixture"
      provider: "openai-chat"
      config: "tests/scenario_framework/fixtures/phase155/local-compatible.toml"
      requires_bin: "deno"
      requires_key: "EXA_COMPAT_TEST_API_KEY"
steps:
  - id: "write-compat-agent"
    type: "write-file"
    path: "Blueprints/Agents/compat-agent.md"
    content: |
      ---
      agent_role: "compat-agent"
      name: "Compatible ReAct Agent"
      model: "openai-chat:compat-fixture-v1"
      model_size: M
      characteristics: [fastest]
      capabilities: ["react"]
      created: "2026-09-27T00:00:00Z"
      created_by: "scenario-framework"
      version: "1.0.0"
      description: "Local compatible provider scenario agent"
      default_skills: []
      permitted_tools: ["read_file", "write_file"]
      ---
      Write the requested file and return the result.

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app", "--agent-role", "compat-agent"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    failure_glob: "Workspace/Rejected/*_rejected.md"

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-execution"
    type: "exactl"
    command: "journal"
    args: [
      "wait",
      "--event",
      "execution.completed",
      "--event",
      "execution.failed",
      "--since-rowid",
      "$JOURNAL_BASELINE",
      "--timeout",
      "120",
    ]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "assert-execution-completed"
    type: "journal-assert"
    action_type: "execution.completed"
    trace_scoped: true
    output_criteria:
      - id: "execution-completed"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-no-execution-failure"
    type: "journal-assert"
    action_type: "execution.failed"
    trace_scoped: true
    expect_count: 0
    output_criteria:
      - id: "no-execution-failure"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-native-tool-call"
    type: "journal-assert"
    action_type: "dynamic_tool_call"
    trace_scoped: true
    payload_equals:
      - path: "tool"
        value: "write_file"
    output_criteria:
      - id: "native-tool-called"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-configured-provider-model"
    type: "journal-assert"
    action_type: "llm.call.completed"
    trace_scoped: true
    payload_equals:
      - path: "model"
        value: "compat-fixture-v1"
      - path: "cost_status"
        value: "unknown"
    output_criteria:
      - id: "configured-provider-used"
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
