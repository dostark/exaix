schema_version: "1.0.0"
id: lint-error-compatibility
title: Error input and recovery through a Solo daemon
pack: agent_flows
tags: ["subsystem:flows", "safety-gate"]
request_fixture: fixtures/requests/agent_flows/lint_error_compatibility.md
flow_fixture: fixtures/flows/lint-error-compatibility.flow.yaml
mode_support: ["auto"]
portals: []
workspace_config:
  quality_gate.enabled: false
  request_analysis.enabled: false
  ai.mock.fixtures_dir: "$FRAMEWORK_HOME/fixtures/mock_recordings/phase230"
steps:
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
    env: { EXA_LLM_PROVIDER: mock, MOCK_STRICT: "1", EXA_CI_MODE: "1" }
    output_criteria:
      - { id: daemon-started, kind: command-output-contains, contains: [daemon.started] }
  - id: submit-retry-failure
    type: exactl
    command: request
    args: [--file, "$REQUEST_FIXTURE"]
    env: { EXA_RECORDING_LANES: "1" }
    output_criteria:
      - { id: retry-submitted, kind: command-exit-code, equals: 0 }
  - id: await-retry-failure
    type: exactl
    command: journal
    args: [wait, --event, request.failed, --since-rowid, "$STEP_BASELINE", --timeout, "30"]
    timeout_sec: 35
    output_criteria:
      - { id: retry-failed, kind: command-exit-code, equals: 0 }
  - id: verify-retry
    type: journal-assert
    action_type: flow.step.retry
    trace_scoped: true
    expect_count: 1
  - id: verify-step-failure
    type: journal-assert
    action_type: flow.step.failed
    trace_scoped: true
    expect_count: 1
  - id: verify-request-failure
    type: journal-assert
    action_type: request.failed
    trace_scoped: true
    expect_count: 1
  - id: verify-retry-request-status
    type: file-contains
    file_pattern: "Workspace/Requests/request-*.md"
    output_criteria:
      - { id: retry-status-failed, kind: text-contains, contains: "status: failed" }
  - id: submit-malformed
    type: exactl
    command: request
    args: [--file, "$REQUEST_FIXTURE"]
    env: { EXA_RECORDING_LANES: "1" }
    output_criteria:
      - { id: malformed-submitted, kind: command-exit-code, equals: 0 }
  - id: await-rejection
    type: exactl
    command: journal
    args: [wait, --event, request.failed, --since-rowid, "$STEP_BASELINE", --timeout, "30"]
    timeout_sec: 35
    output_criteria:
      - { id: rejected, kind: command-exit-code, equals: 0 }
  - id: verify-rejected-artifact
    type: file-contains
    file_pattern: "Workspace/Rejected/*_rejected.md"
    output_criteria:
      - { id: malformed-content, kind: text-contains, contains: "malformed compatibility output" }
      - { id: rejected-status, kind: text-contains, contains: "status: rejected" }
      - id: artifact-identity
        kind: text-matches
        matches: ['trace_id: "([0-9a-f]{8})[0-9a-f-]{28}"[\s\S]*request_id: "request-\1"']
  - id: verify-rejected-event
    type: journal-assert
    action_type: request.failed
    payload_contains: ["Invalid JSON"]
    expect_count: 1
  - id: verify-artifact-event
    type: journal-assert
    action_type: plan.saved_rejected
    expect_count: 1
  - id: verify-rejected-request-status
    type: file-contains
    file_pattern: "Workspace/Requests/request-*.md"
    output_criteria:
      - { id: rejected-request-failed, kind: text-contains, contains: "status: failed" }
      - { id: rejected-path-recorded, kind: text-contains, contains: "rejected_path:" }
      - id: rejected-request-identity
        kind: text-matches
        matches: [
          'trace_id: "([0-9a-f]{8})[0-9a-f-]{28}"[\s\S]*rejected_path: "Workspace/Rejected/request-\1_rejected.md"',
        ]
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
    output_criteria:
      - { id: stopped, kind: command-exit-code, equals: 0 }
