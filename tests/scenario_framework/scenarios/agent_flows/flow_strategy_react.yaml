schema_version: "1.0.0"
id: "flow-strategy-react"
title: "A flow step forcing strategy: react executes against a real live provider"
pack: "agent_flows"
tags: ["subsystem:flows", "provider-live", "entity:strategy-comparison-react.flow"]
request_fixture: "fixtures/requests/agent_flows/strategy_comparison_react.md"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
matrix:
  cells:
    - tool: "opencode"
      provider: "opencode-cli"
      config: "configs/opencode-no-delegate.toml"
      requires_bin: "opencode"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  # NOTE: this scenario proves strategy DISPATCH (the forced `strategy: react` step reaches
  # ReActLoopStrategy and calls a real live provider), not that the ReAct loop's task succeeds.
  # A live small model can emit a <thought> with no parseable <action>, which the ReAct loop
  # correctly treats as a hard failure ("No actions generated in ReAct iteration") rather than
  # silently completing — so waiting on `flow.completed` here would time out on a legitimate,
  # already-terminal failure. `flow.step.started` fires immediately and always carries the
  # `strategy` field (packages/flow/src/flow_runner.ts), which is what this scenario asserts.
  - id: "wait-for-step-started"
    type: "wait-for-journal-event"
    event_type: "flow.step.started"
    timeout_sec: 30
    input_criteria: []
    output_criteria:
      - id: "step-started"
        kind: "journal-event-exists"
        event_type: "flow.step.started"
        score_weight: 0.4

  - id: "assert-strategy-in-journal"
    type: "journal-assert"
    args: [
      "SELECT 1 WHERE EXISTS (SELECT 1 FROM activity WHERE action_type = 'flow.step.started' AND payload LIKE '%\"stepId\":\"react-step\"%' AND payload LIKE '%\"strategy\":\"react\"%')",
    ]
    output_criteria:
      - id: "strategy-honored"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "wait-for-generation"
    type: "wait-for-journal-event"
    event_type: "agent.generation_completed"
    timeout_sec: 60
    input_criteria: []
    output_criteria: []

  - id: "report-usage-metrics"
    type: "journal-assert"
    args: [
      "SELECT 1 WHERE (SELECT payload FROM activity WHERE action_type = 'agent.generation_completed' ORDER BY rowid DESC LIMIT 1) LIKE '%prompt_tokens%'",
    ]
    output_criteria:
      - id: "usage-metrics-recorded"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  # Informational only (always passes): the flow's own terminal outcome (converged on a valid
  # action, or the "No actions generated" failure mode) is reported for the comparison doc
  # without gating the scenario's pass/fail on a live model's reliability. The bounded poll is a
  # wait-for-journal-event on flow.completed/flow.failed; exit is not gated.
  - id: "report-flow-outcome"
    type: "wait-for-journal-event"
    event_type: "flow.completed"
    timeout_sec: 60
    input_criteria: []
    output_criteria:
      - id: "flow-outcome-reported"
        kind: "journal-event-exists"
        event_type: "flow.completed"
        score_weight: 0.0
