schema_version: "1.0.0"
id: "flow-strategy-react"
title: "A flow step forcing strategy: react executes against a real live provider"
pack: "agent_flows"
tags: ["subsystem:flows", "provider-live"]
request_fixture: "fixtures/requests/agent_flows/strategy_comparison_react.md"
flow_fixture: "fixtures/flows/strategy_routing/strategy_comparison_react.flow.yaml"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
matrix:
  cells:
    - tool: "opencode"
      provider: "opencode-cli"
      config: "configs/opencode-no-delegate.toml"
      requires_bin: "opencode"
    - tool: "codex"
      provider: "codex-cli"
      config: "configs/codex-cli-react.toml"
      requires_bin: "codex"
      requires_optin: "EXA_MATRIX_CODEX"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  # This scenario proves strategy dispatch (the forced `strategy: react` step reaches ReActLoopStrategy and calls a live provider), not that the ReAct task succeeds.
  # A small live model can emit a thought with no parseable action, which the loop treats as a hard failure, so waiting on `flow.completed` could time out on a legitimate failure.
  # `flow.step.started` always carries the `strategy` field (packages/flow/src/flow_runner.ts), and the scenario asserts that.
  - id: "wait-for-step-started"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "flow.step.started", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria:
      - id: "step-started"
        kind: "journal-event-exists"
        event_type: "flow.step.started"
        score_weight: 0.4

  - id: "assert-strategy-in-journal"
    type: "journal-assert"
    action_type: "flow.step.started"
    trace_scoped: true
    payload_equals:
      - path: "stepId"
        value: "react-step"
      - path: "strategy"
        value: "react"
    output_criteria:
      - id: "strategy-honored"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "wait-for-generation"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "agent.generation_completed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "60"]
    timeout_sec: 60
    input_criteria: []
    output_criteria: []

  - id: "report-usage-metrics"
    type: "journal-assert"
    action_type: "agent.generation_completed"
    expect_contains: ["prompt_tokens"]
    output_criteria:
      - id: "usage-metrics-recorded"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "assert-codex-generation"
    type: "journal-assert"
    cells: ["codex"]
    action_type: "agent.generation_completed"
    trace_scoped: true
    payload_equals:
      - path: "provider"
        value: "codex"
      - path: "model"
        value: "gpt-5.6-terra"
    expect_sum:
      path: "prompt_tokens"
      gt: 0
    output_criteria:
      - id: "codex-generation-honored"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  # Informational only (always passes): the flow's terminal outcome is reported for the comparison doc without gating on a live model's reliability.
  # `journal wait` takes repeatable --event with OR semantics, so this resolves on whichever of flow.completed or flow.failed appears first.
  # The terminal event varies across live runs, so the exit is not gated.
  - id: "report-flow-outcome"
    type: "exactl"
    command: "journal"
    args: [
      "wait",
      "--event",
      "flow.completed",
      "--event",
      "flow.failed",
      "--since-rowid",
      "$JOURNAL_BASELINE",
      "--timeout",
      "30",
    ]
    timeout_sec: 90
    continue_on_failure: true
    input_criteria: []
    output_criteria: []
