schema_version: "1.0.0"
id: "edition-smoke"
title: "Edition-aware smoke — the daemon resolves a model through the edition's registry"
pack: "agent_flows"
tags: ["smoke", "edition", "subsystem:flows"]
edition: "team"
request_fixture: "fixtures/requests/agent_flows/edition_smoke.md"
mode_support: ["auto"]
portals: []
# The registry is observed through the daemon, not the CLI. `models list` always prints "Model Registry (Solo floor)", because the CLI process holds only the Solo floor, so it cannot tell editions apart.
# The daemon resolves through ModelRegistryService and journals `model.resolved` with the candidate provider set, which is the edition-sensitive observable.
# Not verified on Solo: the scenario is edition-gated and skipped there.
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        score_weight: 0.4
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"

  - id: "assert-registry-resolved"
    type: "journal-assert"
    name: "The daemon journalled a model resolution with a candidate provider set"
    action_type: "model.resolved"
    latest_only: true
    project:
      selected: "payload.selected"
      candidate_providers: "payload.candidate_providers"
    output_criteria:
      - id: "model-resolved"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].selected"
        not_empty: true
      - id: "registry-supplied-candidates"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].candidate_providers"
        not_empty: true

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
