schema_version: "1.0.0"
id: "execution-verification-repair"
title: "Post-execution verification runs after a committed plan and journals its outcome"
pack: "agent_flows"
tags: ["safety-gate"]
request_fixture: "fixtures/requests/agent_flows/execution_verification_repair.md"
mode_support: ["auto"]
portals:
  - alias: "verify-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/verify-app"
    git_init: true
    verification:
      checks:
        - kind: "deno_task"
          task: "test"
          path: "checked_test.ts"
          args: ["--no-check"]
      max_repair_attempts: 0
      check_timeout_ms: 20000
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.2
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "inject-approved-plan"
    type: "write-file"
    name: "Write an approved plan whose action commits a passing test"
    path: "Workspace/Active/execution-verification-repair_plan.md"
    content: |
      ---
      trace_id: "execution-verification-repair-trace"
      request_id: "execution-verification-repair"
      status: approved
      portal: verify-app
      ---

      # Verification wiring plan

      ```toml
      tool = "write_file"
      description = "write a passing test into the portal worktree"

      [params]
      path = "checked_test.ts"
      content = """
      Deno.test("ok", () => { if (1 !== 1) throw new Error("no"); });
      """
      ```
    output_criteria:
      - id: "plan-injected"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-execution"
    type: "wait-for-file"
    args: ["**/Archive/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "execution-completed"
        score_weight: 0.2
        kind: "file-found"
        path_pattern: "**/Archive/*_plan.md"

  - id: "wait-for-verification"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "execution.verification.passed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "60"]
    timeout_sec: 90
    output_criteria:
      - id: "verification-passed"
        class: "security"
        score_weight: 0.3
        kind: "command-exit-code"
        equals: 0

  - id: "assert-not-exhausted"
    type: "journal-assert"
    action_type: "execution.verification.exhausted"
    trace_scoped: false
    expect_count: 0
    output_criteria:
      - id: "verification-not-exhausted"
        class: "security"
        score_weight: 0.3
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
