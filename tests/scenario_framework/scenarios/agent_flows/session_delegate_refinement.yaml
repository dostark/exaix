schema_version: "1.0.0"
id: "session-delegate-refinement"
title: "Session Delegation — Refinement Gate"
pack: "agent_flows"
tags: ["safety-gate", "session-delegation"]
request_fixture: "fixtures/requests/agent_flows/quality_gate_clarification.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args: ["run", "-A", "--config", "$FRAMEWORK_HOME/../../deno.json", "$FRAMEWORK_HOME/../../scripts/setup_db.ts"]
    output_criteria:
      - id: "setup-done"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "build-mock-tool"
    type: "shell"
    command: "deno"
    args: [
      "run",
      "-A",
      "--config",
      "$FRAMEWORK_HOME/../../deno.json",
      "scripts/build_mock_session_tool.sh",
      "$FRAMEWORK_HOME/../../.cache/mock_session_tool_bin",
    ]
    output_criteria:
      - id: "build-done"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_BIN_OVERRIDES: "$FRAMEWORK_HOME/../../.cache/mock_session_tool_bin"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-underspecified-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-clarification"
    type: "wait-for-file"
    args: ["**/Clarifications/*.json"]
    timeout_sec: 120
    output_criteria:
      - id: "clarification-created"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Clarifications/*.json"

  - id: "verify-delegated-clarification"
    type: "exactl"
    command: "request"
    args: ["show", "--all"]
    output_criteria:
      - id: "clarification-present"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["user-confirmed"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
