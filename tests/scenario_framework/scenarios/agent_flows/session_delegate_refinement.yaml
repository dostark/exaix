schema_version: "1.0.0"
id: "session-delegate-refinement"
title: "Session Delegation — Refinement Gate"
pack: "agent_flows"
tags: ["safety-gate", "session-delegation", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/quality_gate_clarification.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "build-mock-tool"
    type: "run-script"
    # Native-Deno build helper (scripts/build_mock_session_tool.ts) compiles
    # mock_session_tool.ts and moves the binary — replacing the previous raw `bash`
    # invocation of the shell build script with the framework's native layer.
    command: "deno"
    args: [
      "run",
      "-A",
      "$REPO_ROOT/scripts/build_mock_session_tool.ts",
      "$REPO_ROOT/.cache/mock_session_tool_bin",
    ]
    output_criteria:
      - id: "build-done"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_BIN_OVERRIDES: "$REPO_ROOT/.cache/mock_session_tool_bin"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-underspecified-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-clarification"
    type: "wait-for-file"
    args: ["**/Clarifications/*.json"]
    timeout_sec: 120
    output_criteria:
      - id: "clarification-created"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Clarifications/*.json"

  # The clarification file exists as soon as the gate opens, but its status becomes `user-confirmed` only when the delegate's answer is reconciled back.
  # The preceding wait gates on existence, so this barrier waits for the reconcile itself.
  - id: "wait-for-delegate-reconciled"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "session.delegate.reconciled", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "60"]
    timeout_sec: 60
    output_criteria:
      - id: "delegate-reconciled"
        kind: "journal-event-exists"
        event_type: "session.delegate.reconciled"
        score_weight: 1.0

  - id: "verify-delegated-clarification"
    type: "exactl"
    # Asserts the clarification record, not CLI output. The delegated confirmation is state and lives in the clarification session file as `status: user-confirmed`,
    # so asserting it there is what makes this step mean the gate ran.
    command: "request"
    args: ["list"]
    # The clarification file is named for the request's UUID, so the target is resolved by
    # pattern rather than by a literal path.
    file_pattern: "Workspace/Clarifications/*.json"
    output_criteria:
      - id: "clarification-confirmed"
        score_weight: 0.5
        kind: "json-path-equals"
        path: "$.status"
        equals: "user-confirmed"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
