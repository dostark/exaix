schema_version: "1.0.0"
id: "session-delegate-refinement"
title: "Session Delegation — Refinement Gate"
pack: "agent_flows"
tags: ["safety-gate", "session-delegation", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/quality_gate_clarification.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "build-mock-tool"
    type: "shell"
    # bash, not `deno run`: the target is a Bourne-Again shell script (#!/bin/bash), so deno
    # parsed it as TypeScript and failed with "Expected ';', '}' or <eof>". The path also
    # needed the $FRAMEWORK_HOME prefix every sibling argument already used — bare
    # `scripts/...` resolved against the sandbox, where the repo's scripts do not exist.
    command: "bash"
    args: [
      "$FRAMEWORK_HOME/../../scripts/build_mock_session_tool.sh",
      "$FRAMEWORK_HOME/../../.cache/mock_session_tool_bin",
    ]
    output_criteria:
      - id: "build-done"
        score_weight: 0.5
        kind: "command-exit-code"
        equals: 0

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
      EXA_SESSION_DELEGATE_ENABLED: "true"
      EXA_SESSION_DELEGATE_BIN_OVERRIDES: "$FRAMEWORK_HOME/../../.cache/mock_session_tool_bin"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-underspecified-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-clarification"
    type: "wait-for-file"
    args: ["**/Clarifications/*.json"]
    timeout_sec: 120
    output_criteria:
      - id: "clarification-created"
        score_weight: 0.5
        kind: "file-found"
        path_pattern: "**/Clarifications/*.json"

  - id: "verify-delegated-clarification"
    type: "exactl"
    # Asserts the clarification RECORD, not CLI output. This checked `request show --all` for
    # the text "user-confirmed" — a flag that does not exist (`show` takes a required <id>, so
    # the CLI read it as a request id), and `request list` does not carry the marker either. The
    # delegated confirmation is state, and it lives in the clarification session file as
    # `status: user-confirmed`; asserting it there is what makes this step mean the gate ran.
    command: "request"
    args: ["list"]
    # The clarification file is named for the request's UUID, so the target is resolved by
    # pattern rather than by a literal path.
    file_pattern: "**/Clarifications/*.json"
    output_criteria:
      - id: "clarification-confirmed"
        score_weight: 0.5
        kind: "json-path-equals"
        path: "status"
        equals: "user-confirmed"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
