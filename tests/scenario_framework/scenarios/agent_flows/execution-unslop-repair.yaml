schema_version: "1.0.0"
id: "execution-unslop-repair"
title: "Post-execution unslop repair succeeds"
pack: "agent_flows"
tags: ["safety-gate"]
request_fixture: "fixtures/requests/agent_flows/execution_unslop_repair.md"
mode_support: ["auto"]
unslop_assets: true
portals:
  - alias: "verify-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/verify-app"
    git_init: true
    verification:
      checks:
        - kind: "unslop"
      max_repair_attempts: 1
      check_timeout_ms: 20000
steps:
  # The repair step runs natively under this agent. Its ReAct prompt opens with the agent
  # role name, which the committed fixture execution-unslop-repair__repair-step.json matches
  # to replay the rewrite that removes the chained cast. The name is distinct from the
  # exhausted scenario's so one fixture set cannot answer the other's repair prompt.
  - id: "write-repair-agent"
    type: "write-file"
    name: "Write the unslop repair agent blueprint"
    path: "Blueprints/Agents/verification-unslop-coder.md"
    content: |
      ---
      agent_role: "verification-unslop-coder"
      name: "Verification Unslop Repair Coder"
      model: "mock:test"
      capabilities: ["read_file", "write_file"]
      created: "2026-10-24T00:00:00Z"
      created_by: "test"
      version: "1.0.0"
      ---

      # Verification Unslop Repair Coder
    output_criteria:
      - id: "agent-written"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.1
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "inject-approved-plan"
    type: "write-file"
    name: "Write an approved plan that adds a chained type assertion"
    path: "Workspace/Active/execution-unslop-repair_plan.md"
    content: |
      ---
      trace_id: "22900000-0000-4000-8000-000000000229"
      request_id: "execution-unslop-repair"
      status: approved
      portal: verify-app
      agent_role: verification-unslop-coder
      ---

      # Unslop plan

      ```toml
      tool = "write_file"
      description = "write a seed with a chained cast"

      [params]
      path = "seed.ts"
      content = """
      export const seed = 1 as unknown as string;
      """
      ```
    output_criteria:
      - id: "plan-injected"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-execution"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "execution.completed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 150
    output_criteria:
      - id: "execution-completed"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  # An injected plan emits no request.created, so trace_scoped has nothing to resolve.
  # Every verification event carries the plan's request_id, which scopes them instead.
  - id: "assert-first-attempt-failed"
    type: "journal-assert"
    action_type: "execution.verification.failed"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-repair"
      - path: "attempt"
        value: 0
    expect_count: 1
    output_criteria:
      - id: "seed-failed-the-real-check"
        class: "security"
        score_weight: 0.3
        kind: "command-exit-code"
        equals: 0

  - id: "assert-one-repair"
    type: "journal-assert"
    action_type: "execution.repair.completed"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-repair"
    payload_contains: ["seed.ts"]
    expect_count: 1
    output_criteria:
      - id: "repair-changed-the-seed"
        class: "security"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  - id: "assert-repaired"
    type: "journal-assert"
    action_type: "execution.completed"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-repair"
      - path: "verification_status"
        value: "repaired"
    expect_count: 1
    output_criteria:
      - id: "verification-repaired"
        class: "security"
        score_weight: 0.3
        kind: "command-exit-code"
        equals: 0

  - id: "assert-clean-snapshot"
    type: "journal-assert"
    action_type: "execution.verification.lint_findings"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-repair"
      - path: "verification_status"
        value: "repaired"
      - path: "total"
        value: 0
    expect_count: 1
    output_criteria:
      - id: "terminal-snapshot-is-clean"
        class: "security"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  - id: "assert-not-exhausted"
    type: "journal-assert"
    action_type: "execution.verification.exhausted"
    payload_equals:
      - path: "request_id"
        value: "execution-unslop-repair"
    expect_count: 0
    output_criteria:
      - id: "verification-not-exhausted"
        class: "security"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  # The reviewer view must agree with the journal: the same run id and commit, no old finding.
  - id: "review-show"
    type: "exactl"
    command: "review"
    args: ["show", "feat/execution-unslop-repair-22900000"]
    output_criteria:
      - id: "review-shows-repaired"
        class: "security"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["verification: repaired", "unslop: no findings remain"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
