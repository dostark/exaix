schema_version: "1.0.0"
id: "flowrunner-execution"
title: "FlowRunner executes flow request and produces a plan"
pack: "agent_flows"
tags: ["smoke", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/flowrunner_execution.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 1.0
