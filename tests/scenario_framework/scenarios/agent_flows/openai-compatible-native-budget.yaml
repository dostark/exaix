schema_version: "1.0.0"
id: "openai-compatible-native-budget"
title: "Phase 155 — an oversized native conversation fails the token ceiling before generation"
pack: "agent_flows"
tags: ["safety-gate", "manual-only", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/openai_compatible_native.md"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
bindings:
  default:
    service: "compat-fixture"
    model: "openai-chat/compat-fixture-v1"
pin:
  - selector: default
    fields: [service, model]
    reason: wire-compat-regression
    note: "The wire format this fixture asserts is qualified for this model, so an operator override would change what the fixture measures."
matrix:
  cells:
    - tool: "compat-fixture"
      provider: "openai-chat"
      config: "tests/scenario_framework/fixtures/phase155/local-compatible-budget.toml"
      requires_bin: "deno"
      requires_key: "EXA_COMPAT_TEST_API_KEY"
steps:
  - id: "write-compat-agent"
    type: "write-file"
    path: "Blueprints/Agents/compat-agent.md"
    content: |
      ---
      agent_role: "compat-agent"
      name: "Compatible ReAct Agent"
      model: "openai-chat:compat-fixture-v1"
      model_size: M
      characteristics: [fastest]
      capabilities: ["react"]
      created: "2026-09-27T00:00:00Z"
      created_by: "scenario-framework"
      version: "1.0.0"
      description: "Local compatible provider scenario agent"
      default_skills: []
      permitted_tools: ["read_file"]
      ---
      Read the requested file and return the result.

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    failure_glob: "Workspace/Rejected/*_rejected.md"

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-execution"
    type: "exactl"
    command: "journal"
    args: [
      "wait",
      "--event",
      "execution.completed",
      "--event",
      "execution.failed",
      "--since-rowid",
      "$JOURNAL_BASELINE",
      "--timeout",
      "120",
    ]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "assert-execution-failed"
    type: "journal-assert"
    action_type: "execution.failed"
    trace_scoped: true
    output_criteria:
      - id: "execution-failed-terminal"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-budget-exceeded"
    type: "journal-assert"
    action_type: "context.budget.exceeded"
    trace_scoped: true
    output_criteria:
      - id: "budget-exceeded-journaled"
        kind: "command-exit-code"
        equals: 0

  - id: "assert-only-first-tool-executed"
    type: "journal-assert"
    action_type: "dynamic_tool_call"
    trace_scoped: true
    output_criteria:
      - id: "only-first-tool-executed"
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
