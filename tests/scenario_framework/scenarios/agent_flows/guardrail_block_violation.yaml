schema_version: "1.0.0"
id: "guardrail-block-violation"
title: "Guardrail screens a policy violation and journals it"
pack: "agent_flows"
# Provider-live, and not passing there yet. With the guardrail enabled the daemon journals `guardrail.initialized` and then nothing.
# `GuardrailConfigSchema.policies` defaults to `[]`, and each policy names a blueprint that a model evaluates, so a violation verdict needs a real provider and a policy blueprint. The repository ships neither.
# It stays tagged as the record of that gap.
tags: ["safety-gate", "subsystem:flows", "provider-live"]
edition: "team"
request_fixture: "fixtures/requests/agent_flows/guardrail_block_violation.md"
mode_support: ["auto"]
portals: []
# The guardrail has no CLI surface. Config enables it (`guardrail.enabled`, default false, edition-gated per `EDITION_GATED_PATHS`) and the journal shows it:
# `guardrail.screen.pass`, `guardrail.screen.violation` and `guardrail.screen.error` (`domain_event_types.ts`). This asserts that the screen ran and recorded a verdict.
# Not verified on Solo: edition-gated and skipped there.
steps:
  - id: "enable-guardrail"
    type: "write-file"
    name: "Turn the guardrail on for this sandbox"
    path: "exa.config.toml"
    content: "\n[guardrail]\nenabled = true\n"
    append: true
    output_criteria:
      - id: "guardrail-enabled"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-violating-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-guardrail-verdict"
    type: "exactl"
    name: "The guardrail screens the request and records a verdict"
    # This waits on the journal, not on `**/Plans/*_plan.md`, because a blocked request never produces a plan: no plan is the point of a guardrail block.
    command: "journal"
    args: ["wait", "--event", "guardrail.screen.violation", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "120"]
    timeout_sec: 120
    input_criteria: []
    output_criteria: []

  - id: "assert-guardrail-screened"
    type: "journal-assert"
    name: "The guardrail recorded a verdict for this run"
    action_type_prefix: "guardrail."
    project:
      action_type: "action_type"
    output_criteria:
      - id: "guardrail-ran"
        score_weight: 0.6
        kind: "json-query"
        query: "length"
        min: 1
      - id: "violation-recorded"
        score_weight: 0.6
        kind: "json-query"
        query: ".[].action_type"
        contains: ["guardrail.screen.violation"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
