schema_version: "1.0.0"
id: branch-routing
title: Branch routing through a Solo daemon
pack: agent_flows
tags: ["subsystem:flows", "branch-routing"]
request_fixture: fixtures/requests/agent_flows/branch_routing.md
flow_fixture: fixtures/flows/branches/routing.flow.yaml
mode_support: ["auto"]
portals: []
workspace_config:
  quality_gate.enabled: false
  request_analysis.enabled: false
  ai.mock.fixtures_dir: "$FRAMEWORK_HOME/fixtures/mock_recordings/phase205/branches"
steps:
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
    env:
      EXA_LLM_PROVIDER: mock
      MOCK_STRICT: "1"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: daemon-started
        kind: command-output-contains
        contains: [daemon.started]
  - id: submit
    type: exactl
    command: request
    args: [create, --file, "$REQUEST_FIXTURE"]
    env: { EXA_RECORDING_LANES: "1" }
    output_criteria:
      - id: submitted
        kind: command-exit-code
        equals: 0
  - id: await-terminal
    type: exactl
    command: log
    args: [wait, --event, request.planned, --since-rowid, "$STEP_BASELINE", --timeout, "30"]
    timeout_sec: 35
    output_criteria:
      - id: terminal-event
        kind: command-exit-code
        equals: 0
  - id: assert-branch-chose-bug
    type: journal-assert
    action_type: flow.branch.decided
    trace_scoped: true
    payload_equals:
      - path: chosen
        value: bug
    output_criteria:
      - id: branch-chose-bug
        kind: command-exit-code
        equals: 0
  - id: assert-untaken-branch-skipped
    type: journal-assert
    action_type: flow.step.skipped
    trace_scoped: true
    payload_equals:
      - path: stepId
        value: feature
      - path: skipCode
        value: branch_not_taken
    output_criteria:
      - id: feature-branch-skipped
        kind: command-exit-code
        equals: 0
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
    output_criteria:
      - id: stopped
        kind: command-exit-code
        equals: 0
