schema_version: "1.0.0"
id: "flow-strategy-cli-delegate"
title: "A flow step forcing strategy: cli_delegate executes against the real headless CLI"
pack: "agent_flows"
tags: ["subsystem:flows", "provider-live", "entity:strategy-comparison-cli-delegate.flow"]
request_fixture: "fixtures/requests/agent_flows/strategy_comparison_cli_delegate.md"
mode_support: ["auto"]
portals:
  - alias: "todo-app"
    source_path: "$FRAMEWORK_HOME/fixtures/portals/todo_app"
    target_path: "$WORKSPACE_ROOT/todo-app"
    git_init: true
matrix:
  cells:
    - tool: "opencode"
      provider: "opencode-cli"
      config: "configs/opencode-cli-delegate-all.toml"
      requires_bin: "opencode"
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/todo-app", "todo-app"]
    output_criteria:
      - id: "portal-added"
        kind: "command-exit-code"
        equals: 0

  - id: "restart-daemon"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "todo-app"]
    output_criteria:
      - id: "request-submitted"
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-flow-completed"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "flow.completed", "--since-rowid", "$JOURNAL_BASELINE", "--timeout", "280"]
    timeout_sec: 280
    input_criteria: []
    output_criteria:
      - id: "flow-completed"
        kind: "journal-event-exists"
        event_type: "flow.completed"
        score_weight: 0.4

  - id: "assert-strategy-in-journal"
    type: "journal-assert"
    action_type: "flow.step.completed"
    payload_contains:
      - '"stepId":"delegate-step"'
      - '"strategy":"cli_delegate"'
    output_criteria:
      - id: "strategy-honored"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "report-usage-metrics"
    type: "journal-assert"
    action_type: "agent.execution_completed"
    expect_contains: ["prompt_tokens"]
    output_criteria:
      - id: "usage-metrics-recorded"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3
