schema_version: "1.0.0"
id: "plan-amendment-lifecycle"
title: "Plan Amendment Lifecycle"
pack: "agent_flows"
tags: ["safety-gate", "planning", "amendment", "subsystem:flows"]
request_fixture: "fixtures/requests/agent_flows/plan_amendment_trigger_drift.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "setup-db"
    type: "shell"
    command: "deno"
    args: ["run", "-A", "--config", "$FRAMEWORK_HOME/../../deno.json", "$FRAMEWORK_HOME/../../scripts/setup_db.ts"]
    output_criteria:
      - id: "setup-done"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "add-portal"
    type: "exactl"
    command: "portal"
    args: ["add", "$WORKSPACE_ROOT/fixtures/portals/simple_repo", "test-project"]
    output_criteria:
      - id: "portal-added"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"

  - id: "wait-for-daemon-ready"
    type: "wait-for-journal-event"
    event_type: "daemon.ready"
    timeout_sec: 30

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "test-project"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_LLM_MODEL: "amenment-test-model"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "wait-for-plan-file"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120

  - id: "wait-for-plan"
    type: "exactl"
    command: "plan"
    args: ["list"]
    output_criteria:
      - id: "plan-is-there"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request-", "_plan"]

  - id: "approve-plan"
    type: "exactl"
    command: "plan"
    args: ["approve-all"]
    output_criteria:
      - id: "plan-approved"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["approved"]

  - id: "wait-for-amendment-file"
    type: "wait-for-file"
    args: ["**/amendments/*.json"]
    timeout_sec: 60

  - id: "wait-for-amendment"
    type: "exactl"
    command: "plan"
    args: ["amendment", "list"]
    output_criteria:
      - id: "amendment-is-there"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["amendment_pending"]

  - id: "show-amendment"
    type: "exactl"
    command: "plan"
    args: ["amendment", "show-all"]
    output_criteria:
      - id: "amendment-diff-viz"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["Proposed Amendment", "Step"]

  - id: "approve-amendment"
    type: "exactl"
    command: "plan"
    args: ["amendment", "approve-all"]
    output_criteria:
      - id: "amendment-applied"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["Amendment approved"]

  - id: "wait-for-completion"
    type: "wait-for-file"
    args: ["**/Archive/*_plan.md"]
    timeout_sec: 60

  - id: "verify-completion"
    type: "exactl"
    command: "request"
    args: ["list", "--status", "completed", "--all"]
    output_criteria:
      - id: "execution-finished"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["completed"]

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        score_weight: 0.7
        kind: "command-output-contains"
        contains: ["daemon.stopped"]
