schema_version: "1.0.0"
id: "effort-auto-resolution"
title: "Phase 197 Step 7 — auto effort/thinking resolve to concrete journaled values in a real daemon run"
pack: "agent_flows"
tags: ["provider-live", "cost", "subsystem:request"]
request_fixture: "fixtures/requests/agent_flows/effort_flow_live.md"
mode_support: ["auto"]
portals: []

steps:
  # --- Heuristic leg: claude-cli (subscription-billed), --effort auto on a COMPLEX request.
  # TaskComplexity is PINNED deterministically by forcing the heuristic analyzer
  # (request_analysis.mode = heuristic): the long refactor prompt's content drives
  # COMPLEX, so effort must resolve to high. The leg is the scenario's FIRST request, so
  # trace_scope: current resolves to THIS request's trace. ---
  - id: "write-config-heuristic"
    type: "write-file"
    path: "exa.config.toml"
    content: |
      [system]
      root = "$WORKSPACE_ROOT"

      [paths]
      workspace = "Workspace"
      blueprints = "Blueprints"
      runtime = ".exa"
      memory = "Memory"
      portals = "Portals"

      [agents]
      default_model = "claude-cli-sonnet"

      [models."claude-cli-sonnet"]
      provider = "claude-cli"
      model = "sonnet"

      [request_analysis]
      enabled = true
      mode = "heuristic"

      [quality_gate]
      enabled = false

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    output_criteria:
      - id: "daemon-started"
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "wait-for-daemon-ready"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$STEP_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "request-effort-auto-heuristic"
    type: "exactl"
    command: "request"
    args: [
      "Refactor the authentication module: replace the session store, update the storage layer, change the API boundary contract, migrate the DB schema, adjust the client SDK, update the docs, run the migration, add regression tests, and coordinate the deployment across ten modules",
      "--agent-role",
      "senior-coder",
      "--effort",
      "auto",
    ]
    input_criteria: []
    output_criteria:
      - id: "request-exit-heuristic"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "wait-effort-heuristic"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "agent.effort_resolved", "--since-rowid", "$STEP_BASELINE", "--timeout", "300"]
    timeout_sec: 300
    input_criteria: []
    output_criteria:
      - id: "effort-waited-heuristic"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0
  - id: "journal-heuristic"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "journal-event-heuristic"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "agent.effort_resolved"
        trace_scope: "current"
        payload_equals:
          effort_basis: "heuristic"
          effort: "high"
          heuristic_inputs.complexity_source: "analysis"

  # --- Native-adaptive leg: Claude Code CLI with a subscription (not metered API), model
  # claude-sonnet-5, --thinking auto. EffortResolver's native-adaptive set includes CLAUDE_CLI
  # (verified: Claude Code runs adaptive by default on native-adaptive models), so
  # thinking_basis == "native-adaptive" is journaled and no thinking-disabling setting reaches
  # the CLI. This leg is NOT the first request, so trace_scope current does not apply; the
  # native-adaptive basis is a value NO other leg emits, so payload_equals alone is specific. ---
  - id: "write-config-native"
    type: "write-file"
    path: "exa.config.toml"
    content: |
      [system]
      root = "$WORKSPACE_ROOT"

      [paths]
      workspace = "Workspace"
      blueprints = "Blueprints"
      runtime = ".exa"
      memory = "Memory"
      portals = "Portals"

      [agents]
      default_model = "claude-cli-sonnet"

      [models."claude-cli-sonnet"]
      provider = "claude-cli"
      model = "claude-sonnet-5"

      [request_analysis]
      enabled = true
      mode = "heuristic"

      [quality_gate]
      enabled = false

  - id: "restart-daemon-native"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted-native"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready-native"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$STEP_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "request-thinking-auto-native"
    type: "exactl"
    command: "request"
    args: [
      "Refactor the authentication module: replace the session store, update the storage layer, change the API boundary contract, migrate the DB schema, adjust the client SDK, update the docs, run the migration, add regression tests, and coordinate the deployment across ten modules",
      "--agent-role",
      "senior-coder",
      "--thinking",
      "auto",
    ]
    input_criteria: []
    output_criteria:
      - id: "request-exit-native"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "wait-effort-native"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "agent.effort_resolved", "--since-rowid", "$STEP_BASELINE", "--timeout", "300"]
    timeout_sec: 300
    input_criteria: []
    output_criteria:
      - id: "effort-waited-native"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0
  - id: "journal-native"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "journal-event-native"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "agent.effort_resolved"
        payload_equals:
          thinking_basis: "native-adaptive"

  # --- Flow + judge floor leg: a self-contained fixture flow with two declared steps
  # (effort low / effort high, same role) and a quality-judge step whose blueprint declares
  # effort: low — the judge role floor raises it, so floors_applied contains
  # role:quality-judge. Path is flow_context and the two step efforts differ, which no other
  # leg emits, so payload_equals is leg-specific. ---
  - id: "write-config-flow"
    type: "write-file"
    path: "exa.config.toml"
    content: |
      [system]
      root = "$WORKSPACE_ROOT"

      [paths]
      workspace = "Workspace"
      blueprints = "Blueprints"
      runtime = ".exa"
      memory = "Memory"
      portals = "Portals"

      [agents]
      default_model = "claude-cli-sonnet"

      [models."claude-cli-sonnet"]
      provider = "claude-cli"
      model = "sonnet"

      [quality_gate]
      enabled = false

  - id: "write-flow-effort-live"
    type: "write-file"
    path: "Blueprints/Flows/effort-live.flow.yaml"
    content: |
      id: effort-live
      name: Effort Live
      description: Two declared steps with per-step effort plus a judge step
      version: "1.0.0"
      settings:
        maxParallelism: 1
        failFast: false
      steps:
        - id: analyze
          name: Analyze
          agent_role: senior-coder
          execution_mode: declared
          effort: low
          dependsOn: []
          input:
            source: request
            transform: passthrough
        - id: implement
          name: Implement
          agent_role: senior-coder
          execution_mode: declared
          effort: high
          dependsOn: [analyze]
          input:
            source: step
            stepId: analyze
        - id: judge
          name: Judge
          agent_role: quality-judge
          execution_mode: declared
          dependsOn: [implement]
          input:
            source: step
            stepId: implement
      output:
        from: judge
        format: markdown

  - id: "write-judge-blueprint-low"
    type: "write-file"
    path: "Blueprints/Agents/quality-judge.md"
    content: |
      ---
      agent_role: quality-judge
      name: Quality Judge
      effort: low
      ---
      You are a quality judge. Evaluate the deliverable against the acceptance criteria.

  - id: "restart-daemon-flow"
    type: "exactl"
    command: "daemon"
    args: ["restart"]
    output_criteria:
      - id: "daemon-restarted-flow"
        kind: "command-output-contains"
        contains: ["daemon.restarted"]

  - id: "wait-for-daemon-ready-flow"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "daemon.ready", "--since-rowid", "$STEP_BASELINE", "--timeout", "30"]
    timeout_sec: 30
    input_criteria: []
    output_criteria: []

  - id: "request-flow"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    input_criteria: []
    output_criteria:
      - id: "flow-request-exit"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "wait-flow-completed"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "flow.completed", "--since-rowid", "$STEP_BASELINE", "--timeout", "600"]
    timeout_sec: 600
    input_criteria: []
    output_criteria:
      - id: "flow-waited"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "journal-flow-analyze"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "flow-step-analyze-low"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "agent.effort_resolved"
        payload_equals:
          path: "flow_step"
          effort: "low"

  - id: "journal-flow-implement"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "flow-step-implement-high"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "agent.effort_resolved"
        payload_equals:
          path: "flow_step"
          effort: "high"

  - id: "journal-flow-judge"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "judge-role-floor"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "agent.effort_resolved"
        payload_includes:
          floors_applied: ["role:quality-judge"]

  # --- Skill-floor leg: a SIMPLE request pinned to the response-contract-security-analysis
  # skill with --effort auto resolves to low heuristically, then the skill's `effort: medium`
  # floor raises it — effort_basis skill-floor, effort medium, heuristic_inputs still present
  # (GAP-3), and the resolved_skill_ids passthrough lets the execution path apply the same
  # floor (GAP-5). ---
  - id: "request-effort-skill-floor"
    type: "exactl"
    command: "request"
    args: [
      "Fix the login handling on the endpoint.",
      "--agent-role",
      "senior-coder",
      "--effort",
      "auto",
      "--skills",
      "response-contract-security-analysis",
    ]
    input_criteria: []
    output_criteria:
      - id: "skill-request-exit"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "wait-effort-skill-floor"
    type: "exactl"
    command: "journal"
    args: ["wait", "--event", "agent.effort_resolved", "--since-rowid", "$STEP_BASELINE", "--timeout", "300"]
    timeout_sec: 300
    input_criteria: []
    output_criteria:
      - id: "skill-effort-waited"
        score_weight: 1.0
        kind: "command-exit-code"
        equals: 0

  - id: "journal-skill-floor"
    type: "journal-assert"
    input_criteria: []
    output_criteria:
      - id: "skill-floor-applied"
        score_weight: 1.0
        kind: "journal-event-exists"
        event_type: "agent.effort_resolved"
        payload_equals:
          effort_basis: "skill-floor"
          effort: "medium"
          heuristic_inputs.complexity_source: "analysis"
