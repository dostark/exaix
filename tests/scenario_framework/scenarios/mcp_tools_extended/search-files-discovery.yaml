schema_version: "1.0.0"
id: "search-files-discovery"
title: "Search files tool finds files by glob pattern"
pack: "mcp_tools_extended"
tags: ["search_files", "discovery", "read-tools", "subsystem:tools", "entity:search_files"]
request_fixture: "fixtures/requests/mcp_tools_extended/search_files_discovery.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-test-files"
    type: "shell"
    name: "Create test files with various extensions"
    command: "sh"
    args:
      - "-c"
      - "rm -rf /tmp/exaix-search-test && mkdir -p /tmp/exaix-search-test/src && touch /tmp/exaix-search-test/src/test1.test.ts /tmp/exaix-search-test/src/test2.test.ts /tmp/exaix-search-test/src/main.ts"
    input_criteria: []
    output_criteria:
      - id: "test-files-created"
        score_weight: 0.4
        kind: "file-exists"
        path: "/tmp/exaix-search-test/src/test1.test.ts"

  - id: "search-by-glob"
    type: "shell"
    name: "Discover files matching the *.test.ts glob"
    command: "sh"
    args:
      - "-c"
      - "find /tmp/exaix-search-test -name '*.test.ts' | sort"
    output_criteria:
      - id: "search-succeeded"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0
      - id: "matches-returned"
        score_weight: 0.6
        kind: "command-output-contains"
        contains: ["test1.test.ts", "test2.test.ts"]

  - id: "verify-glob-selectivity"
    type: "shell"
    name: "Verify the glob excludes non-matching files"
    command: "sh"
    args:
      - "-c"
      - "find /tmp/exaix-search-test -name '*.test.ts' | grep -c 'main.ts' && exit 1 || echo 'main.ts correctly excluded'"
    output_criteria:
      - id: "non-matches-excluded"
        score_weight: 0.6
        kind: "command-output-contains"
        contains: ["main.ts correctly excluded"]

  - id: "cleanup"
    type: "shell"
    name: "Clean up test directory"
    command: "rm"
    args: ["-rf", "/tmp/exaix-search-test"]
    input_criteria: []
    output_criteria: []
