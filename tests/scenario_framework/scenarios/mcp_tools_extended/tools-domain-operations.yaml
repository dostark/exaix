schema_version: "1.0.0"
id: "tools-domain-operations"
title: "Domain tools — request, plans, query journal operations"
pack: "mcp_tools_extended"
tags:
  - "domain"
  - "subsystem:tools"
  - "entity:exaix_create_request"
  - "entity:exaix_list_plans"
  - "entity:exaix_approve_plan"
  - "entity:exaix_query_journal"
request_fixture: "fixtures/requests/mcp_tools_extended/exaix_create_request.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.5
        kind: "command-output-contains"
        contains: ["request.created"]

  - id: "query-journal"
    type: "exactl"
    command: "journal"
    args: ["query", "--limit", "5"]
    output_criteria:
      - id: "journal-queried"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
