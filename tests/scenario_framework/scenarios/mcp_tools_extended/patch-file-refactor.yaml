schema_version: "1.0.0"
id: "patch-file-refactor"
title: "Patch file tool performs targeted refactoring"
pack: "mcp_tools_extended"
tags: ["patch_file", "refactoring", "write-tools", "subsystem:tools", "entity:patch_file"]
request_fixture: "fixtures/requests/mcp_tools_extended/patch_file_refactor.md"
mode_support: ["auto", "manual-checkpoint"]
portals: []
steps:
  - id: "setup-test-file"
    type: "shell"
    name: "Create test directory"
    command: "mkdir"
    args: ["-p", "/tmp/exaix-patch-refactor/src"]
    input_criteria: []
    output_criteria:
      - id: "dir-created"
        score_weight: 0.4
        kind: "dir-exists"
        path: "/tmp/exaix-patch-refactor/src"

  - id: "write-initial-file"
    type: "shell"
    name: "Write initial file content"
    command: "sh"
    args:
      - "-c"
      - "printf 'export function oldFunctionName() { return true; }\\nexport const keep = 1;\\n' > /tmp/exaix-patch-refactor/src/main.ts"
    input_criteria: []
    output_criteria:
      - id: "initial-file-written"
        score_weight: 0.4
        kind: "file-exists"
        path: "/tmp/exaix-patch-refactor/src/main.ts"

  - id: "apply-targeted-patch"
    type: "shell"
    name: "Replace only the target substring"
    command: "sh"
    args:
      - "-c"
      - "sed -i 's/oldFunctionName/newFunctionName/' /tmp/exaix-patch-refactor/src/main.ts"
    output_criteria:
      - id: "patch-applied"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "verify-patch"
    type: "shell"
    name: "Verify function was renamed and surrounding content preserved"
    command: "sh"
    args:
      - "-c"
      - "grep -q newFunctionName /tmp/exaix-patch-refactor/src/main.ts && ! grep -q oldFunctionName /tmp/exaix-patch-refactor/src/main.ts && grep -q 'export const keep = 1;' /tmp/exaix-patch-refactor/src/main.ts && cat /tmp/exaix-patch-refactor/src/main.ts"
    output_criteria:
      - id: "function-renamed"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0
      - id: "untouched-content-preserved"
        score_weight: 0.6
        kind: "command-output-contains"
        contains: ["newFunctionName", "export const keep = 1;"]

  - id: "cleanup"
    type: "shell"
    name: "Clean up test files"
    command: "rm"
    args: ["-rf", "/tmp/exaix-patch-refactor"]
    input_criteria: []
    output_criteria: []
