schema_version: "1.0.0"
# Asserts the exaix_config_* MCP tools themselves, including the approval gate on a
# dangerous-tier write. The previous version drove `exactl config` from the CLI — a
# different surface from the tools this scenario is tagged for.
id: "tools-config-operations"
title: "Config tools — get, validate, diff, provenance, and the approval gate on set"
pack: "mcp_tools_extended"
tags:
  - "config"
  - "subsystem:tools"
  - "entity:exaix_config_get"
  - "entity:exaix_config_validate"
  - "entity:exaix_config_diff"
  - "entity:exaix_config_get_provenance"
  - "entity:exaix_config_set"
  - "entity:exaix_config_apply"
request_fixture: "fixtures/requests/mcp_tools_extended/exaix_config_get.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-portal"
    type: "run-script"
    name: "Create the fixture portal and its config"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - "$FRAMEWORK_HOME/scripts/setup_tools_portal.ts"
      - "$WORKSPACE_ROOT"
      - "$FRAMEWORK_HOME/fixtures/portals/tools_pack"
    output_criteria:
      - id: "portal-ready"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "read-side-config-tools"
    type: "run-script"
    name: "get, validate, diff and provenance return real config state"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "exaix_config_get"
      - '{"key":"ai.provider","identity_id":"tools-eval"}'
      - "exaix_config_validate"
      - '{"identity_id":"tools-eval"}'
      - "exaix_config_diff"
      - '{"identity_id":"tools-eval"}'
      - "exaix_config_get_provenance"
      - '{"key":"ai.provider","identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "config-get-returns-key-and-value"
        kind: "command-output-contains"
        contains: ["ai.provider"]
        score_weight: 0.8
      - id: "config-validate-reports-valid"
        kind: "command-output-contains"
        contains: ["All config keys are valid."]
        score_weight: 0.7
      - id: "config-diff-returns-structure"
        kind: "command-output-contains"
        contains: ["overridden", "added", "missing"]
        score_weight: 0.7
      - id: "provenance-names-its-source"
        kind: "command-output-contains"
        contains: ["Source: registry"]
        score_weight: 0.7
      - id: "all-read-calls-succeeded"
        kind: "command-output-contains"
        contains: ["\"success\": true"]
        score_weight: 0.6

  - id: "dangerous-set-requires-confirmation"
    type: "run-script"
    name: "[security] a dangerous-tier config_set stages the change behind a confirmation gate"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "exaix_config_set"
      - '{"key":"ai.provider","value":"mock","identity_id":"tools-eval"}'
      - "exaix_config_get"
      - '{"key":"ai.provider","identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "set-is-staged-not-applied"
        kind: "command-output-contains"
        contains: ["Run exaix_config_apply to activate", "requires_confirmation"]
        score_weight: 1.0
      - id: "dangerous-tier-flagged"
        kind: "command-output-contains"
        contains: ["dangerous"]
        score_weight: 0.8
