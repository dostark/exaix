schema_version: "1.0.0"
id: "tools-config-operations"
title: "Config tools — get, validate, diff, provenance operations"
pack: "mcp_tools_extended"
tags:
  - "config"
  - "subsystem:tools"
  - "entity:exaix_config_get"
  - "entity:exaix_config_validate"
  - "entity:exaix_config_diff"
  - "entity:exaix_config_get_provenance"
  - "entity:exaix_config_set"
  - "entity:exaix_config_apply"
request_fixture: "fixtures/requests/mcp_tools_extended/exaix_config_get.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "verify-config-get"
    type: "exactl"
    command: "config"
    args: ["get", "provider"]
    output_criteria:
      - id: "config-get-works"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "verify-config-validate"
    type: "exactl"
    command: "config"
    args: ["validate"]
    output_criteria:
      - id: "config-validate-works"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "verify-config-diff"
    type: "exactl"
    command: "config"
    args: ["diff"]
    output_criteria:
      - id: "config-diff-works"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
