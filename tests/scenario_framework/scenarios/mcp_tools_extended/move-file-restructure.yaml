schema_version: "1.0.0"
id: "move-file-restructure"
title: "Move file tool relocates files correctly"
pack: "mcp_tools_extended"
tags: ["move_file", "restructure", "write-tools", "subsystem:tools", "entity:move_file"]
request_fixture: "fixtures/requests/mcp_tools_extended/move_file_restructure.md"
mode_support: ["auto", "manual-checkpoint"]
portals: []
steps:
  - id: "setup-test-file"
    type: "shell"
    name: "Create test file and destination directory"
    command: "sh"
    args:
      - "-c"
      - "mkdir -p /tmp/exaix-move-test/src/helpers && echo 'utility' > /tmp/exaix-move-test/src/utils.ts"
    input_criteria: []
    output_criteria:
      - id: "file-created"
        score_weight: 0.4
        kind: "file-exists"
        path: "/tmp/exaix-move-test/src/utils.ts"

  - id: "move-file"
    type: "shell"
    name: "Move the file to its new location"
    command: "mv"
    args: ["/tmp/exaix-move-test/src/utils.ts", "/tmp/exaix-move-test/src/helpers/utils.ts"]
    output_criteria:
      - id: "move-succeeded"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "verify-move"
    type: "shell"
    name: "Verify file is at the new location, absent from the old, and content preserved"
    command: "sh"
    args:
      - "-c"
      - "test ! -f /tmp/exaix-move-test/src/utils.ts && cat /tmp/exaix-move-test/src/helpers/utils.ts"
    output_criteria:
      - id: "file-moved"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0
      - id: "content-preserved"
        score_weight: 0.6
        kind: "command-output-contains"
        contains: ["utility"]
      - id: "source-absent"
        score_weight: 0.5
        kind: "file-not-exists"
        path: "/tmp/exaix-move-test/src/utils.ts"

  - id: "cleanup"
    type: "shell"
    name: "Clean up test directory"
    command: "rm"
    args: ["-rf", "/tmp/exaix-move-test"]
    input_criteria: []
    output_criteria: []
