schema_version: "1.0.0"
id: "write-file-roundtrip"
title: "Write file tool creates new files"
pack: "mcp_tools_extended"
tags: ["write_file", "write", "subsystem:tools", "entity:write_file"]
request_fixture: "fixtures/requests/mcp_tools_extended/write_file.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup"
    type: "shell"
    command: "mkdir"
    args: ["-p", "/tmp/exaix-write-test"]
    output_criteria:
      - id: "setup-done"
        kind: "command-exit-code"
        equals: 0
  - id: "write-and-verify"
    type: "shell"
    command: "sh"
    args: ["-c", "echo 'write test content' > /tmp/exaix-write-test/out.txt && cat /tmp/exaix-write-test/out.txt"]
    output_criteria:
      - id: "write-verified"
        kind: "command-output-contains"
        contains: ["write test content"]
        score_weight: 1.0
  - id: "cleanup"
    type: "shell"
    command: "rm"
    args: ["-rf", "/tmp/exaix-write-test"]
    output_criteria:
      - id: "cleaned"
        kind: "command-exit-code"
        equals: 0
