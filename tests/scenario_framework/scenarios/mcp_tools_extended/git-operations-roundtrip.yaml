schema_version: "1.0.0"
id: "git-operations-roundtrip"
title: "Git tools — branch, commit, status, log, worktree operations"
pack: "mcp_tools_extended"
tags:
  - "git"
  - "roundtrip"
  - "subsystem:tools"
  - "entity:git_create_branch"
  - "entity:git_commit"
  - "entity:git_status"
  - "entity:git_log"
  - "entity:git_worktree"
request_fixture: "fixtures/requests/mcp_tools_extended/git_operations.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "init-repo"
    type: "shell"
    name: "Initialize test git repository"
    command: "sh"
    args:
      - "-c"
      - "rm -rf /tmp/exaix-git-test && mkdir -p /tmp/exaix-git-test && cd /tmp/exaix-git-test && git init && git config user.email test@test.com && git config user.name Tester && echo 'initial' > readme.txt && git add . && git commit -m 'initial commit'"
    output_criteria:
      - id: "repo-initialized"
        kind: "command-output-contains"
        contains: ["initialized"]
        score_weight: 0.3

  - id: "verify-git-status"
    type: "shell"
    name: "Verify git status shows clean state"
    command: "git"
    args: ["-C", "/tmp/exaix-git-test", "status"]
    output_criteria:
      - id: "status-clean"
        kind: "command-output-contains"
        contains: ["nothing to commit"]
        score_weight: 0.4

  - id: "verify-git-branch"
    type: "shell"
    name: "Verify current branch is main"
    command: "git"
    args: ["-C", "/tmp/exaix-git-test", "branch", "--show-current"]
    output_criteria:
      - id: "branch-main"
        kind: "command-output-contains"
        contains: ["main"]
        score_weight: 0.3

  - id: "verify-git-create-branch"
    type: "shell"
    name: "Create and switch to a feature branch"
    command: "git"
    args: ["-C", "/tmp/exaix-git-test", "checkout", "-b", "feature/test"]
    output_criteria:
      - id: "branch-created"
        kind: "command-output-contains"
        contains: ["Switched to a new branch"]
        score_weight: 0.4

  - id: "make-change-and-commit"
    type: "shell"
    name: "Make a change and commit"
    command: "sh"
    args:
      - "-c"
      - "cd /tmp/exaix-git-test && echo 'feature work' >> readme.txt && git add . && git commit -m 'feature commit'"
    output_criteria:
      - id: "commit-made"
        kind: "command-output-contains"
        contains: ["feature commit"]
        score_weight: 0.4

  - id: "verify-git-log"
    type: "shell"
    name: "Verify git log shows commits"
    command: "git"
    args: ["-C", "/tmp/exaix-git-test", "log", "--oneline"]
    output_criteria:
      - id: "log-shows-commits"
        kind: "command-output-contains"
        contains: ["feature commit", "initial commit"]
        score_weight: 0.4

  - id: "verify-git-worktree"
    type: "shell"
    name: "Verify worktree add"
    command: "sh"
    args:
      - "-c"
      - "cd /tmp/exaix-git-test && git worktree add /tmp/exaix-wt-test main 2>&1 || true"
    output_criteria:
      - id: "worktree-added"
        kind: "command-output-contains"
        contains: ["Preparing"]
        score_weight: 0.3

  - id: "cleanup"
    type: "shell"
    name: "Clean up test repos"
    command: "sh"
    args:
      - "-c"
      - "rm -rf /tmp/exaix-git-test /tmp/exaix-wt-test"
    output_criteria:
      - id: "cleaned"
        kind: "command-exit-code"
        equals: 0
