schema_version: "1.0.0"
# Phase 156 Step 5: Converted from a git-CLI surrogate to real tools/call round-trips.
# The git_* handlers are now routed through IGitService (validateArgs + runGitCommand).
id: "git-operations-roundtrip"
title: "Git tools — real tools/call round-trips through IGitService (Phase 156)"
pack: "mcp_tools_extended"
tags:
  - "git"
  - "roundtrip"
  - "subsystem:tools"
  - "entity:git_create_branch"
  - "entity:git_commit"
  - "entity:git_status"
  - "entity:git_log"
  - "entity:git_worktree"
request_fixture: "fixtures/requests/mcp_tools_extended/git_operations.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-tools-portal"
    type: "shell"
    name: "Setup tools portal with git repository"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/setup_tools_portal.ts"
      - "$WORKSPACE_ROOT"
      - "$FRAMEWORK_HOME/fixtures/portals/tools_pack"
    env:
      MCP_GIT_INIT: "1"
    output_criteria:
      - id: "portal-setup"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5

  - id: "tool-git-status"
    type: "shell"
    name: "Call git_status through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_status"
      - '{"portal":"tools","identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "status-returns"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "tool-git-create-branch"
    type: "shell"
    name: "Call git_create_branch through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_create_branch"
      - '{"portal":"tools","branch":"feat/test","identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "branch-created"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "write-test-file"
    type: "shell"
    name: "Write a file for git_commit"
    command: "sh"
    args:
      - "-c"
      - "echo feature work >> $WORKSPACE_ROOT/tools-portal/src/greeting.txt"
    output_criteria:
      - id: "file-written"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  - id: "tool-git-commit"
    type: "shell"
    name: "Call git_commit through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_commit"
      - '{"portal":"tools","message":"feat: add feature work","identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "commit-made"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.4

  - id: "tool-git-log"
    type: "shell"
    name: "Call git_log through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_log"
      - '{"portal":"tools","format":"oneline","max_count":5,"identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "log-shows-commits"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "tool-git-worktree-add"
    type: "shell"
    name: "Call git_worktree add through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_worktree"
      - '{"portal":"tools","action":"add","path":"wt-test","branch":"feat/wt-test","force":true,"identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "worktree-added"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "tool-git-worktree-list"
    type: "shell"
    name: "Call git_worktree list through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_worktree"
      - '{"portal":"tools","action":"list","porcelain":true,"identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "worktree-listed"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "tool-git-worktree-remove"
    type: "shell"
    name: "Call git_worktree remove through MCP"
    command: "deno"
    args:
      - "run"
      - "--allow-all"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "git_worktree"
      - '{"portal":"tools","action":"remove","path":"wt-test","force":true,"identity_id":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
      EXA_MCP_REAL_GIT: "1"
    output_criteria:
      - id: "worktree-removed"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2
