schema_version: "1.0.0"
# Asserts query_symbols end to end through the real MCP server. It refuses before the portal has been analyzed,
# then serves the persisted symbolMap once knowledge.json exists, ranked by pageRankScore and filterable by name substring, kind and limit.
# It is the scenario tests/eval/tool_eval_parity_test.ts requires every docs-visible tool to carry (entity:<tool-name>).
id: "tools-portal-symbols"
title: "Domain tool — query_symbols serves a portal's persisted code symbols"
pack: "mcp_tools_extended"
tags: ["domain", "subsystem:tools", "entity:query_symbols"]
request_fixture: "fixtures/requests/mcp_tools_extended/exaix_create_request.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-portal"
    type: "run-script"
    name: "Create the fixture portal and its config"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/setup_tools_portal.ts"
      - "$WORKSPACE_ROOT"
      - "$FRAMEWORK_HOME/fixtures/portals/tools_pack"
    output_criteria:
      - id: "portal-ready"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.2

  # Clears the fixture knowledge.json that a prior run in a reused sandbox may have written,
  # so the "not yet analyzed" step is deterministic regardless of run history.
  - id: "clean-knowledge-fixture"
    type: "remove-files"
    name: "Clear any knowledge.json left over from a prior run of this scenario"
    args: ["Memory/Projects/tools/knowledge.json"]

  - id: "not-yet-analyzed"
    type: "run-script"
    name: "query_symbols refuses before the portal has ever been analyzed"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "query_symbols"
      - '{"portal":"tools","agent_role":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "not-analyzed-error-surfaced"
        kind: "command-output-contains"
        contains: ["has not been analyzed", "\"isError\": true", "\"success\": false"]
        score_weight: 0.8

  # A small hand-written symbolMap stands in for a real `portal analyze --mode standard` run, which populates this file in production.
  # Writing it directly keeps the scenario fast and focused on the tool's read, filter and rank contract. scenarios/portal_knowledge/portal-knowledge-strategies.yaml covers the extraction path.
  - id: "write-knowledge-fixture"
    type: "write-file"
    name: "Seed Memory/Projects/tools/knowledge.json with a small real symbolMap"
    path: "Memory/Projects/tools/knowledge.json"
    content: |
      {
        "portal": "tools",
        "gatheredAt": "2026-01-01T00:00:00.000Z",
        "version": 1,
        "architectureOverview": "A tiny fixture portal used to exercise MCP tools end to end.",
        "layers": [],
        "keyFiles": [],
        "conventions": [],
        "dependencies": [],
        "techStack": { "primaryLanguage": "typescript" },
        "symbolMap": [
          { "name": "greet", "kind": "function", "file": "src/main.ts", "signature": "function greet(name: string): string", "doc": "Greets a user by name.", "pageRankScore": 5 },
          { "name": "Greeter", "kind": "class", "file": "src/main.ts", "signature": "class Greeter", "pageRankScore": 3 },
          { "name": "HelperOptions", "kind": "interface", "file": "src/helper.test.ts", "signature": "interface HelperOptions", "pageRankScore": 1 },
          { "name": "MAX_RETRIES", "kind": "const", "file": "src/main.ts", "signature": "const MAX_RETRIES: number", "pageRankScore": 0.5 }
        ],
        "stats": { "totalFiles": 3, "totalDirectories": 2, "extensionDistribution": { ".ts": 3 } },
        "metadata": { "durationMs": 5, "mode": "standard", "filesScanned": 3, "filesRead": 3 }
      }
    output_criteria:
      - id: "knowledge-fixture-written"
        kind: "file-found"
        path_pattern: "Memory/Projects/tools/knowledge.json"
        score_weight: 0.2

  - id: "query-all-symbols"
    type: "run-script"
    name: "query_symbols ranks results by pageRankScore descending"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "query_symbols"
      - '{"portal":"tools","agent_role":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "top-symbol-is-highest-ranked"
        kind: "command-output-contains"
        contains: ["\"name\": \"greet\"", "\"success\": true"]
        score_weight: 1.0

  - id: "query-filtered-by-kind"
    type: "run-script"
    name: "query_symbols filters by symbol kind"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "query_symbols"
      - '{"portal":"tools","agent_role":"tools-eval","kind":"interface"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "kind-filter-matches"
        kind: "command-output-contains"
        contains: ["HelperOptions"]
        score_weight: 0.7

  - id: "query-filtered-by-name-and-limit"
    type: "run-script"
    name: "query_symbols combines a legacy {query} name-substring filter with limit (parameter alias)"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$REPO_ROOT/deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "query_symbols"
      - '{"portal":"tools","agent_role":"tools-eval","query":"greet","limit":1}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "query-matches-substring"
        kind: "command-output-contains"
        contains: ["\"name\": \"greet\""]
        score_weight: 0.6
      - id: "limit-excludes-lower-ranked-match"
        kind: "command-output-not-contains"
        not_contains: ["Greeter"]
        score_weight: 0.4
