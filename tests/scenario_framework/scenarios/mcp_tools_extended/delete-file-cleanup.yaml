schema_version: "1.0.0"
# Asserts delete_file removes a file through the tool handler and that a later read_file
# reports NOT_FOUND. The previous version ran `rm -f` and tested `test ! -f`.
id: "delete-file-cleanup"
title: "delete_file removes a file the tools can no longer read"
pack: "mcp_tools_extended"
tags: ["delete_file", "cleanup", "write-tools", "subsystem:tools", "entity:delete_file"]
request_fixture: "fixtures/requests/mcp_tools_extended/delete_file_cleanup.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-portal"
    type: "run-script"
    name: "Create the fixture portal and its config"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - "$FRAMEWORK_HOME/scripts/setup_tools_portal.ts"
      - "$WORKSPACE_ROOT"
      - "$FRAMEWORK_HOME/fixtures/portals/tools_pack"
    output_criteria:
      - id: "portal-ready"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.3

  - id: "delete-then-verify"
    type: "run-script"
    name: "delete_file removes the target; a sibling file is untouched"
    command: "deno"
    args:
      - "run"
      - "-A"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - "$FRAMEWORK_HOME/scripts/call_mcp_tool.ts"
      - "delete_file"
      - '{"portal":"tools","path":"src/helper.test.ts","agent_role":"tools-eval"}'
      - "read_file"
      - '{"portal":"tools","path":"src/helper.test.ts","agent_role":"tools-eval"}'
      - "list_directory"
      - '{"portal":"tools","path":"src","agent_role":"tools-eval"}'
    env:
      EXA_CONFIG_PATH: "$WORKSPACE_ROOT/tools_pack.config.toml"
    output_criteria:
      - id: "delete-reported-success"
        kind: "command-output-contains"
        contains: ["delete_file success on src/helper.test.ts"]
        score_weight: 0.7
      - id: "deleted-file-unreadable"
        kind: "command-output-contains"
        contains: ["File not found: src/helper.test.ts"]
        score_weight: 1.0
      - id: "siblings-survived"
        kind: "command-output-contains"
        contains: ["greeting.txt", "main.ts"]
        score_weight: 0.7
