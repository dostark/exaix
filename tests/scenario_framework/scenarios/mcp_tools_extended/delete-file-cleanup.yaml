schema_version: "1.0.0"
id: "delete-file-cleanup"
title: "Delete file tool removes files safely"
pack: "mcp_tools_extended"
tags: ["delete_file", "cleanup", "write-tools", "subsystem:tools", "entity:delete_file"]
request_fixture: "fixtures/requests/mcp_tools_extended/delete_file_cleanup.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "setup-test-file"
    type: "shell"
    name: "Create test file to delete"
    command: "sh"
    args:
      - "-c"
      - "mkdir -p /tmp/exaix-delete-test/src && echo 'deprecated' > /tmp/exaix-delete-test/src/deprecated.ts"
    input_criteria: []
    output_criteria:
      - id: "file-created"
        score_weight: 0.4
        kind: "file-exists"
        path: "/tmp/exaix-delete-test/src/deprecated.ts"

  - id: "delete-target"
    type: "shell"
    name: "Delete the target file"
    command: "rm"
    args: ["-f", "/tmp/exaix-delete-test/src/deprecated.ts"]
    output_criteria:
      - id: "delete-succeeded"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "verify-deletion"
    type: "shell"
    name: "Verify the file is gone and its parent directory survived"
    command: "sh"
    args:
      - "-c"
      - "test ! -f /tmp/exaix-delete-test/src/deprecated.ts && test -d /tmp/exaix-delete-test/src"
    output_criteria:
      - id: "file-deleted"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0
      - id: "file-absent"
        score_weight: 0.5
        kind: "file-not-exists"
        path: "/tmp/exaix-delete-test/src/deprecated.ts"

  - id: "cleanup"
    type: "shell"
    name: "Clean up test directory"
    command: "rm"
    args: ["-rf", "/tmp/exaix-delete-test"]
    input_criteria: []
    output_criteria: []
