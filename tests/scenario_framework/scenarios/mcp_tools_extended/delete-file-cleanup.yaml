schema_version: "1.0.0"
id: "delete-file-cleanup"
title: "Delete file tool removes files safely"
pack: "mcp_tools_extended"
tags: ["delete_file", "cleanup", "write-tools"]
request_fixture: "fixtures/requests/mcp_tools_extended/delete_file_cleanup.md"
mode_support: ["auto"]
portals: []
flow_fixture: "fixtures/flows/mcp_tools_extended/delete_file.flow.yaml"
steps:
  - id: "setup-test-file"
    type: "shell"
    name: "Create test file to delete"
    command: "sh"
    args:
      - "-c"
      - "mkdir -p /tmp/sample-project/src && echo 'deprecated' > /tmp/sample-project/src/deprecated.ts"
    input_criteria: []
    output_criteria:
      - id: "file-created"
        score_weight: 0.4
        kind: "file-found"
        path_pattern: "/tmp/sample-project/src/deprecated.ts"

  - id: "execute-flow"
    type: "exactl"
    name: "Run delete file flow"
    command: "flow"
    args: ["run", "$FLOW_FIXTURE", "--request", "$REQUEST_FIXTURE"]
    output_criteria:
      - id: "flow-execution-succeeded"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "verify-deletion"
    type: "shell"
    name: "Verify file was deleted"
    command: "test"
    args: ["!", "-f", "/tmp/sample-project/src/deprecated.ts"]
    output_criteria:
      - id: "file-deleted"
        score_weight: 0.7
        kind: "command-exit-code"
        equals: 0

  - id: "cleanup"
    type: "shell"
    name: "Clean up test directory"
    command: "rm"
    args: ["-rf", "/tmp/sample-project"]
    input_criteria: []
    output_criteria: []
