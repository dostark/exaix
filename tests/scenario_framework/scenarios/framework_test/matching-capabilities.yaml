schema_version: "1.0.0"
id: framework-matching-validation
title: Validate regex flags and fuzzy text similarity
pack: framework_test
tags: [criteria, framework]
request_fixture: fixtures/requests/framework_test/regex_test.md
mode_support: [auto]
portals: []

steps:
  - id: create-readme
    type: write-file
    path: README.md
    content: |
      # Exa-Test README for project features

      Exa-Test README for project features.

      ## Features
      - Feature 1: This is a bullet points
      - Feature 2: Another bullet points
      - Feature 3: Final bullet points
    input_criteria: []
    output_criteria:
      - id: regex-case-insensitive
        score_weight: 0.6
        kind: text-matches
        path: "README.md"
        flags: "i"
        matches:
          - "exa-test" # Should pass even if LLM writes "Exa-Test"
      - id: regex-dotall
        score_weight: 0.6
        kind: text-matches
        path: "README.md"
        flags: "s"
        matches:
          - "Features.*bullet points" # Should pass across multiple lines
      - id: fuzzy-body-match
        score_weight: 0.5
        kind: text-contains
        path: "README.md"
        contains: "Exa-Test README for project features"
        similarity_threshold: 0.7
