schema_version: "1.0.0"
id: framework-smoke-validation
title: Validate framework execution and evidence collection
pack: framework_test
tags: [smoke, framework]
request_fixture: fixtures/requests/framework_test/smoke.md
mode_support: [auto]

portals:
  # The repository root, reached the way the other 14 portal declarations reach it. This was
  # "$HOME/git/Exaix" — a path that exists on no machine whose checkout is not named `Exaix`,
  # which put a guaranteed failure into the per-PR ci-smoke tier.
  - alias: portal-exaix
    source_path: "$FRAMEWORK_HOME/../.."

steps:
  - id: cleanup-workspace
    type: shell
    name: "Clean up existing analysis artifacts"
    command: "sh"
    args: ["-c", "rm -f $WORKSPACE_ROOT/Workspace/Requests/*_analysis.json"]
    input_criteria: []
    output_criteria: []

  - id: execute-analysis
    type: exactl
    name: "Run request analysis"
    command: "request"
    args: ["--analyze", "--engine", "llm", "--file", "$REQUEST_FIXTURE", "--portal", "portal-exaix"]
    input_criteria: []
    output_criteria:
      - id: request-created
        score_weight: 0.7
        kind: command-exit-code
        equals: 0

  - id: wait-for-analysis
    type: wait-for-file
    name: "Wait for analysis artifact"
    args: ["**/*_analysis.json"]
    timeout_sec: 120
    input_criteria: []
    output_criteria:
      - id: analysis-file-created
        score_weight: 0.5
        kind: file-found
        path_pattern: "**/*_analysis.json"

  - id: verify-analysis
    type: json-assert
    name: "Verify analysis content"
    file_pattern: "**/*_analysis.json"
    input_criteria:
      - id: analysis-file-exists
        score_weight: 0.4
        kind: file-found
        path_pattern: "**/*_analysis.json"
    output_criteria:
      - id: verify-goal-extraction
        score_weight: 0.8
        kind: json-path-equals
        path: "$.goals[0].description"
        equals: "Analyze the core architecture of the Exaix Scenario Framework"
        similarity_threshold: 0.8

  - id: check-journal
    type: journal-assert
    name: "Verify quality pipeline execution"
    input_criteria: []
    output_criteria:
      - id: event-logged
        score_weight: 0.6
        kind: journal-event-exists
        event_type: "request.analyzed"
