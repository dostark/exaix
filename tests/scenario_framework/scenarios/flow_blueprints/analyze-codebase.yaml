schema_version: "1.0.0"
id: "analyze-codebase"
title: "Flow blueprint — analyze-codebase"
pack: "flow_blueprints"
edition: "team"
tags: ["subsystem:flows", "entity:analyze-codebase.flow"]
request_fixture: "fixtures/requests/flow_blueprints/analyze-codebase.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      MOCK_STRICT: "1"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-completion"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.5

  - id: "assert-completed-steps"
    type: "journal-assert"
    action_type: "flow.step.completed"
    trace_scoped: true
    expect_count: 2
    output_criteria:
      - id: "steps-completed"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5

  - id: "assert-dynamic-exploration"
    type: "journal-assert"
    action_type: "dynamic_step_completed"
    trace_scoped: true
    expect_count: 1
    payload_equals:
      - path: iterations
        value: 1
      - path: toolCallCount
        value: 0
    output_criteria:
      - id: "dynamic-exploration-completed"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
