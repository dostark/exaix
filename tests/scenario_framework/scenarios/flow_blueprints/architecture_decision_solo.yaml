schema_version: "1.0.0"
id: architecture-decision-solo
title: Solo refuses the architecture decision before any flow step starts
pack: flow_blueprints
tags: ["subsystem:flows", "entity:architecture-decision.flow", "capability-refusal"]
edition: solo
request_fixture: fixtures/requests/flow_blueprints/architecture_decision.md
mode_support: [auto]
portals:
  - alias: architecture-fixture
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/architecture-fixture"
    git_init: true
steps:
  - id: start-daemon
    type: exactl
    command: daemon
    args: [start]
    env: { EXA_LLM_PROVIDER: mock, MOCK_STRICT: "1", EXA_CI_MODE: "1" }
    output_criteria:
      - id: started
        kind: command-output-contains
        contains: [daemon.started]
  - id: submit
    type: exactl
    command: request
    args: [--file, "$REQUEST_FIXTURE"]
    output_criteria:
      - id: submitted
        kind: command-exit-code
        equals: 0
  - id: await-terminal
    type: exactl
    command: journal
    args: [wait, --event, request.failed, --since-rowid, "$STEP_BASELINE", --timeout, "30"]
    timeout_sec: 35
    output_criteria:
      - id: refused
        kind: command-exit-code
        equals: 0
  - id: assert-capability-refusal
    type: journal-assert
    action_type: flow.failed
    payload_contains: ['"reasonCode":"capability_unavailable"']
    output_criteria:
      - id: capability-reason
        kind: command-exit-code
        equals: 0
  - id: stop-daemon
    type: exactl
    command: daemon
    args: [stop]
    output_criteria:
      - id: stopped
        kind: command-exit-code
        equals: 0
