schema_version: "1.0.0"
id: "dogfood_loop"
title: "Flow blueprint — dogfood_loop"
pack: "flow_blueprints"
tags: ["subsystem:flows", "entity:dogfood-loop.flow"]
request_fixture: "fixtures/requests/flow_blueprints/dogfood_loop.md"
mode_support: ["auto"]
portals:
  - alias: blueprint-project
    source_path: "$FRAMEWORK_HOME/fixtures/portals/simple_repo"
    target_path: "$WORKSPACE_ROOT/blueprint-project"
    git_init: true
bindings:
  "flow:dogfood-loop/step:implement":
    service: claude-code
    service_model_id: dogfood_loop__submit-flow-request__implement__0
  "flow:dogfood-loop/step:review":
    service: claude-code
    service_model_id: dogfood_loop__submit-flow-request__review__0

steps:
  - id: "prepare-delegate"
    type: "run-script"
    command: "deno"
    args:
      - eval
      - |
          await Deno.mkdir(".mock-cli", { recursive: true });
          await Deno.remove(".mock-cli/claude").catch(() => {});
          await Deno.symlink("$FRAMEWORK_HOME/fixtures/cli/flow_blueprint_delegate.ts", ".mock-cli/claude");
    output_criteria:
      - id: "delegate-prepared"
        kind: "command-exit-code"
        equals: 0

  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      PATH: "$WORKSPACE_ROOT/.mock-cli:$PATH"
      EXA_CONFIG_PATH: "$FRAMEWORK_HOME/fixtures/flow_blueprints/cli_delegate.toml"
      EXA_LLM_PROVIDER: "mock"
      MOCK_STRICT: "1"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE", "--portal", "blueprint-project"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-completion"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.5

  - id: "assert-delegate-steps"
    type: "journal-assert"
    action_type: "flow.step.completed"
    trace_scoped: true
    expect_count: 2
    payload_equals:
      - path: strategy
        value: cli_delegate
    output_criteria:
      - id: "delegates-completed"
        kind: "command-exit-code"
        equals: 0
        score_weight: 0.5

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
