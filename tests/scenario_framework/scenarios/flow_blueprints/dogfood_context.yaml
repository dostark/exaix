schema_version: "1.0.0"
id: "dogfood_context"
title: "Flow blueprint — dogfood_context: real daemon + exactl request inspect round trip"
pack: "flow_blueprints"
tags: ["dogfood-context", "entity:phase-176"]
request_fixture: "fixtures/requests/flow_blueprints/dogfood_context.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      MOCK_STRICT: "1"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.2
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.2
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.2

  # ── exactl request inspect against the produced trace ───────────────────
  # A request/plan alone never spawns a CLI delegate — dogfood-context capture
  # only happens at plan-EXECUTION time (native headless launch), which this
  # CI-safe, mock-provider tier never triggers (see the phase-176 plan's Step 4
  # Known Deviations note). The honest, real assertion here is that `exactl
  # request inspect` is genuinely reachable through this declarative runner and
  # reports the true no_capture (exit 3) result for a trace that never reached a
  # dogfood launch — never a fabricated success.
  - id: "inspect-produced-trace"
    type: "run-script"
    name: "exactl request inspect reports a real, honest no_capture for a plan-only trace"
    command: "deno"
    args:
      - "eval"
      - "--config"
      - "$FRAMEWORK_HOME/../../deno.json"
      - |
          const planFiles = [...Deno.readDirSync("Workspace/Plans")]
            .filter((e) => e.isFile && e.name.endsWith("_plan.md"))
            .map((e) => `Workspace/Plans/${e.name}`);
          if (planFiles.length === 0) {
            console.error("FAILED: no plan file found");
            Deno.exit(1);
          }
          const planText = Deno.readTextFileSync(planFiles[0]);
          const match = planText.match(/trace_id:\s*"?([0-9a-fA-F-]{36})"?/);
          if (!match) {
            console.error(`FAILED: no trace_id found in ${planFiles[0]}`);
            Deno.exit(1);
          }
          const traceId = match[1];

          const cmd = new Deno.Command(Deno.execPath(), {
            args: ["run", "-A", "$FRAMEWORK_HOME/../../apps/exactl/src/exactl.ts", "request", "inspect", traceId, "--json"],
            stdout: "piped",
            stderr: "piped",
          });
          const { code, stderr } = await cmd.output();
          const errText = new TextDecoder().decode(stderr);
          if (code !== 3) {
            console.error(`FAILED: expected exit 3 (no_capture), got ${code}. stderr: ${errText}`);
            Deno.exit(1);
          }
          if (!errText.toLowerCase().includes("no captured context")) {
            console.error(`FAILED: expected a no_capture message, got: ${errText}`);
            Deno.exit(1);
          }
          console.log(`PASSED: exactl request inspect ${traceId} reported real no_capture (exit 3)`);
    output_criteria:
      - id: "inspect-reported-honest-no-capture"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["PASSED: exactl request inspect"]
      - id: "inspect-script-exit-code"
        score_weight: 0.1
        kind: "command-exit-code"
        equals: 0

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
