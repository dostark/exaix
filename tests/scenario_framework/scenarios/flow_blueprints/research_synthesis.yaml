schema_version: "1.0.0"
id: "research_synthesis"
title: "Flow blueprint — research_synthesis"
pack: "flow_blueprints"
tags: ["subsystem:flows", "entity:research-synthesis.flow"]
request_fixture: "fixtures/requests/flow_blueprints/research_synthesis.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      MOCK_STRICT: "1"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-flow-request"
    type: "exactl"
    command: "request"
    args: ["--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-completion"
    type: "wait-for-file"
    args: ["**/Plans/*_plan.md"]
    # assess-quality's identity (quality-judge) has its own strict raw-JSON-verdict contract
    # that occasionally conflicts with the flow-step output wrapper a real model is asked for
    # (verified live: refused on 2/2 capture attempts once, complied on other runs) — a
    # stochastic single-call outcome, not a deterministic format/identity mismatch (three other
    # quality-judge-terminated flows in this pack comply reliably). Fail fast on rejection
    # instead of burning the full timeout waiting for a plan that a rejected request will never
    # produce.
    failure_glob: "**/Rejected/*_rejected.md"
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/Plans/*_plan.md"
        score_weight: 0.5

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
