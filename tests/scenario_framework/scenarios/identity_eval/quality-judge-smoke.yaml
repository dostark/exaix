schema_version: "1.0.0"
id: "quality-judge-smoke"
title: "quality-judge structural smoke — plan structure validation on mock provider"
pack: "identity_eval"
tags: ["smoke", "subsystem:identities", "entity:quality-judge"]
request_fixture: "fixtures/requests/provider_live/quality_judge.md"
mode_support: ["auto"]
portals: []

steps:
  - id: "start-daemon"
    type: "exactl"
    command: "daemon"
    args: ["start"]
    env:
      EXA_LLM_PROVIDER: "mock"
      EXA_CI_MODE: "1"
    output_criteria:
      - id: "daemon-started"
        score_weight: 0.3
        kind: "command-output-contains"
        contains: ["daemon.started"]

  - id: "submit-request"
    type: "exactl"
    command: "request"
    args: ["--identity", "quality-judge", "--plan-only", "--file", "$REQUEST_FIXTURE"]
    env:
      EXA_LLM_PROVIDER: "mock"
    output_criteria:
      - id: "request-submitted"
        score_weight: 0.4
        kind: "command-exit-code"
        equals: 0

  - id: "wait-for-plan"
    type: "wait-for-file"
    args: ["**/*_plan.yaml"]
    timeout_sec: 120
    output_criteria:
      - id: "plan-produced"
        kind: "file-found"
        path_pattern: "**/*_plan.yaml"
        score_weight: 0.5

  - id: "validate-plan-structure"
    type: "json-assert"
    file_pattern: "**/*_plan.yaml"
    output_criteria:
      - id: "has-steps"
        score_weight: 0.8
        kind: "json-path-exists"
        path: "$.steps[0]"
      - id: "has-title"
        score_weight: 0.5
        kind: "json-path-exists"
        path: "$.title"

  - id: "stop-daemon"
    type: "exactl"
    command: "daemon"
    args: ["stop"]
    output_criteria:
      - id: "daemon-stopped"
        kind: "command-exit-code"
        equals: 0
