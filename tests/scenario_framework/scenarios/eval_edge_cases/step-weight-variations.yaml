schema_version: "1.0.0"
id: "eval-edge-step-weights"
title: "Step weight variations — verifies suite score with weighted steps"
pack: "eval_edge_cases"
tags: ["eval", "scoring", "edge"]
request_fixture: "fixtures/requests/eval_edge_cases/step-weight-variations.md"
mode_support: ["auto"]
portals: []
steps:
  - id: "step-a"
    type: "shell"
    command: "sh"
    args:
      - "-c"
      - |
          echo "present" > $WORKSPACE_ROOT/step-a-file.txt
    step_weight: 0.8
    output_criteria:
      - id: "step-a-file"
        kind: "file-exists"
        path: "step-a-file.txt"
  - id: "step-b"
    type: "shell"
    command: "sh"
    args:
      - "-c"
      - |
          echo "present" > $WORKSPACE_ROOT/step-b-file.txt
    step_weight: 0.2
    output_criteria:
      - id: "step-b-missing"
        kind: "file-exists"
        path: "step-b-non-existent.txt"
