# ===========================================================================
# Exaix Configuration File — Bootstrap Only
# ===========================================================================
#
# As of Phase 137, most settings are managed through the Config DB via
# `exactl config set <key> <value>`. This file now serves only as a
# bootstrap — providing `system.root`, `schema_version`, and portal entries.
#
# Run `exactl config show` to see all effective settings.
# Run `exactl config set <key> <value>` to override any of the ~180
# configurable defaults (AI timeouts, retries, rate limits, health checks,
# cost tracking, quality gates, git operations, etc.).
#
# Configurable keys (partial list — run `exactl config get <key>`):
#   ai.timeout_ms, ai.retry.max_attempts, ai.model, ai.provider
#   agent.timeout_sec, agent.max_iterations, agent.timeout_ms
#   database.batch_flush_ms, database.busy_timeout_ms
#   git.status_timeout_ms, git.max_retries, rate_limit.*
#   health.*, provider_strategy.*, logging.*, quality_gate.*
#   skills.*, session.*, mcp.*, watcher.*, and many more
#
# ===========================================================================
# Environment Variables (bootstrap + provider secrets only)
# ===========================================================================
#
# EXAIX_EDITION            : Edition: "solo" | "team" (default: solo)
# EXAIX_AGENT_ENTRYPOINT   : Path to agent entrypoint for MCP strategy
# ANTHROPIC_API_KEY        : API key for Anthropic provider
# OPENAI_API_KEY            : API key for OpenAI provider
# OPENROUTER_API_KEY        : API key for OpenRouter provider
# VERTEX_AI_SERVICE_ACCOUNT : Service account JSON for Vertex AI
#
# Testing:
#   EXA_TEST_MODE          : Set to "1" to enable test mode
#   EXA_CI_MODE            : Set to "1" to enforce CI behaviors
#
# All other env vars (EXA_LLM_PROVIDER, EXA_LLM_MODEL, etc.) are
# deprecated. Use `exactl config set` instead.
#
# ===========================================================================

[system]
schema_version = "1.0.0"
root = "./"

# ── Example portals ────────────────────────────────────────────────────
# Portals bootstrap is handled through this file. Add one [[portals]] per repo.
[[portals]]
alias = "my-repo"
target_path = "/home/me/projects/my-repo"
# default_branch = "main"
# execution_strategy = "branch"

# ── Notes ──────────────────────────────────────────────────────────────
# Run `exactl config show` to see all ~180 configurable settings.
# Run `exactl config set <key> <value>` to override any setting.
# Run `exactl config --help` for all subcommands (get, set, unset,
# validate, show, diff, set-model, set-provider, set-path, use-profile).
#
# All settings not listed here (AI timeouts, retries, rate limits,
# health checks, cost tracking, quality gates, git operations, etc.)
# are registered via configurable() and visible through the Config DB.
# Use `exactl config set` to override them — no TOML editing needed.
